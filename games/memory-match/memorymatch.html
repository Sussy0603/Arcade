<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Memory Match</title>
<style>
:root{
  --bg1:#8ED6E8; --bg2:#FDEBC8;
  --card-back:#FF8A65; --card-back2:#FFB74D;
  --card-face:#FFFFFF;
  --ink:#3D3049;
  --accent:#7C4DFF;
  --good:#4CAF50;
  --pill:#FFFFFF;
  --shadow:0 6px 0 rgba(61,48,73,.18);
  --radius:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Baloo 2','Comic Sans MS','Chalkboard SE','Segoe UI',system-ui,sans-serif;
  background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
  color:var(--ink);
  min-height:100%;
  display:flex; flex-direction:column; align-items:center;
  padding:12px 12px 24px;
  overflow-x:hidden;
  user-select:none;-webkit-user-select:none;
}
header{width:100%;max-width:560px;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;}
h1{font-size:clamp(22px,6vw,32px);letter-spacing:.5px;text-shadow:0 2px 0 rgba(255,255,255,.6);}
h1 .emoji{font-size:.9em;}
.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;color:var(--ink);
  background:var(--pill);border-radius:999px;padding:8px 14px;font-size:15px;
  box-shadow:var(--shadow);transition:transform .1s;
}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(61,48,73,.18);}
.btn.small{padding:6px 10px;font-size:13px;}
.btn.primary{background:var(--accent);color:#fff;}
.topbtns{display:flex;gap:6px;}
.controls{width:100%;max-width:560px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px;}
.seg{display:flex;background:rgba(255,255,255,.55);border-radius:999px;padding:4px;gap:4px;box-shadow:inset 0 2px 4px rgba(61,48,73,.08);}
.seg button{
  border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:14px;color:var(--ink);
  background:transparent;border-radius:999px;padding:6px 12px;transition:background .15s;
}
.seg button.on{background:#fff;box-shadow:0 3px 0 rgba(61,48,73,.15);}
.seg button .ico{font-size:1.05em;}
.hud{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:15px;}
.hud .stat{background:rgba(255,255,255,.6);border-radius:14px;padding:6px 12px;box-shadow:0 3px 0 rgba(61,48,73,.1);}
#board{
  display:grid;gap:10px;width:100%;max-width:560px;
  perspective:900px;
}
.card{
  position:relative;aspect-ratio:3/4;cursor:pointer;border:none;background:transparent;padding:0;
  transform-style:preserve-3d;transition:transform .35s cubic-bezier(.34,1.4,.64,1);
  font-family:inherit;
}
.card.flipped{transform:rotateY(180deg);}
.card .face{
  position:absolute;inset:0;border-radius:var(--radius);backface-visibility:hidden;-webkit-backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
}
.card .back{
  background:linear-gradient(145deg,var(--card-back),var(--card-back2));
  color:rgba(255,255,255,.85);font-size:clamp(20px,6vw,34px);
}
.card .back::after{content:"";position:absolute;inset:8px;border:3px dashed rgba(255,255,255,.5);border-radius:calc(var(--radius) - 8px);}
.card .front{
  background:var(--card-face);transform:rotateY(180deg);
  font-size:clamp(30px,9vw,56px);
}
.card.matched{cursor:default;animation:pop .45s;}
.card.matched .front{background:#E8F8EA;box-shadow:0 6px 0 rgba(76,175,80,.35);}
@keyframes pop{0%{transform:rotateY(180deg) scale(1);}50%{transform:rotateY(180deg) scale(1.12);}100%{transform:rotateY(180deg) scale(1);}}
.card.shake{animation:shake .4s;}
@keyframes shake{0%,100%{transform:rotateY(180deg) translateX(0);}25%{transform:rotateY(180deg) translateX(-6px);}75%{transform:rotateY(180deg) translateX(6px);}}
#winbox{
  display:none;position:fixed;inset:0;background:rgba(61,48,73,.45);z-index:20;
  align-items:center;justify-content:center;padding:20px;
}
#winbox.show{display:flex;}
.wincard{
  background:#fff;border-radius:28px;padding:28px 24px;text-align:center;max-width:340px;width:100%;
  box-shadow:0 12px 0 rgba(61,48,73,.25);animation:bounceIn .5s cubic-bezier(.34,1.5,.64,1);
}
@keyframes bounceIn{from{transform:scale(.6);opacity:0;}to{transform:scale(1);opacity:1;}}
.wincard h2{font-size:28px;margin-bottom:6px;}
.stars{font-size:40px;letter-spacing:4px;margin:8px 0;}
.stars .dim{opacity:.25;}
.wincard p{font-size:16px;margin-bottom:14px;}
.wincard .newbest{color:var(--accent);font-weight:800;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30;}
@media (prefers-reduced-motion:reduce){
  .card{transition:none;} .card.matched, .card.shake, .wincard{animation:none;}
}
footer{margin-top:14px;font-size:12px;opacity:.55;font-weight:600;}
</style>
</head>
<body>
<header>
  <h1><span class="emoji">🧠</span> <span data-i18n="title">Memory Match</span></h1>
  <div class="topbtns">
    <button class="btn small" id="langBtn">FR</button>
    <button class="btn small" id="soundBtn">🔊</button>
  </div>
</header>

<div class="controls">
  <div class="seg" id="sizeSeg">
    <button data-size="easy" class="on"><span class="ico">🐣</span> <span data-i18n="easy">Easy</span></button>
    <button data-size="medium"><span class="ico">🐥</span> <span data-i18n="medium">Medium</span></button>
    <button data-size="hard"><span class="ico">🦉</span> <span data-i18n="hard">Hard</span></button>
  </div>
  <div class="seg" id="themeSeg">
    <button data-theme="animals" class="on">🦁</button>
    <button data-theme="fruits">🍓</button>
    <button data-theme="vehicles">🚗</button>
    <button data-theme="ocean">🐠</button>
    <button data-theme="space">🚀</button>
  </div>
  <button class="btn primary" id="newBtn" data-i18n="new">New Game</button>
</div>

<div class="hud">
  <div class="stat"><span data-i18n="moves">Moves</span>: <span id="moves">0</span></div>
  <div class="stat"><span data-i18n="pairs">Pairs</span>: <span id="found">0</span>/<span id="total">0</span></div>
  <div class="stat"><span data-i18n="best">Best</span>: <span id="best">–</span></div>
</div>

<div id="board" aria-label="game board"></div>

<div id="winbox">
  <div class="wincard">
    <h2 id="winTitle">🎉</h2>
    <div class="stars" id="winStars"></div>
    <p id="winText"></p>
    <button class="btn primary" id="againBtn" data-i18n="again">Play again</button>
  </div>
</div>
<canvas id="confetti"></canvas>
<footer>STeamWorkS · Memory Match</footer>

<script>
"use strict";
/* ---------- i18n ---------- */
const STR = {
  en:{title:"Memory Match",easy:"Easy",medium:"Medium",hard:"Hard",new:"New Game",
      moves:"Moves",pairs:"Pairs",best:"Best",again:"Play again",
      win:"You did it!",winIn:"Finished in {n} moves!",newbest:"New best score!"},
  fr:{title:"Mémo Rigolo",easy:"Facile",medium:"Moyen",hard:"Difficile",new:"Nouvelle partie",
      moves:"Coups",pairs:"Paires",best:"Record",again:"Encore !",
      win:"Bravo !",winIn:"Terminé en {n} coups !",newbest:"Nouveau record !"}
};
/* ---------- data ---------- */
const THEMES = {
  animals:["🦁","🐼","🦊","🐸","🐵","🦒","🐷","🐨","🦄","🐶"],
  fruits:["🍓","🍌","🍉","🍇","🍍","🍎","🍑","🥝","🍒","🍋"],
  vehicles:["🚗","🚒","🚜","🚁","🚂","🛵","🚀","⛵","🚌","🛻"],
  ocean:["🐠","🐙","🦀","🐬","🐢","🦈","🐡","🦞","🐳","🦑"],
  space:["🚀","🪐","⭐","🌙","☄️","👽","🛸","🌍","🌞","🧑‍🚀"]
};
const SIZES = {easy:{cols:3,pairs:3},medium:{cols:4,pairs:6},hard:{cols:5,pairs:10}};
const SKEY = "stws_memorymatch_v1";

/* ---------- state ---------- */
let save = load();
let lang = save.lang || "en";
let soundOn = save.sound !== false;
let size = save.size || "easy";
let theme = save.theme || "animals";
let deck=[], first=null, lock=false, moves=0, found=0, playing=false;

function load(){ try{return JSON.parse(localStorage.getItem(SKEY))||{};}catch(e){return {};} }
function persist(){ save.lang=lang; save.sound=soundOn; save.size=size; save.theme=theme;
  try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){} }

/* ---------- audio ---------- */
let AC=null;
function ac(){ if(!AC){ try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){} } return AC; }
function tone(f,t,dur,type,vol){
  if(!soundOn) return; const c=ac(); if(!c) return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(f,c.currentTime+t);
  g.gain.setValueAtTime(0,c.currentTime+t);
  g.gain.linearRampToValueAtTime(vol||.18,c.currentTime+t+.01);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+t); o.stop(c.currentTime+t+dur+.05);
}
const sFlip=()=>tone(520,0,.09,"triangle",.12);
const sMatch=()=>{tone(523,0,.12,"sine");tone(659,.1,.12,"sine");tone(784,.2,.2,"sine");};
const sMiss=()=>tone(180,0,.25,"sawtooth",.06);
const sWin=()=>{[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,i*.12,.18,"triangle",.15));};

/* ---------- rng ---------- */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- game ---------- */
function buildDeck(sizeKey,themeKey){
  const {pairs}=SIZES[sizeKey];
  const pool=shuffle(THEMES[themeKey].slice()).slice(0,pairs);
  return shuffle(pool.concat(pool).map((e,i)=>({id:i,emoji:e,matched:false})));
}
function newGame(){
  deck=buildDeck(size,theme); first=null; lock=false; moves=0; found=0; playing=true;
  render(); updateHud(); hideWin();
}
function render(){
  const board=document.getElementById("board");
  const {cols,pairs}=SIZES[size];
  board.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  board.innerHTML="";
  deck.forEach((c,idx)=>{
    const b=document.createElement("button");
    b.className="card"; b.dataset.idx=idx;
    b.setAttribute("aria-label","card");
    b.innerHTML=`<div class="face back">?</div><div class="face front">${c.emoji}</div>`;
    b.addEventListener("click",()=>flip(idx,b));
    board.appendChild(b);
  });
  document.getElementById("total").textContent=pairs;
}
function flip(idx,el){
  if(!playing||lock) return;
  const c=deck[idx];
  if(c.matched||first===idx) return;
  el.classList.add("flipped"); sFlip();
  if(first===null){ first=idx; return; }
  moves++; updateHud();
  const a=deck[first], b=c, aEl=cardEl(first), bEl=el;
  if(a.emoji===b.emoji){
    a.matched=b.matched=true; found++;
    aEl.classList.add("matched"); bEl.classList.add("matched");
    sMatch(); first=null; updateHud();
    if(found===SIZES[size].pairs) setTimeout(win,500);
  }else{
    lock=true; sMiss();
    setTimeout(()=>{
      aEl.classList.add("shake"); bEl.classList.add("shake");
      setTimeout(()=>{
        aEl.classList.remove("flipped","shake"); bEl.classList.remove("flipped","shake");
        first=null; lock=false;
      },380);
    },420);
  }
}
function cardEl(idx){ return document.querySelector(`.card[data-idx="${idx}"]`); }
function updateHud(){
  document.getElementById("moves").textContent=moves;
  document.getElementById("found").textContent=found;
  const bk="best_"+size, b=save[bk];
  document.getElementById("best").textContent=b?b:"–";
}
function starCount(){
  const p=SIZES[size].pairs;
  if(moves<=Math.ceil(p*1.5)) return 3;
  if(moves<=p*2.2) return 2;
  return 1;
}
function win(){
  playing=false; sWin(); confetti();
  const bk="best_"+size;
  const isBest=!save[bk]||moves<save[bk];
  if(isBest){ save[bk]=moves; persist(); }
  const s=starCount();
  document.getElementById("winTitle").textContent="🎉 "+STR[lang].win;
  document.getElementById("winStars").innerHTML=
    [1,2,3].map(i=>`<span class="${i<=s?'':'dim'}">⭐</span>`).join("");
  document.getElementById("winText").innerHTML=
    STR[lang].winIn.replace("{n}",moves)+(isBest?`<br><span class="newbest">${STR[lang].newbest}</span>`:"");
  document.getElementById("winbox").classList.add("show");
  updateHud();
}
function hideWin(){ document.getElementById("winbox").classList.remove("show"); }

/* ---------- confetti ---------- */
function confetti(){
  const cv=document.getElementById("confetti"), ctx=cv.getContext&&cv.getContext("2d");
  if(!ctx) return;
  cv.width=innerWidth; cv.height=innerHeight;
  const P=[], colors=["#FF8A65","#7C4DFF","#4CAF50","#FFD54F","#4FC3F7","#F06292"];
  for(let i=0;i<120;i++) P.push({x:Math.random()*cv.width,y:-20-Math.random()*cv.height*.5,
    v:2+Math.random()*3,w:6+Math.random()*6,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.2,
    c:colors[i%colors.length]});
  let t=0;
  (function step(){
    t++; ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p=>{ p.y+=p.v; p.r+=p.vr;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r);
      ctx.fillStyle=p.c; ctx.fillRect(-p.w/2,-p.w/2,p.w,p.w); ctx.restore(); });
    if(t<180) requestAnimationFrame(step); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

/* ---------- ui wiring ---------- */
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent=STR[lang][el.dataset.i18n]; });
  document.getElementById("langBtn").textContent=lang==="en"?"FR":"EN";
}
document.getElementById("langBtn").addEventListener("click",()=>{ lang=lang==="en"?"fr":"en"; persist(); applyLang(); });
document.getElementById("soundBtn").addEventListener("click",e=>{
  soundOn=!soundOn; persist(); e.currentTarget.textContent=soundOn?"🔊":"🔇";
});
document.getElementById("newBtn").addEventListener("click",newGame);
document.getElementById("againBtn").addEventListener("click",newGame);
document.getElementById("sizeSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#sizeSeg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); size=b.dataset.size; persist(); newGame();
});
document.getElementById("themeSeg").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(!b) return;
  document.querySelectorAll("#themeSeg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on"); theme=b.dataset.theme; persist(); newGame();
});
/* restore selections */
document.querySelectorAll("#sizeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.size===size));
document.querySelectorAll("#themeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.theme===theme));
document.getElementById("soundBtn").textContent=soundOn?"🔊":"🔇";
applyLang();
newGame();

/* ---------- test hooks ---------- */
window.__test={buildDeck,SIZES,THEMES,getState:()=>({deck,moves,found,size,theme}),newGame,flipIdx:(i)=>flip(i,cardEl(i))};
</script>
</body>
</html>
