/* ---------------- movement ---------------- */
function canStand(x, y) {
  const r = .3, cx = x + .5, cy = y + .74;
  if (G.mode === 'house') {
    const n = houseSize(G.S);
    if (cx - r < 0 || cy - r < 0 || cx + r > n || cy + r > n) return false;
    for (const it of G.S.house.items) {
      if (furnLayer(it.id) !== 'main') continue;
      if (cx + r > it.x && cx - r < it.x + 1 && cy + r > it.y && cy - r < it.y + 1) return false;
    }
    return true;
  }
  const w = G.S.world;
  for (const [ox, oy] of [[-r, -r], [r, -r], [-r, r], [r, r]])
    if (!isWalkable(w, Math.floor(cx + ox), Math.floor(cy + oy))) return false;
  return true;
}
function facedTile() {
  const [dx, dy] = DIRV[G.player.dir];
  return { x: Math.floor(G.player.x + .5 + dx * .95), y: Math.floor(G.player.y + .74 + dy * .8) };
}
function updatePlayer(dt) {
  const p = G.player, inp = G.input;
  if (p.stun > 0) { p.stun -= dt; p.moving = false; return; }
  let ax = inp.ax + (inp.right - inp.left);
  let ay = inp.ay + (inp.down - inp.up);
  const m = Math.hypot(ax, ay);
  if (m > 1) { ax /= m; ay /= m; }
  const mag = Math.hypot(ax, ay);
  if (G.fish) { p.moving = false; return; }
  if (mag > .12) {
    const sp = (inp.run ? 7.1 : 4.3) * dt * Math.min(1, mag * 1.35);
    const bx = p.x, by = p.y;
    if (canStand(p.x + ax * sp, p.y)) p.x += ax * sp;
    if (canStand(p.x, p.y + ay * sp)) p.y += ay * sp;
    p.moving = (Math.abs(p.x - bx) + Math.abs(p.y - by)) > 1e-4;
    p.dir = Math.abs(ax) > Math.abs(ay) ? (ax > 0 ? 'right' : 'left') : (ay > 0 ? 'down' : 'up');
    /* footsteps */
    G.stepT = (G.stepT || 0) + dt * (inp.run ? 13 : 8.4);
    if (G.stepT > 1 && p.moving) {
      G.stepT = 0;
      if (G.mode === 'house') Audio2.SFX.stepWood();
      else {
        const g = G.S.world.ground[idx(Math.floor(p.x + .5), Math.floor(p.y + .74))];
        if (g === T.SAND) Audio2.SFX.stepSand();
        else if (g === T.BRIDGE) Audio2.SFX.stepWood();
        else Audio2.SFX.step();
      }
    }
  } else p.moving = false;

  /* the house door sits at the bottom edge of the room */
  if (G.mode === 'house') {
    const n = houseSize(G.S);
    if (p.y > n - .35 && Math.abs(p.x + .5 - n / 2) < 1.2) leaveHouse();
  }
}

/* ---------------- actions ---------------- */
function doAction() {
  const S = G.S, p = G.player;
  if (G.pending) return;
  if (p.stun > 0) return;
  if (G.fish) { reel(); return; }
  if (G.mode === 'house') { houseAction(); return; }

  /* someone standing right there wants to talk */
  let best = null, bd = 2.2;
  for (const e of G.vills) {
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < bd) { bd = d; best = e; }
  }
  if (best) { startTalk(best); return; }

  /* net swing at a nearby bug */
  if (S.tool === 'net') {
    G.swing = .001;
    let target = null, td = 1.55;
    for (const b of G.bugs) {
      const d = Math.hypot(b.x - p.x, b.y - p.y - (b.lift ? .4 : 0));
      if (d < td) { td = d; target = b; }
    }
    Audio2.SFX.swing();
    if (target) { netBug(target); return; }
  }

  const f = facedTile();
  if (!inBounds(f.x, f.y)) return;
  const i = idx(f.x, f.y), o = S.world.obj[i], g = S.world.ground[i];

  if (o && o.t === 'bldg') {
    if (o.enter === 'home') { Audio2.SFX.door(); enterHouse(); }
    else if (o.enter === 'hall') { Audio2.SFX.door(); openHall(); }
    else if (o.enter === 'market') { Audio2.SFX.door(); openMarket(); }
    else if (o.enter === 'pier') { Audio2.SFX.door(); openPier(); }
    else showHint(o.label + ' \u2014 the door is shut.');
    return;
  }
  if (o && o.t === 'tree') {
    if (S.tool === 'axe') {
      const res = chopTree(S, i, Math.random);
      G.swing = .001;
      if (res.felled) { Audio2.SFX.timber(); toast('The tree comes down.'); }
      else Audio2.SFX.chop();
      if (!addItem(S, { kind: 'mat', id: res.drop.id })) showHint('Your pockets are full.');
      else showHint('Got ' + itemDef('mat', res.drop.id).name + '.');

    } else {
      const res = shakeTree(S, i, Math.random);

      if (!res) { showHint('This tree has already been shaken today.'); return; }
      if (res.type === 'fruit') {
        const n = res.n;

        else showHint('Fruit fell, but your pockets are full.');
      } else if (res.type === 'clovers') { earn(S, res.n); Audio2.SFX.coin(); toast(res.n + ' clovers fell out. Odd.', 'good'); }
      else if (res.type === 'furn') {
        if (addItem(S, { kind: 'furn', id: res.id })) toast('Furniture fell out of the tree: ' + BY_ID.furn[res.id].name + '!', 'good');

      afterChange();
    }
    return;
  }
  if (o && o.t === 'stump') {
    if (S.tool === 'shovel') { digStump(S, i); Audio2.SFX.dig(); showHint('Cleared the stump.'); afterChange(); }
    else showHint('The shovel would shift that stump.');
    return;
  }
  if (o && o.t === 'rock') {

      G.swing = .001;

      Audio2.SFX.rock();
      if (res.type === 'clovers') { earn(S, res.n); Audio2.SFX.coin(); showHint('+' + res.n + ' clovers'); }
      else if (addItem(S, { kind: 'mat', id: res.id })) showHint('Got ' + itemDef('mat', res.id).name + '.');
      else showHint('Your pockets are full.');
      afterChange();
    } else showHint('Try the shovel or the axe on this.');
    return;
  }
  if (o && o.t === 'flower') {
    if (S.tool === 'can') {
      if (waterFlower(S, i)) { Audio2.SFX.water(); showHint('Watered.'); afterChange(); }
      else showHint('Already watered today.');
    } else if (S.tool === 'shovel') {
      const fl = pickFlower(S, i);
      Audio2.SFX.dig();
      if (addItem(S, { kind: 'flower', id: fl.sp, color: fl.color })) showHint('Dug up a ' + fl.color + ' ' + BY_ID.flower[fl.sp].name + '.');
      else { plantFlower(S, i, fl.sp, fl.color); showHint('Your pockets are full.'); }
      afterChange();
    } else showHint('Water it with the can, or dig it up with the shovel.');
    return;
  }
  if (o && o.t === 'weed') { pullWeed(S, i); Audio2.SFX.pickup(); if (addItem(S, { kind: 'mat', id: 'wood' })) showHint('Pulled a weed. Kept the stalk.'); afterChange(); return; }
  if (o && o.t === 'shell') {

  }

  }

    if (res.type === 'fossil') {
      recordCatch(S, 'fossil', res.id);

    } else if (res.type === 'clovers') { earn(S, res.n); Audio2.SFX.coin(); toast('+' + res.n + ' clovers', 'good'); }
    else if (res.type === 'mat') {
      if (addItem(S, { kind: 'mat', id: res.id })) toast('Dug up ' + itemDef('mat', res.id).name + '.', 'good');
      else showHint('Your pockets are full.');
    } else { G.player.stun = 1.8; toast('A pitfall. Of course there was a pitfall.'); }
    afterChange();
    return;
  }
  if (WATER_TILES.includes(g)) {
    if (S.tool === 'rod') startFishing(f.x, f.y, g);
    else if (S.tool === 'can') { Audio2.SFX.water(); showHint('Can refilled.'); }
    else showHint('Deep enough for a line. Try the rod.');
    return;
  }
  if (S.tool === 'shovel') { Audio2.SFX.dig(); showHint('Nothing buried here.'); return; }
  if (S.tool !== 'net') showHint('Nothing to do here.');
}

function netBug(b) {
  const S = G.S;
  const chance = 1 - b.def.flee * .35;
  G.bugs.splice(G.bugs.indexOf(b), 1);
  if (Math.random() > chance) { poof(b.x, b.y, b.lift); Audio2.SFX.escape(); showHint('It slipped past the net.'); return; }
  Audio2.SFX.net();
  const isNew = !S.caught.bug[b.id];
  recordCatch(S, 'bug', b.id);
  if (addItem(S, { kind: 'bug', id: b.id })) {
    if (isNew) { Audio2.SFX.catchRare(); showCatch('bug', b.def, true); }
    else { Audio2.SFX.catchGood(); showCatch('bug', b.def, false); }
  } else showHint('Caught it \u2014 but your pockets are full, so it wriggled off.');
  afterChange();
}

/* ---------------- fishing ---------------- */
function startFishing(x, y, g) {
  const ck = G.lastClock;
  const loc = g === T.OCEAN ? 'ocean' : g === T.POND ? 'pond' : 'river';
  const pool = eligibleFish(loc, ck.month, ck.hour);
  Audio2.SFX.cast();
  const def = pool.length ? weightedPick(pool, Math.random) : null;
  G.fish = {
    bx: x, by: y, loc, def, state: 'cast', t: 0, approach: 0, shadowOn: false,
    nibblesLeft: 1 + Math.floor(Math.random() * 3), nextEvent: .35 + Math.random() * .5, window: 0
  };
  setTimeout(() => { if (G.fish && G.fish.state === 'cast') Audio2.SFX.plop(); }, 300);
}
function startDeepFishing() {
  const ck = G.lastClock, p = G.player;
  const off = DIRV[p.dir] || [0, -1];
  const pool = eligibleFish('deep', ck.month, ck.hour);
  Audio2.SFX.cast();
  const def = pool.length ? weightedPick(pool, Math.random) : null;
  G.fish = {
    bx: p.x + off[0] * 2.6, by: p.y + off[1] * 2.6, loc: 'deep', def, state: 'cast', t: 0, approach: 0, shadowOn: false,
    nibblesLeft: 1 + Math.floor(Math.random() * 3), nextEvent: .35 + Math.random() * .5, window: 0
  };
  setTimeout(() => { if (G.fish && G.fish.state === 'cast') Audio2.SFX.plop(); }, 300);
}
function updateFishing(dt) {
  const f = G.fish; if (!f) return;
  f.t += dt;
  switch (f.state) {
    case 'cast':
      if (f.t > .38) { f.state = 'wait'; f.t = 0; f.nextEvent = .5 + Math.random() * 1.8; }
      break;
    case 'wait':
      if (!f.def) { if (f.t > 3.5) endFishing('Nothing is biting here right now.'); break; }
      f.shadowOn = f.t > .5;
      f.approach = Math.min(1, Math.max(0, (f.t - .5) / (1.4 + f.def.shadow * .22)));
      if (f.approach >= 1 && f.t > f.nextEvent + 1.4) { f.state = 'nibble'; f.t = 0; Audio2.SFX.nibble(); }
      break;
    case 'nibble':
      if (f.t > .22) {
        f.nibblesLeft--;
        if (f.nibblesLeft <= 0) { f.state = 'bite'; f.t = 0; f.window = f.def.diff / 1000; Audio2.SFX.bite(); }
        else { f.state = 'between'; f.t = 0; f.gap = .45 + Math.random() * .75; }
      }
      break;
    case 'between':
      if (f.t > f.gap) { f.state = 'nibble'; f.t = 0; Audio2.SFX.nibble(); }
      break;

function reel() {
  const f = G.fish; if (!f) return;
  if (f.state === 'bite') {
    Audio2.SFX.reel();
    const S = G.S, def = f.def;
    const isNew = !S.caught.fish[def.id];
    const size = 12 + def.shadow * 14 + Math.floor(Math.random() * 16);
    recordCatch(S, 'fish', def.id, { size });
    G.fish = null;
    if (addItem(S, { kind: 'fish', id: def.id })) {
      if (isNew) { Audio2.SFX.catchRare(); showCatch('fish', def, true, size); }
      else { Audio2.SFX.catchGood(); showCatch('fish', def, false, size); }

  } else if (f.state === 'wait' || f.state === 'cast') {

function endFishing(msg) {

}

/* ---------------- house interior ---------------- */
function enterHouse() {

  const n = houseSize(G.S);
  G.player.x = n / 2 - .5; G.player.y = n - 1.6; G.player.dir = 'up';
  G.fish = null;

  updateHUD();
}
function leaveHouse() {
  G.mode = 'town';
  const home = G.S.world.placed.find(p => p.id === 'home');
  G.player.x = home.dx; G.player.y = home.dy; G.player.dir = 'down';

  saveGame();
}
function houseAction() {
  const S = G.S, f = facedTile();
  const item = S.house.items.find(it => it.x === f.x && it.y === f.y && furnLayer(it.id) === 'main');
  if (item) {
    if (invSpace(S) <= 0) { showHint('Your pockets are full.'); return; }
    removeFurnitureAt(S, f.x, f.y, 'main');
    addItem(S, { kind: 'furn', id: item.id });
    Audio2.SFX.pickup(); showHint('Picked up the ' + BY_ID.furn[item.id].name + '.');
    afterChange(); return;
  }
  const rug = S.house.items.find(it => it.x === f.x && it.y === f.y && furnLayer(it.id) === 'floor');
  if (rug) {
    if (invSpace(S) <= 0) { showHint('Your pockets are full.'); return; }
    removeFurnitureAt(S, f.x, f.y, 'floor');
    addItem(S, { kind: 'furn', id: rug.id });
    Audio2.SFX.pickup(); showHint('Rolled up the ' + BY_ID.furn[rug.id].name + '.');
    afterChange(); return;
  }
  showHint('Open your pockets to place something here.');
}
function placeFromInventory(invIndex) {
  const S = G.S, it = S.inv[invIndex];
  if (!it || it.kind !== 'furn') return;
  if (G.mode !== 'house') { showHint('Furniture goes inside your house.'); return; }
  const lay = furnLayer(it.id);
  let f = facedTile();
  if (lay === 'wall') f = { x: Math.max(0, Math.min(houseSize(S) - 1, Math.round(G.player.x))), y: -1 };
  if (!canPlaceFurniture(S, it.id, f.x, f.y)) { Audio2.SFX.error(); showHint('No room right there.'); return; }
  placeFurniture(S, it.id, f.x, f.y, 0);
  removeItemAt(S, invIndex, 1);
  Audio2.SFX.place(); showHint('Placed the ' + BY_ID.furn[it.id].name + '.');
  afterChange();
}
function plantFromInventory(invIndex) {
  const S = G.S, it = S.inv[invIndex];
  if (!it) return;
  if (G.mode !== 'town') { showHint('Step outside to plant that.'); return; }
  const f = facedTile();
  if (!inBounds(f.x, f.y)) return;
  const i = idx(f.x, f.y);
  let done = false;
  if (it.kind === 'seed') {
    const sp = BY_ID.flower[it.id];
    done = plantFlower(S, i, it.id, sp.colors[Math.floor(Math.random() * 3)]);
  } else if (it.kind === 'flower') {
    done = plantFlower(S, i, it.id, it.color);
  } else if (it.kind === 'sapling') {
    done = plantTree(S, i, it.id === 'plain' ? null : it.id);
  }
  if (!done) { Audio2.SFX.error(); showHint('Nothing will take root there. Face open grass.'); return; }
  removeItemAt(S, invIndex, 1);
  Audio2.SFX.grow(); showHint('Planted.');

/* ---------------- shared reactions ---------------- */
function afterChange() {
  tryCompleteDailyAuto();
  const got = checkAchievements(G.S);
  for (const a of got) {
    toast('\u2726 ' + a.name + ' \u2014 ' + a.desc, 'ach');
    Audio2.SFX.ach();
  }
  updateHUD();
  G.saveT = Math.max(G.saveT, 3.5);
}
/* chat / catch / donate errands resolve on their own, without a hand-in */
function tryCompleteDailyAuto() {
  const S = G.S, req = S.daily && S.daily.req;
  if (!req || S.daily.done || (req.type || 'fetch') === 'fetch') return;
  const have = dailyAutoProgress(S);
  if (have == null || have < req.need) return;
  S.daily.done = true;
  S.stats.streak = (S.stats.streak || 0) + 1;
  S.stats.bestStreak = Math.max(S.stats.bestStreak || 0, S.stats.streak);
  const reward = requestReward(S);
  earn(S, reward);
  const st = S.villagers[req.v];
  st.friend = Math.min(100, st.friend + 6);
  Audio2.SFX.coin();
  toast(villagerById(req.v).name + '\u2019s errand is done. +' + fmt(reward) + ' clovers \u00b7 ' + S.stats.streak + '-day streak', 'good');

function showHint(msg) { G.hint = msg; G.hintT = 2.4; }

/* ---------------- main loop ---------------- */
function loop(now) {
  if (!G.running) return;
  const dt = Math.min(.05, (now - G.last) / 1000);
  G.last = now; G.time += dt;
  if (G.swing > 0) { G.swing += dt * 4.5; if (G.swing > 1) G.swing = 0; }
  if (G.hintT > 0) G.hintT -= dt;
  for (let i = POOFS.length - 1; i >= 0; i--) { POOFS[i].t += dt; if (POOFS[i].t > .5) POOFS.splice(i, 1); }

  if (!isSheetOpen() && !G.pending) {
    updatePlayer(dt);
    if (G.mode === 'town') { updateVillagers(dt); updateBugs(dt); updateFishing(dt); updateStar(dt); }
  }
  centreCamera(false);

  /* clock + autosave */
  G.clockT = (G.clockT || 0) + dt;
  if (G.clockT > 5) { G.clockT = 0; refreshClock(false); updateHUD(); }
  if (G.saveT > 0) { G.saveT -= dt; if (G.saveT <= 0) saveGame(); }

  draw();
  requestAnimationFrame(loop);
}

/* ---------------- draw ---------------- */
function draw() {
  const ctx = G.ctx;
  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.clearRect(0, 0, G.vw, G.vh);
  ctx.save();
  ctx.scale(G.scale, G.scale);
  ctx.translate(-Math.round(G.cam.x), -Math.round(G.cam.y));
  if (G.mode === 'town') drawTown(ctx); else drawHouse(ctx);
  ctx.restore();
  drawHintText(ctx);
}
function drawTown(ctx) {
  const S = G.S, w = S.world;
  const tw = G.vw / G.scale, th = G.vh / G.scale;
  const x0 = Math.max(0, Math.floor(G.cam.x / TS) - 1), y0 = Math.max(0, Math.floor(G.cam.y / TS) - 1);
  const x1 = Math.min(MAP_W - 1, Math.ceil((G.cam.x + tw) / TS)), y1 = Math.min(MAP_H - 1, Math.ceil((G.cam.y + th) / TS));

  drawGround(ctx, G, x0, y0, x1, y1);

  /* everything that overlaps, painted back to front by y */
  const layer = [];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const o = w.obj[idx(x, y)];
    if (!o) continue;
    if (o.t === 'bldg') continue;
    layer.push({ y: y + (o.t === 'flower' || o.t === 'weed' || o.t === 'dig' || o.t === 'shell' || o.t === 'bottle' ? -.6 : 0), f: () => {
      const px = x * TS, py = y * TS;
      if (o.t === 'tree') drawTree(ctx, o, px, py, G);
      else if (o.t === 'stump') drawStump(ctx, px, py, G);
      else if (o.t === 'rock') drawRock(ctx, o, px, py, G);
      else if (o.t === 'flower') drawFlower(ctx, o, px, py, G);
      else if (o.t === 'weed') drawWeed(ctx, px, py, G);
      else if (o.t === 'shell') drawShell(ctx, px, py);
      else if (o.t === 'bottle') drawBottle(ctx, px, py, G);
      else if (o.t === 'dig') drawDig(ctx, px, py, G);
    } });
  }
  for (const b of w.placed) {
    if (b.x > x1 + 1 || b.x + b.w < x0 - 1 || b.y > y1 + 1 || b.y + b.h < y0 - 2) continue;
    layer.push({ y: b.y + b.h - .5, f: () => drawBuilding(ctx, b, G) });
  }
  for (const e of G.vills) layer.push({ y: e.y, f: () => drawVillager(ctx, e.v, e, G) });
  for (const b of G.bugs) if (!['sky'].includes(b.def.loc)) layer.push({ y: b.y, f: () => drawBug(ctx, b, G) });
  layer.push({ y: G.player.y, f: () => drawPlayer(ctx, G) });
  layer.sort((a, b) => a.y - b.y);
  for (const l of layer) l.f();

  /* the ones that fly overhead */
  for (const b of G.bugs) if (b.def.loc === 'sky') drawBug(ctx, b, G);
  for (const p of POOFS) {
    const a = 1 - p.t / .5;
    ctx.fillStyle = 'rgba(255,255,255,' + a * .7 + ')';
    for (let k = 0; k < 5; k++) {
      const an = k * 1.257 + p.t * 3;
      circle(ctx, p.x * TS + TS / 2 + Math.cos(an) * p.t * 40, p.y * TS + TS / 2 - p.lift + Math.sin(an) * p.t * 40, 3 * a + .5);
    }
  }
  if (G.fish) drawFishing(ctx, G);

  /* the marker on the tile you are facing */
  const f = facedTile();
  if (inBounds(f.x, f.y) && !G.fish) {
    ctx.strokeStyle = 'rgba(255,255,255,.3)'; ctx.lineWidth = 2;
    rr(ctx, f.x * TS + 4, f.y * TS + 4, TS - 8, TS - 8, 7); ctx.stroke();
  }

  drawParticles(ctx, G, x0, y0, x1, y1);
  const tint = skyTint(G.light, G.season, G.rain);
  if (tint) {
    ctx.fillStyle = tint;
    ctx.fillRect(G.cam.x - 4, G.cam.y - 4, tw + 8, th + 8);
    if (G.light < .5) {
      /* a warm pool of light around the player after dark */
      const gx = (G.player.x + .5) * TS, gy = (G.player.y + .4) * TS;
      const grad = ctx.createRadialGradient(gx, gy, 8, gx, gy, 150);
      grad.addColorStop(0, 'rgba(255,214,150,.24)');
      grad.addColorStop(1, 'rgba(255,214,150,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(gx - 160, gy - 160, 320, 320);
    }
  }
}
function drawHouse(ctx) {
  const S = G.S, n = houseSize(S);
  const flo = BY_ID.floor[S.house.floor] || FLOORS[0];
  const wal = BY_ID.wall[S.house.wall] || WALLPAPERS[0];
  const WH = 1.7 * TS;
  ctx.fillStyle = wal.hex;
  ctx.fillRect(-TS, -WH - TS, n * TS + TS * 2, WH + TS);
  ctx.fillStyle = 'rgba(0,0,0,.10)';
  ctx.fillRect(-TS, -8, n * TS + TS * 2, 8);
  for (let k = 0; k < n * 2; k++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (k % 2 ? .05 : .02) + ')';
    ctx.fillRect(k * TS / 2, -WH, TS / 2, WH);
  }
  /* floor */
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    ctx.fillStyle = flo.hex;
    ctx.fillRect(x * TS, y * TS, TS, TS);
    ctx.fillStyle = 'rgba(0,0,0,' + ((x + y) % 2 ? .05 : .015) + ')';
    ctx.fillRect(x * TS, y * TS, TS, TS);
    ctx.strokeStyle = 'rgba(0,0,0,.05)'; ctx.lineWidth = 1;
    ctx.strokeRect(x * TS + .5, y * TS + .5, TS - 1, TS - 1);
  }
  /* door */
  const dxp = (n / 2 - .5) * TS;
  ctx.fillStyle = '#7a5334'; rr(ctx, dxp, n * TS - 6, TS, 12, 4); ctx.fill();
  ctx.fillStyle = '#f2e4c8'; ctx.font = '600 11px ' + UIFONT; ctx.textAlign = 'center';
  ctx.fillText('exit', dxp + TS / 2, n * TS + 20);

  /* rugs first */
  for (const it of S.house.items) if (furnLayer(it.id) === 'floor') drawFurn(ctx, it, true);
  /* wall pieces */
  for (const it of S.house.items) if (furnLayer(it.id) === 'wall') drawWallFurn(ctx, it);
  /* everything else, sorted */
  const main = S.house.items.filter(it => furnLayer(it.id) === 'main').map(it => ({ y: it.y, f: () => drawFurn(ctx, it) }));
  main.push({ y: G.player.y, f: () => drawPlayer(ctx, G) });
  main.sort((a, b) => a.y - b.y);
  for (const m of main) m.f();

  const f = facedTile();
  ctx.strokeStyle = 'rgba(255,255,255,.34)'; ctx.lineWidth = 2;
  rr(ctx, f.x * TS + 4, f.y * TS + 4, TS - 8, TS - 8, 7); ctx.stroke();

  /* a soft interior glow */
  const grad = ctx.createRadialGradient(n * TS / 2, n * TS * .3, 20, n * TS / 2, n * TS * .4, n * TS * .9);
  grad.addColorStop(0, 'rgba(255,240,205,.12)');
  grad.addColorStop(1, 'rgba(30,20,40,.16)');
  ctx.fillStyle = grad;
  ctx.fillRect(-TS, -WH - TS, n * TS + TS * 2, n * TS + WH + TS * 2);
}
function drawFurn(ctx, it, flat) {
  const d = BY_ID.furn[it.id]; if (!d) return;
  const x = it.x * TS, y = it.y * TS;
  if (flat) {
    ctx.fillStyle = d.hex; rr(ctx, x + 1, y + 1, TS - 2, TS - 2, 5); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.32)'; ctx.lineWidth = 2;
    rr(ctx, x + 5, y + 5, TS - 10, TS - 10, 4); ctx.stroke();
    return;
  }
  const h = d.h * TS;
  shadow(ctx, x + TS / 2, y + TS - 3, TS * .38, 5, .22);
  /* body */
  ctx.fillStyle = d.hex;
  rr(ctx, x + 4, y + TS - h - 2, TS - 8, h, Math.min(7, h / 2)); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.2)';
  rr(ctx, x + 6, y + TS - h, TS - 12, Math.max(4, h * .3), 4); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.16)';
  ctx.fillRect(x + 4, y + TS - 8, TS - 8, 6);
  /* a small glyph so categories read at a glance */
  ctx.fillStyle = 'rgba(255,255,255,.55)';
  const cx = x + TS / 2, cy = y + TS - h * .6;
  switch (d.cat) {
    case 'seat': ctx.fillRect(cx - 7, cy - 6, 14, 3); ctx.fillRect(cx - 7, cy - 6, 3, 10); break;
    case 'table': ctx.fillRect(cx - 9, cy - 4, 18, 3); break;
    case 'bed': ctx.fillStyle = 'rgba(255,255,255,.8)'; rr(ctx, cx - 8, cy - 6, 16, 7, 3); ctx.fill(); break;
    case 'light': ctx.fillStyle = 'rgba(255,232,168,.9)'; circle(ctx, cx, cy - 4, 5);
      ctx.fillStyle = 'rgba(255,232,168,.2)'; circle(ctx, cx, cy - 4, 13); break;
    case 'plant': ctx.fillStyle = '#3f7a45';
      circle(ctx, cx - 5, cy - 8, 5); circle(ctx, cx + 5, cy - 8, 5); circle(ctx, cx, cy - 13, 5.5); break;
    case 'decor': circle(ctx, cx, cy - 5, 4); break;
  }
}
function drawWallFurn(ctx, it) {
  const d = BY_ID.furn[it.id]; if (!d) return;
  const x = it.x * TS, y = -TS * 1.15;
  ctx.fillStyle = 'rgba(0,0,0,.16)'; rr(ctx, x + 6, y + 4, TS - 12, TS - 8, 5); ctx.fill();
  ctx.fillStyle = d.hex; rr(ctx, x + 4, y, TS - 8, TS - 6, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.28)'; rr(ctx, x + 8, y + 4, TS - 16, TS - 16, 4); ctx.fill();
}
function drawHintText(ctx) {
  if (G.hintT <= 0 || !G.hint) return;
  const a = Math.min(1, G.hintT * 2.2);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.font = '600 15px ' + UIFONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const w = ctx.measureText(G.hint).width + 30;
  const x = G.vw / 2, y = G.vh - 152;
  ctx.fillStyle = 'rgba(22,20,26,.8)';
  rr(ctx, x - w / 2, y - 17, w, 34, 12); ctx.fill();
  ctx.fillStyle = '#f4efe4';
  ctx.fillText(G.hint, x, y);
  ctx.restore();
}

/* ---------------- theme ---------------- */

/* ---------------- item icons ---------------- */
function iconCanvas(item, size) {

  const s = size || 44;

  c.style.width = s + 'px'; c.style.height = s + 'px';

}
function drawItemIcon(x, item, s) {

    case 'fish': {
      const a = FISH_ART[item.id] || ['#8fb4c4', '#5f8496'];

      x.fillStyle = a[1];
      x.beginPath(); x.moveTo(cx + L * .5, cy); x.lineTo(cx + L * 1.15, cy - L * .55); x.lineTo(cx + L * 1.15, cy + L * .55); x.closePath(); x.fill();
      x.fillStyle = a[0];
      x.beginPath(); x.ellipse(cx - 1, cy, L, L * .55, 0, 0, 6.2832); x.fill();
      x.fillStyle = a[1];
      x.beginPath(); x.moveTo(cx - 2, cy - L * .5); x.lineTo(cx + 3, cy - L * 1.05); x.lineTo(cx + 4, cy - L * .35); x.closePath(); x.fill();
      x.fillStyle = 'rgba(255,255,255,.55)';
      x.beginPath(); x.ellipse(cx - L * .35, cy - 1.5, L * .4, L * .2, -.2, 0, 6.2832); x.fill();
      x.fillStyle = '#20262c'; x.beginPath(); x.arc(cx - L * .62, cy - .8, 1.4, 0, 6.2832); x.fill();
      break;
    }
    case 'bug': {
      const b = { id: item.id, def: BY_ID.bug[item.id] || BUGS[0], x: 0, y: 0, ph: 1.1, lift: 0, t: 0 };
      x.save(); x.translate(cx, cy); x.scale(s / 26, s / 26);
      const saveT = G.time; G.time = 1.2;
      x.translate(-(0 * TS + TS / 2), -(0 * TS + TS / 2));
      drawBug(x, b, G);
      G.time = saveT;
      x.restore();
      break;
    }
    case 'fossil': {
      const k = FOSSIL_ART[item.id] || 'plate';
      x.fillStyle = '#cbb99a';
      x.beginPath(); x.ellipse(cx, cy, s * .34, s * .3, 0, 0, 6.2832); x.fill();
      x.strokeStyle = '#7d6a4e'; x.lineWidth = 1.8; x.fillStyle = '#8a7657';
      if (k === 'spiral') { x.beginPath(); for (let a = 0; a < 11; a += .25) x.lineTo(cx + Math.cos(a) * a * .82, cy + Math.sin(a) * a * .82); x.stroke(); }
      else if (k === 'tooth') { x.beginPath(); x.moveTo(cx, cy - 9); x.lineTo(cx + 5, cy + 7); x.lineTo(cx - 5, cy + 7); x.closePath(); x.fill(); }
      else if (k === 'fern') {
        x.beginPath(); x.moveTo(cx, cy + 8); x.lineTo(cx, cy - 8); x.stroke();
        for (let i = -7; i < 8; i += 3.4) { x.beginPath(); x.moveTo(cx, cy + i); x.lineTo(cx - 6, cy + i - 2.4); x.moveTo(cx, cy + i); x.lineTo(cx + 6, cy + i - 2.4); x.stroke(); }
      } else if (k === 'amber') {
        x.fillStyle = '#e0a83f'; x.beginPath(); x.ellipse(cx, cy, s * .26, s * .3, 0, 0, 6.2832); x.fill();
        x.fillStyle = '#6f4a20'; x.beginPath(); x.ellipse(cx, cy, 2.6, 3.6, .4, 0, 6.2832); x.fill();
      } else if (k === 'heart') {
        x.fillStyle = '#a8846a'; x.beginPath();
        x.moveTo(cx, cy + 8); x.bezierCurveTo(cx - 12, cy - 2, cx - 5, cy - 11, cx, cy - 4);
        x.bezierCurveTo(cx + 5, cy - 11, cx + 12, cy - 2, cx, cy + 8); x.fill();
      } else if (k === 'bone' || k === 'vert') {
        x.fillStyle = '#e0d4bc';
        x.beginPath(); x.ellipse(cx, cy, 4, 7, 0, 0, 6.2832); x.fill();
        x.beginPath(); x.arc(cx - 5, cy - 5, 3.4, 0, 6.2832); x.arc(cx + 5, cy - 5, 3.4, 0, 6.2832); x.fill();
        x.beginPath(); x.arc(cx - 5, cy + 5, 3.4, 0, 6.2832); x.arc(cx + 5, cy + 5, 3.4, 0, 6.2832); x.fill();
      } else if (k === 'skull') {
        x.fillStyle = '#e6dcc4'; x.beginPath(); x.ellipse(cx, cy - 2, 8, 7, 0, 0, 6.2832); x.fill();
        x.fillRect(cx - 4, cy + 3, 8, 5);
        x.fillStyle = '#4a3d2c'; x.beginPath(); x.arc(cx - 3.4, cy - 2, 2.2, 0, 6.2832); x.arc(cx + 3.4, cy - 2, 2.2, 0, 6.2832); x.fill();
      } else if (k === 'claw') {
        x.fillStyle = '#9a8462'; x.beginPath();
        x.moveTo(cx - 6, cy + 8); x.quadraticCurveTo(cx + 8, cy + 2, cx + 4, cy - 9);
        x.quadraticCurveTo(cx + 2, cy + 1, cx - 6, cy + 8); x.fill();
      } else if (k === 'nest') {
        x.fillStyle = '#a08a62'; x.beginPath(); x.ellipse(cx, cy + 3, 11, 5.4, 0, 0, 6.2832); x.fill();
        x.fillStyle = '#e6dcc4'; x.beginPath(); x.ellipse(cx - 4, cy - 1, 3.4, 4.4, 0, 0, 6.2832); x.fill();
        x.beginPath(); x.ellipse(cx + 4, cy - 1, 3.4, 4.4, 0, 0, 6.2832); x.fill();
      } else if (k === 'wing') {
        x.fillStyle = '#8a7657'; x.beginPath();
        x.moveTo(cx - 9, cy + 6); x.quadraticCurveTo(cx, cy - 12, cx + 10, cy + 2); x.lineTo(cx - 9, cy + 6); x.fill();
        x.strokeStyle = '#cbb99a';
        for (let i = -6; i < 9; i += 4) { x.beginPath(); x.moveTo(cx - 8, cy + 5); x.lineTo(cx + i, cy - 4); x.stroke(); }
      } else {
        x.fillStyle = '#8a7657';
        for (let i = -1; i <= 1; i++) { x.beginPath(); x.ellipse(cx, cy + i * 5, 8 - Math.abs(i) * 2, 2.4, 0, 0, 6.2832); x.fill(); }
      }
      break;
    }
    case 'flower': {
      const hex = FLOWER_HEX[item.color] || '#fff';
      x.strokeStyle = '#5f9a4a'; x.lineWidth = 2.4;
      x.beginPath(); x.moveTo(cx, cy + 11); x.lineTo(cx, cy - 1); x.stroke();
      x.fillStyle = '#5f9a4a'; x.beginPath(); x.ellipse(cx - 5, cy + 5, 4, 2.2, -.4, 0, 6.2832); x.fill();
      x.fillStyle = hex;
      if (item.id === 'tulip') { x.beginPath(); x.moveTo(cx - 6, cy - 2); x.quadraticCurveTo(cx, cy - 16, cx + 6, cy - 2); x.quadraticCurveTo(cx, cy + 2, cx - 6, cy - 2); x.fill(); }
      else if (item.id === 'clover') { for (let k = 0; k < 4; k++) { const a = k * 1.5708; x.beginPath(); x.arc(cx + Math.cos(a) * 5, cy - 4 + Math.sin(a) * 5, 4.2, 0, 6.2832); x.fill(); } }
      else { for (let k = 0; k < 5; k++) { const a = k * 1.2566 - 1.57; x.beginPath(); x.arc(cx + Math.cos(a) * 5.6, cy - 4 + Math.sin(a) * 5.6, 4.2, 0, 6.2832); x.fill(); } x.fillStyle = '#f5d264'; x.beginPath(); x.arc(cx, cy - 4, 3.2, 0, 6.2832); x.fill(); }
      break;
    }
    case 'seed': {
      x.fillStyle = '#c2a274'; x.beginPath(); x.moveTo(cx - 9, cy - 7); x.lineTo(cx + 9, cy - 7); x.lineTo(cx + 7, cy + 9); x.lineTo(cx - 7, cy + 9); x.closePath(); x.fill();
      x.fillStyle = 'rgba(255,255,255,.4)'; x.fillRect(cx - 7, cy - 5, 14, 3);
      x.fillStyle = FLOWER_HEX[(BY_ID.flower[item.id] || FLOWERS[0]).colors[0]];
      x.beginPath(); x.arc(cx, cy + 2, 4, 0, 6.2832); x.fill();
      break;
    }
    case 'sapling': {
      x.fillStyle = '#8b6444'; x.fillRect(cx - 2, cy, 4, 11);
      const fr = BY_ID.fruit[item.id];
      x.fillStyle = '#5aa04e';
      x.beginPath(); x.arc(cx - 5, cy - 2, 5.4, 0, 6.2832); x.arc(cx + 5, cy - 2, 5.4, 0, 6.2832); x.arc(cx, cy - 8, 6, 0, 6.2832); x.fill();
      if (fr) { x.fillStyle = fr.hex; x.beginPath(); x.arc(cx + 3, cy - 5, 3, 0, 6.2832); x.fill(); }
      break;
    }
    case 'fruit': {
      const fr = BY_ID.fruit[item.id] || FRUITS[0];
      x.fillStyle = fr.hex; x.beginPath(); x.arc(cx, cy + 1, 9, 0, 6.2832); x.fill();
      x.fillStyle = 'rgba(255,255,255,.45)'; x.beginPath(); x.ellipse(cx - 3, cy - 3, 3, 2, -.6, 0, 6.2832); x.fill();
      x.strokeStyle = '#6f4a2c'; x.lineWidth = 2; x.beginPath(); x.moveTo(cx, cy - 8); x.lineTo(cx + 1, cy - 13); x.stroke();
      x.fillStyle = '#5a9a4e'; x.beginPath(); x.ellipse(cx + 5, cy - 12, 4.4, 2.4, -.5, 0, 6.2832); x.fill();
      break;
    }
    case 'mat': {
      const m = BY_ID.mat[item.id] || MATERIALS[0];
      if (item.id === 'shell') { drawShellIcon(x, cx, cy); break; }
      if (item.id === 'chime') {
        x.fillStyle = m.hex; x.beginPath(); x.arc(cx, cy - 2, 8, Math.PI, 0); x.lineTo(cx + 8, cy + 6); x.lineTo(cx - 8, cy + 6); x.fill();
        x.fillStyle = 'rgba(255,255,255,.4)'; x.beginPath(); x.arc(cx - 3, cy - 1, 2.4, 0, 6.2832); x.fill(); break;
      }
      if (item.id === 'stone' || item.id === 'ironore') {
        x.fillStyle = m.hex; x.beginPath();
        x.moveTo(cx - 9, cy + 7); x.lineTo(cx - 6, cy - 6); x.lineTo(cx + 3, cy - 9); x.lineTo(cx + 9, cy + 1); x.lineTo(cx + 6, cy + 7); x.closePath(); x.fill();
        x.fillStyle = 'rgba(255,255,255,.28)'; x.beginPath(); x.moveTo(cx - 6, cy - 6); x.lineTo(cx + 3, cy - 9); x.lineTo(cx, cy - 1); x.closePath(); x.fill(); break;
      }
      x.fillStyle = m.hex;
      for (let i = 0; i < 3; i++) { x.save(); x.translate(cx, cy - 4 + i * 5); x.rotate(i * .12 - .12); rr(x, -10, -2.4, 20, 4.8, 2.4); x.fill(); x.restore(); }
      x.fillStyle = 'rgba(0,0,0,.2)'; x.beginPath(); x.ellipse(cx - 9, cy + 1, 2.2, 2.4, 0, 0, 6.2832); x.fill();
      break;
    }
    case 'furn': {
      const d = BY_ID.furn[item.id] || FURNITURE[0];
      x.fillStyle = 'rgba(0,0,0,.14)'; x.beginPath(); x.ellipse(cx, cy + 12, 12, 3.4, 0, 0, 6.2832); x.fill();
      const h = 8 + d.h * 14;
      x.fillStyle = d.hex; rr(x, cx - 11, cy + 12 - h, 22, h, Math.min(6, h / 2)); x.fill();
      x.fillStyle = 'rgba(255,255,255,.24)'; rr(x, cx - 8, cy + 14 - h, 16, Math.max(4, h * .3), 3); x.fill();
      x.fillStyle = 'rgba(255,255,255,.6)'; x.font = '700 9px ' + UIFONT; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.fillText({ seat: 'S', table: 'T', bed: 'B', light: '*', plant: '\u2618', decor: '\u25c7', wall: '\u25a1', rug: '\u2261' }[d.cat] || '', cx, cy + 12 - h * .5);
      break;
    }
    case 'wall': case 'floor': {
      const d = (item.kind === 'wall' ? BY_ID.wall : BY_ID.floor)[item.id];
      x.fillStyle = d ? d.hex : '#ccc'; rr(x, cx - 12, cy - 12, 24, 24, 5); x.fill();
      x.strokeStyle = 'rgba(0,0,0,.18)'; x.lineWidth = 1;
      for (let i = -12; i < 12; i += 6) { x.beginPath(); x.moveTo(cx - 12, cy + i); x.lineTo(cx + 12, cy + i); x.stroke(); }
      break;
    }
    default:
      x.fillStyle = '#b0a48c'; rr(x, cx - 10, cy - 10, 20, 20, 6); x.fill();
  }
}
function drawShellIcon(x, cx, cy) {
  x.fillStyle = '#f4ded0';
  x.beginPath(); x.moveTo(cx, cy + 7); x.arc(cx, cy + 7, 11, Math.PI, 0); x.closePath(); x.fill();
  x.strokeStyle = 'rgba(190,150,130,.8)'; x.lineWidth = 1.4;
  for (let k = -3; k <= 3; k++) { x.beginPath(); x.moveTo(cx, cy + 7); x.lineTo(cx + k * 3.2, cy - 3.6); x.stroke(); }
}

function buildBelt() {
  const b = $('#belt'); b.innerHTML = '';

    const n = el('button', 'tool' + (G.S.tool === t ? ' sel' : ''), TOOL_SVG[t]);

}
function updateHUD() {
  const S = G.S; if (!S) return;

  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

/* ---------------- pockets ---------------- */
let invSel = -1;
let showAppearance = false;
function openInventory() {
  invSel = -1;
  Audio2.SFX.menu();
  renderInventory();
}
function renderInventory() {
  const S = G.S;
  openSheet('Your Pockets', S.inv.length + ' of ' + INV_MAX + ' slots used', body => {
    const grid = el('div', 'invGrid');
    for (let i = 0; i < INV_MAX; i++) {
      const it = S.inv[i];
      const slot = el('button', 'slot' + (it ? '' : ' empty') + (invSel === i ? ' sel' : ''));
      if (it) {
        slot.appendChild(iconCanvas(it, 38));
        slot.appendChild(el('div', 'nm', esc(itemName(it))));
        if ((it.n || 1) > 1) slot.appendChild(el('div', 'qty', '\u00d7' + it.n));
        if (['fish', 'bug', 'fossil'].includes(it.kind) && !S.donated[it.kind][it.id]) slot.appendChild(el('div', 'new'));
        slot.onclick = () => { invSel = (invSel === i ? -1 : i); Audio2.SFX.select(); renderInventory(); };
      } else slot.onclick = () => { };
      grid.appendChild(slot);
    }
    body.appendChild(grid);

    if (invSel >= 0 && S.inv[invSel]) {
      const it = S.inv[invSel];
      const card = el('div', 'spec'); card.style.marginTop = '14px';
      card.appendChild(iconCanvas(it, 56));
      const info = el('div');
      info.appendChild(el('div', 'nm', esc(itemName(it)) + ((it.n || 1) > 1 ? '  \u00d7' + it.n : '')));
      const def = BY_ID[it.kind] && BY_ID[it.kind][it.id];
      info.appendChild(el('div', 'meta', 'worth ' + fmt(itemValue(it)) + ' each'));
      if (def && def.blurb) info.appendChild(el('div', 'bl', esc(def.blurb)));
      card.appendChild(info);
      body.appendChild(card);

      const bar = el('div', 'editBar');
      const near = G.vills.find(e => Math.hypot(e.x - G.player.x, e.y - G.player.y) < 2.4);
      if (it.kind === 'furn') {
        const b = el('button', 'btn', G.mode === 'house' ? 'Place it here' : 'Place (go inside first)');
        b.disabled = G.mode !== 'house';
        b.onclick = () => { closeSheet(); placeFromInventory(invSel); };
        bar.appendChild(b);
      }
      if (['seed', 'sapling', 'flower'].includes(it.kind)) {
        const b = el('button', 'btn', 'Plant it in front of you');
        b.disabled = G.mode !== 'town';
        b.onclick = () => { closeSheet(); plantFromInventory(invSel); };
        bar.appendChild(b);
      }
      if (it.kind === 'wall' || it.kind === 'floor') {
        const b = el('button', 'btn', it.kind === 'wall' ? 'Hang this wallpaper' : 'Lay this floor');
        b.onclick = () => {
          if (it.kind === 'wall') S.house.wall = it.id; else S.house.floor = it.id;
          removeItemAt(S, invSel, 1); invSel = -1;
          Audio2.SFX.place(); toast('Redecorated.', 'good'); afterChange(); renderInventory();
        };
        bar.appendChild(b);
      }
      if (near) {
        const b = el('button', 'btn', 'Give to ' + near.v.name);
        b.onclick = () => {
          const r = giveGift(S, near.id, invSel, G.dayKey);
          if (!r) return;
          if (r.refused) { Audio2.SFX.error(); toast(near.v.name + ' has already had a present today.'); return; }
          Audio2.SFX.coin();
          toast(near.v.name + ': “' + r.line + '” (+' + r.gain + ' friendship)', r.mood === 'love' ? 'ach' : 'good');
          invSel = -1; afterChange(); renderInventory();
        };
        bar.appendChild(b);
      }
      const drop = el('button', 'btn warn', 'Drop');
      drop.onclick = () => { removeItemAt(S, invSel, S.inv[invSel].n || 1); invSel = -1; Audio2.SFX.back(); afterChange(); renderInventory(); };
      bar.appendChild(drop);
      body.appendChild(bar);
      body.appendChild(el('div', 'note', 'Tip: the Market buys anything, and Cove Hall takes donations.'));
    } else {
      body.appendChild(el('div', 'note', 'Tap something to see what it is and what you can do with it.'));
    }
  }, null, null);
}

/* ---------------- Cove Hall ---------------- */
function openHall() { hallTab('fish'); }
function hallTab(kind) {
  const S = G.S;
  const counts = donationCounts(S);
  const tabs = [
    { key: 'fish', label: 'Fish', go: () => hallTab('fish') },
    { key: 'bug', label: 'Bugs', go: () => hallTab('bug') },
    { key: 'fossil', label: 'Fossils', go: () => hallTab('fossil') },
    { key: 'donate', label: 'Donate', go: () => hallTab('donate') }
  ];
  openSheet('Cove Hall', counts.total + ' of ' + counts.max + ' pieces on display \u00b7 ' +
    Math.round(counts.total / counts.max * 100) + '% complete', body => {
    const bar = el('div', 'bar', '<i style="width:' + (counts.total / counts.max * 100) + '%"></i>');
    body.appendChild(bar);
    body.appendChild(el('div', '', '<br>'));
    if (kind === 'donate') {
      const giveable = S.inv.map((it, i) => ({ it, i })).filter(o => ['fish', 'bug', 'fossil'].includes(o.it.kind));
      if (!giveable.length) {
        body.appendChild(el('div', 'empty', '<span class="big">\u25ce</span>Nothing in your pockets the hall can take. Fish, bugs and fossils all count.'));
        return;
      }
      const list = el('div', 'list');
      giveable.forEach(o => {
        const already = !!S.donated[o.it.kind][o.it.id];
        const row = el('div', 'row' + (already ? ' locked' : ''));
        const ic = iconCanvas(o.it, 40); ic.className = 'ic'; row.appendChild(ic);
        const b = el('div', 'body');
        b.appendChild(el('div', 't', esc(itemName(o.it))));
        b.appendChild(el('div', 'd', already ? 'Already on display' : 'New to the collection'));
        row.appendChild(b);
        const btn = el('button', 'btn', already ? 'On display' : 'Donate');
        btn.disabled = already;
        btn.onclick = () => {
          donate(S, o.it.kind, o.it.id);
          removeItemAt(S, o.i, 1);
          Audio2.SFX.catchGood();
          toast('Donated: ' + itemName(o.it), 'good');
          afterChange(); hallTab('donate');
        };
        row.appendChild(btn);
        list.appendChild(row);
      });
      body.appendChild(list);
      return;
    }
    const src = kind === 'fish' ? FISH : kind === 'bug' ? BUGS : FOSSILS;
    const have = S.donated[kind];
    const seen = S.caught[kind];
    const grid = el('div', 'specGrid');
    src.forEach(d => {
      const known = have[d.id];
      const card = el('div', 'spec' + (known ? '' : ' undone'));
      card.appendChild(iconCanvas({ kind, id: d.id }, 56));
      const info = el('div'); info.style.minWidth = '0';
      info.appendChild(el('div', 'nm', known ? esc(d.name) : '???'));
      if (known) {
        let meta = fmt(d.price) + ' clovers';
        if (kind === 'fish') meta += ' \u00b7 ' + d.loc + ' \u00b7 ' + windowText(d);
        if (kind === 'bug') meta += ' \u00b7 ' + d.loc + ' \u00b7 ' + windowText(d);
        info.appendChild(el('div', 'meta', meta));

        if (seen[d.id]) info.appendChild(el('div', 'meta', 'caught \u00d7' + seen[d.id].n));

function windowText(d) {
  if (!d.months) return '';
  const m = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const months = d.months.length === 12 ? 'all year' : d.months.map(i => m[i - 1]).join(' ');
  const hrs = (d.hours.length === 1 && d.hours[0][0] === 0 && d.hours[0][1] === 24) ? 'any time'
    : d.hours.map(([a, b]) => hr(a) + '\u2013' + hr(b)).join(', ');
  return months + ' \u00b7 ' + hrs;
}
function hr(h) { const x = ((h + 11) % 12) + 1; return x + (h < 12 || h === 24 ? 'am' : 'pm'); }

    const w = G.S.world, p = PAL[G.season];
    for (let y = 0; y < MAP_H; y++) for (let xx = 0; xx < MAP_W; xx++) {
      const g = w.ground[idx(xx, y)];
      x.fillStyle = g === T.GRASS ? p.g2 : g === T.SAND ? p.sand : g === T.OCEAN ? p.oce2 :
        g === T.CLIFF ? p.cliff : g === T.PATH ? p.path : g === T.BRIDGE ? '#a97e4e' : p.riv;
      x.fillRect(xx * s, y * s, s, s);
      const o = w.obj[idx(xx, y)];
      if (o && o.t === 'tree') { x.fillStyle = p.tree2; x.fillRect(xx * s + 1, y * s + 1, s - 2, s - 2); }
    }
    for (const b of w.placed) {
      const vh = b.id.startsWith('vh_');
      x.fillStyle = vh ? '#d8a05a' : b.id === 'home' ? '#e05a4e' : b.id === 'hall' ? '#6fa88c' : '#e0a03c';
      x.fillRect(b.x * s, b.y * s, b.w * s, b.h * s);
    }
    for (const e of G.vills) { x.fillStyle = '#fff'; x.fillRect(e.x * s - 1, e.y * s - 1, s, s); }
    x.fillStyle = '#ff3d6e';
    x.beginPath(); x.arc((G.player.x + .5) * s, (G.player.y + .5) * s, s * 1.3, 0, 6.2832); x.fill();

let typeTimer = null;
function say(who, text, options) {
  const d = $('#dlg');
  d.className = 'paper show';
  $('#dlgWho').textContent = who || '';
  const t = $('#dlgTxt');
  t.textContent = '';
  clearInterval(typeTimer);
  let i = 0;
  const pitch = G.pending && G.pending.pitch || 1;
  typeTimer = setInterval(() => {
    i += 2;
    t.textContent = text.slice(0, i);
    if (i % 6 === 0 && G.S.sfx) Audio2.SFX.talk(pitch);
    if (i >= text.length) { clearInterval(typeTimer); t.textContent = text; }
  }, 18);
  const box = $('#dlgOpts'); box.innerHTML = '';
  (options || [{ label: 'Bye', fn: endTalk }]).forEach(o => {
    const b = el('button', 'opt' + (o.ghost ? ' ghost' : ''), esc(o.label));
    b.onclick = () => { Audio2.SFX.select(); o.fn(); };
    box.appendChild(b);
  });
}
function endTalk() {
  clearInterval(typeTimer);
  $('#dlg').className = 'paper';
  G.pending = null;
  Audio2.SFX.back();
  saveGame();
}
function startTalk(e) {
  const S = G.S, v = e.v;
  G.pending = { type: 'talk', id: e.id, pitch: { rabbit: 1.35, cat: 1.2, frog: .72, bear: .68, deer: 1, duck: 1.15 }[v.species] || 1 };
  /* face each other */
  const dx = e.x - G.player.x, dy = e.y - G.player.y;
  G.player.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  const r = talkTo(S, e.id, G.dayKey);
  const req = S.daily.req;
  const reqType = req && (req.type || 'fetch');
  const isRequester = req && req.v === e.id && !S.daily.done;
  const opts = [];
  if (isRequester && reqType === 'fetch') opts.push({ label: 'What do you need?', fn: () => showRequest(e) });
  else if (isRequester) opts.push({ label: 'About that favour…', fn: () => {
    const have = dailyAutoProgress(S) || 0;
    say(v.name, requestLabel(req) + '  (' + have + '/' + req.need + ')', [{ label: 'On it', fn: endTalk }]);
  } });
  opts.push({ label: 'Give a present', fn: () => { endTalk(); openInventory(); } });
  opts.push({ label: 'Bye', ghost: true, fn: endTalk });
  let line = r.line;
  if (r.gained) line += '';
  say(v.name, line, opts);
  if (r.gained) setTimeout(() => afterChange(), 200);
}
function showRequest(e) {
  const S = G.S, req = S.daily.req;
  const has = matchingInvIndex(req);
  const opts = [];
  if (has >= 0) opts.push({ label: 'Hand over the ' + requestItemName(req), fn: () => completeRequest(e, has) });
  opts.push({ label: 'I\u2019ll look for it', ghost: true, fn: endTalk });
  say(e.v.name, requestLabel(req) + (has >= 0 ? '' : '  (Reward: ' + fmt(requestReward(S)) + ' clovers)'), opts);
}
function matchingInvIndex(req) {
  const S = G.S;
  return S.inv.findIndex(it => it.kind === req.kind && it.id === req.id && (req.kind !== 'flower' || it.color === req.color));
}
function completeRequest(e, invIndex) {
  const S = G.S;
  removeItemAt(S, invIndex, 1);
  S.daily.done = true;
  S.stats.streak = (S.stats.streak || 0) + 1;
  S.stats.bestStreak = Math.max(S.stats.bestStreak || 0, S.stats.streak);
  const reward = requestReward(S);
  earn(S, reward);
  const st = S.villagers[e.id];
  st.friend = Math.min(100, st.friend + 6);
  Audio2.SFX.coin();
  toast('+' + fmt(reward) + ' clovers \u00b7 ' + S.stats.streak + '-day streak', 'good');
  afterChange();
  say(e.v.name, 'That\u2019s exactly it. Here \u2014 take this, and don\u2019t argue.', [{ label: 'Thanks!', fn: endTalk }]);
}

/* ---------------- save ---------------- */
function saveGame() {
  const S = G.S; if (!S) return;
  S.look = G.look;
  try { localStorage.setItem(SAVE_KEY, serialize(S)); }
  catch (e) { console.warn('save failed', e); }
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    return deserialize(raw);
  } catch (e) { console.warn('load failed', e); return null; }
}


/* ===== 80_boot.js ===== */
/* ============================================================
   CLOVER COVE — title screen, input, boot
   ============================================================ */
const SKINS = ['#f6d5b8', '#f0c9a4', '#dda877', '#b9814f', '#8d5a34', '#5e3a22'];
const HAIRS = ['#2c2118', '#4a3628', '#8a5a32', '#c9963f', '#e0d5c2', '#7d4a6a', '#3f5f8a', '#8a3f3f'];
const SHIRTS = ['#5f9ad4', '#e07a52', '#6fb37a', '#d9a03c', '#a878c4', '#e0748f', '#4a5a72', '#e8dcc0'];

function buildTitle(hasSave) {
  const t = $('#title');
  t.innerHTML = '';
  t.appendChild(el('div', 'logo', 'Clover<em>Cove</em>'));
  const art = document.createElement('canvas');
  art.id = 'titleArt'; t.appendChild(art);
  t.appendChild(el('div', 'tag2', 'A quiet bay, a fishing rod, and however long you feel like staying.'));

  if (hasSave) {
    const go = el('button', 'bigbtn', 'Back to the cove');
    go.onclick = () => { unlockAudio(); const S = loadGame(); if (S) { $('#title').classList.remove('show'); startGame(S); afterBoot(); } };
    t.appendChild(go);
    const nw = el('button', 'bigbtn alt', 'Start a new cove');
    nw.onclick = () => { if (confirm('This replaces your current cove. Sure?')) buildTitle(false); };
    t.appendChild(nw);
  } else {
    const inp = el('input');
    inp.placeholder = 'Your name'; inp.maxLength = 16; inp.id = 'nameIn';
    inp.setAttribute('aria-label', 'Your name');
    t.appendChild(inp);

    const pick = el('div');
    pick.style.cssText = 'display:flex;flex-direction:column;gap:8px;align-items:center';
    const rows = [['Skin', SKINS, 'skin'], ['Hair', HAIRS, 'hair'], ['Shirt', SHIRTS, 'shirt']];
    rows.forEach(([label, arr, key]) => {
      const r = el('div', 'chips');
      r.style.justifyContent = 'center';
      arr.forEach(c => {
        const b = el('button', 'chip');
        b.style.cssText = 'width:26px;height:26px;padding:0;border-radius:9px;background:' + c +
          ';border:2px solid ' + (G.look[key] === c ? 'var(--accent)' : 'transparent');
        b.setAttribute('aria-label', label + ' ' + c);
        b.onclick = () => { G.look[key] = c; unlockAudio(); Audio2.SFX.select(); buildTitle(false); drawTitleArt(); };
        r.appendChild(b);
      });
      pick.appendChild(r);
    });
    t.appendChild(pick);

    const go = el('button', 'bigbtn', 'Move in');
    go.onclick = () => {
      unlockAudio();
      const nm = ($('#nameIn').value || '').trim() || 'Resident';
      const S = newState((Math.random() * 0xffffffff) >>> 0);
      S.name = nm.slice(0, 16);
      S.look = Object.assign({}, G.look);
      $('#title').classList.remove('show');
      startGame(S);
      afterBoot();
      setTimeout(() => {
        toast('Welcome to Clover Cove, ' + S.name + '.', 'good');
        showHint('Move with the stick or WASD. Press A or Space to use your tool.');
      }, 500);
    };
    t.appendChild(go);
  }
  t.classList.add('show');
  requestAnimationFrame(drawTitleArt);
}
function drawTitleArt() {
  const c = $('#titleArt'); if (!c) return;
  const w = c.clientWidth || 320, h = 120;
  c.width = w * 2; c.height = h * 2;
  const x = c.getContext('2d'); x.scale(2, 2);
  x.clearRect(0, 0, w, h);
  /* sky + sun */
  const g = x.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, 'rgba(255,255,255,.06)'); g.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.fillStyle = 'rgba(255,203,82,.85)'; x.beginPath(); x.arc(w * .78, 34, 15, 0, 6.2832); x.fill();
  /* sea */
  x.fillStyle = 'rgba(80,170,205,.75)';
  x.beginPath(); x.moveTo(0, h - 34);
  for (let i = 0; i <= w; i += 8) x.lineTo(i, h - 34 + Math.sin(i * .07) * 2.4);
  x.lineTo(w, h); x.lineTo(0, h); x.fill();
  x.fillStyle = 'rgba(255,255,255,.25)';
  for (let i = 0; i < w; i += 26) x.fillRect(i + (i % 13), h - 26, 12, 2);
  /* sand */
  x.fillStyle = 'rgba(238,220,176,.9)';
  x.beginPath(); x.moveTo(0, h - 34);
  for (let i = 0; i <= w; i += 8) x.lineTo(i, h - 36 + Math.sin(i * .05 + 2) * 2);
  x.lineTo(w, h - 34); x.lineTo(0, h - 34); x.fill();
  /* a tree and a little person */
  const saveT = G.time; G.time = 1.4;
  x.save(); x.translate(w * .18 - TS / 2, h - 65);
  drawTree(x, { t: 'tree', fruit: 'apple', count: 3, shake: 0 }, 0, 0, G);
  x.restore();
  x.save(); x.translate(w * .38 - TS / 2, h - 70);
  drawPlayerStatic(x, TS / 2, TS);
  x.restore();
  x.save(); x.translate(w * .56 - TS / 2, h - 68);
  drawVillager(x, VILLAGERS[0], { x: 0, y: 0, ph: 0, moving: false, near: false }, G);
  x.restore();
  G.time = saveT;
}
function drawPlayerStatic(ctx, x, y) {
  const saved = { x: G.player.x, y: G.player.y, dir: G.player.dir, moving: G.player.moving };
  G.player.x = x / TS - .5; G.player.y = y / TS - 1; G.player.dir = 'down'; G.player.moving = false;
  drawPlayer(ctx, G);
  Object.assign(G.player, saved);
}

/* ---------------- audio unlock ---------------- */
let audioUnlocked = false;
function unlockAudio() {
  if (audioUnlocked) return;
  audioUnlocked = Audio2.init();
  Audio2.resume();
  if (audioUnlocked && G.S) {
    Audio2.setSfx(G.S.sfx);
    if (G.S.music) Audio2.startMusic(G.season);
  }
}

/* ---------------- input ---------------- */
function bindInput() {
  const KEY = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', z: 'up', q: 'left'
  };
  addEventListener('keydown', e => {
    if (e.target && /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    unlockAudio();
    const k = KEY[e.key] || KEY[e.key.toLowerCase()];
    if (k) { G.input[k] = 1; e.preventDefault(); return; }
    switch (e.key.toLowerCase()) {
      case 'shift': G.input.run = 1; break;
      case ' ': case 'e': case 'enter':
        e.preventDefault();
        if (G.pending) { const b = $('#dlgOpts').firstChild; if (b) b.click(); }
        else if (isSheetOpen()) { }
        else doAction();
        break;
      case 'tab': e.preventDefault(); cycleTool(e.shiftKey ? -1 : 1); break;
      case 'i': case 'b': toggleSheet(openInventory); break;
      case 'm': toggleSheet(openMap); break;
      case 'p': toggleSheet(openProfile); break;
      case 'escape': if (G.pending) endTalk(); else if (isSheetOpen()) closeSheet(); break;
      case '1': case '2': case '3': case '4': case '5':
        setTool(TOOLS[+e.key - 1]); break;
    }
  });
  addEventListener('keyup', e => {
    const k = KEY[e.key] || KEY[e.key.toLowerCase()];
    if (k) G.input[k] = 0;
    if (e.key === 'Shift') G.input.run = 0;
  });
  addEventListener('blur', () => { G.input.up = G.input.down = G.input.left = G.input.right = G.input.run = 0; });

  /* touch stick */
  const pad = $('#pad'), stick = $('#stick'), nub = $('#nub');
  let touchId = null, ox = 0, oy = 0;
  const start = (e) => {
    const t = e.changedTouches ? e.changedTouches[0] : e;
    if (touchId !== null) return;
    touchId = e.changedTouches ? t.identifier : 'mouse';
    ox = t.clientX; oy = t.clientY;
    const r = pad.getBoundingClientRect();
    stick.style.display = 'block';
    stick.style.left = (ox - r.left - 59) + 'px';
    stick.style.top = (oy - r.top - 59) + 'px';
    nub.style.left = '33px'; nub.style.top = '33px';
    unlockAudio();
    e.preventDefault();
  };
  const move = (e) => {
    if (touchId === null) return;
    let t = e.changedTouches ? [...e.changedTouches].find(c => c.identifier === touchId) : e;
    if (!t) return;
    let dx = t.clientX - ox, dy = t.clientY - oy;
    const d = Math.hypot(dx, dy), max = 44;
    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
    nub.style.left = (33 + dx) + 'px'; nub.style.top = (33 + dy) + 'px';
    G.input.ax = dx / max; G.input.ay = dy / max;
    G.input.run = d > max * .82 ? 1 : G.runLock ? 1 : 0;
    e.preventDefault();
  };
  const end = (e) => {
    if (touchId === null) return;
    if (e.changedTouches && ![...e.changedTouches].some(c => c.identifier === touchId)) return;
    touchId = null; stick.style.display = 'none';
    G.input.ax = 0; G.input.ay = 0; G.input.run = G.runLock ? 1 : 0;
  };
  pad.addEventListener('touchstart', start, { passive: false });
  pad.addEventListener('touchmove', move, { passive: false });
  pad.addEventListener('touchend', end);
  pad.addEventListener('touchcancel', end);
  pad.addEventListener('mousedown', start);
  addEventListener('mousemove', move);
  addEventListener('mouseup', end);

  const ab = $('#abtn');
  const press = e => { e.preventDefault(); unlockAudio(); if (G.pending) { const b = $('#dlgOpts').firstChild; if (b) b.click(); } else doAction(); };
  ab.addEventListener('touchstart', press, { passive: false });
  ab.addEventListener('mousedown', press);
  const rb = $('#runbtn');
  rb.onclick = () => {
    G.runLock = !G.runLock;
    rb.classList.toggle('on', G.runLock);
    G.input.run = G.runLock ? 1 : 0;
    unlockAudio(); Audio2.SFX.menu();
    showHint(G.runLock ? 'Running.' : 'Walking.');
  };
}
function toggleSheet(fn) {
  if (G.pending) return;
  if ($('#sheet').classList.contains('show')) closeSheet(); else fn();
}

/* ---------------- after the game starts ---------------- */
function afterBoot() {
  buildBelt();
  updateHUD();
  applyTheme();
  $('#hud').style.display = 'flex';
  unlockAudio();
  if (G.S.music) Audio2.startMusic(G.season);
  Audio2.setSfx(G.S.sfx);
}

/* ---------------- entry ---------------- */
function main() {
  G.canvas = $('#game');
  G.ctx = G.canvas.getContext('2d');
  resize();
  addEventListener('resize', () => { resize(); drawTitleArt(); });
  addEventListener('orientationchange', () => setTimeout(resize, 250));
  bindInput();

  $('#bagBtn').onclick = () => toggleSheet(openInventory);
  $('#mapBtn').onclick = () => toggleSheet(openMap);
  $('#meBtn').onclick = () => toggleSheet(openProfile);
  $('#soundBtn').onclick = () => {
    unlockAudio();
    const S = G.S; if (!S) return;
    const on = S.music || S.sfx;
    S.music = !on; S.sfx = !on;
    Audio2.setSfx(S.sfx);
    if (S.music) Audio2.startMusic(G.season); else Audio2.stopMusic();
    updateHUD(); saveGame();
  };
  $('#veil').onclick = () => { if (!G.pending && $('#sheet').classList.contains('show')) closeSheet(); };

  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { saveGame(); Audio2.stopMusic(); }
    else { Audio2.resume(); if (G.S && G.S.music) Audio2.startMusic(G.season); refreshClock(false); updateHUD(); }
  });
  addEventListener('beforeunload', saveGame);
  addEventListener('pointerdown', unlockAudio, { once: true });

  const saved = loadGame();
  $('#hud').style.display = 'none';
  buildTitle(!!saved);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', main);
else main();
</script>
