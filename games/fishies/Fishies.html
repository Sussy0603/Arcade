<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#0b3d5c"/>
<title>Fishies</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --line:rgba(255,255,255,.22);
    --gold:#ffce4d; --gold2:#ffa62b;
    --accent:#ff7fb0; --accent2:#7ce7c8;
    --bad:#ff6b6b;
    --ui-font:'Nunito',system-ui,sans-serif;
    --dis-font:'Baloo 2',system-ui,sans-serif;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:var(--ui-font);background:#03151f;color:#fff;
    display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
  #app{position:relative;width:100%;height:100%;max-width:520px;max-height:100vh;
    overflow:hidden;background:#062a45;box-shadow:0 0 80px rgba(0,0,0,.6)}
  @media(min-width:700px){#app{max-width:min(92vw,900px)}}
  canvas#tank{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:flex-start;z-index:20;pointer-events:none}
  .hud>*{pointer-events:auto}
  .chip{background:rgba(4,26,40,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:999px;padding:7px 13px;display:flex;align-items:center;gap:7px;
    font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
  .icbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:rgba(4,26,40,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:grid;place-items:center;font-size:17px;cursor:pointer;color:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .12s;flex:none}
  .icbtn:active{transform:scale(.9)}
  .icbtn.off{opacity:.45}
  .spacer{flex:1}

  .strip{position:absolute;top:calc(58px + env(safe-area-inset-top));left:12px;right:12px;z-index:19;display:flex;gap:8px;pointer-events:none}
  #boostRow{position:absolute;top:calc(98px + env(safe-area-inset-top));left:12px;right:12px;z-index:19;
    display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  .boostpill{background:rgba(255,206,77,.2);border:1px solid rgba(255,206,77,.55);color:#ffe9a8;
    border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:800;display:flex;align-items:center;gap:4px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:pulse 1.8s ease-in-out infinite}
  .meter{flex:1;background:rgba(4,26,40,.5);border:1px solid var(--line);border-radius:999px;
    padding:5px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .meter .lab{font-size:9.5px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;opacity:.75;display:flex;justify-content:space-between}
  .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.16);margin-top:4px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;transition:width .45s cubic-bezier(.3,1,.4,1)}
  #cleanFill{background:linear-gradient(90deg,#7ce7c8,#5fc4dd)}
  #hungerFill{background:linear-gradient(90deg,var(--gold),var(--accent))}

  .dock{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
  .tool{position:relative;flex:1;max-width:110px;border-radius:16px;cursor:pointer;padding:10px 4px 8px;
    font-family:var(--ui-font);color:#fff;background:rgba(4,26,40,.6);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:transform .12s,background .2s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .tool:active{transform:translateY(2px) scale(.96)}
  .tool .ic{font-size:21px;line-height:1}
  .tool .tx{font-size:10.5px;font-weight:800;letter-spacing:.03em}
  .tool.armed{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2500;border-color:#fff6;
    box-shadow:0 0 0 3px rgba(255,206,77,.28),0 10px 26px rgba(0,0,0,.35)}
  .tool.armed .tx{color:#3a2500}
  .badge{position:absolute;top:4px;right:6px;background:var(--bad);border-radius:999px;font-size:9px;font-weight:900;padding:1px 5px;line-height:1.5}

  .scrim{position:absolute;inset:0;z-index:40;display:none;background:rgba(2,14,24,.62);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
  .scrim.on{display:flex;animation:fade .22s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{width:100%;max-height:86%;background:linear-gradient(180deg,#0b3a58,#062639);
    border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid rgba(255,255,255,.2);
    display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,1,.3,1);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
  @keyframes up{from{transform:translateY(100%)}}
  .sheet.center{border-radius:24px;margin:auto 14px;max-width:400px;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}}
  .scrim.mid{align-items:center}
  .grab{width:38px;height:4px;border-radius:9px;background:rgba(255,255,255,.3);margin:9px auto 2px;flex:none}
  .shead{display:flex;align-items:center;gap:10px;padding:10px 18px 12px;flex:none;border-bottom:1px solid rgba(255,255,255,.1)}
  .shead h2{font-family:var(--dis-font);font-size:23px;font-weight:800;flex:1}
  .x{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;
    font-size:16px;cursor:pointer;display:grid;place-items:center;flex:none}
  .sbody{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch;flex:1}
  .sbody::-webkit-scrollbar{width:0}
  .tabs{display:flex;gap:6px;padding:0 16px 12px;flex:none}
  .tab{flex:1;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);
    color:#fff;font-weight:800;font-size:11.5px;cursor:pointer;font-family:var(--ui-font)}
  .tab.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2500;border-color:transparent}

  .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);
    padding:12px;margin-bottom:10px;display:flex;gap:11px;align-items:center}
  .card .art{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;background:rgba(0,0,0,.22);overflow:hidden}
  .card .art canvas{width:100%;height:100%}
  .card .art .emo{font-size:26px}
  .card .info{flex:1;min-width:0}
  .card .nm{font-weight:900;font-size:14.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .card .sub{font-size:11.5px;opacity:.72;margin-top:2px;line-height:1.35}
  .card.fav{border-color:rgba(255,206,77,.45);background:linear-gradient(90deg,rgba(255,206,77,.14),rgba(255,255,255,.07))}
  .card.fx-boost,.row.fx-boost{border-color:rgba(255,206,77,.5);animation:fxglow 2.2s ease-in-out infinite}
  @keyframes fxglow{0%,100%{box-shadow:0 0 0 1px rgba(255,206,77,.22),0 4px 14px rgba(255,206,77,.08)}
    50%{box-shadow:0 0 0 1px rgba(255,206,77,.5),0 4px 18px rgba(255,206,77,.3)}}
  .btn{border:none;border-radius:12px;padding:9px 13px;font-weight:900;font-size:12.5px;cursor:pointer;
    font-family:var(--ui-font);background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2500;
    flex:none;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .12s;white-space:nowrap}
  .btn:active{transform:scale(.93)}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
  .btn.mint{background:linear-gradient(180deg,#7ce7c8,#3fc9a6);color:#04352a}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn.wide{width:100%;padding:13px;font-size:14px;margin-top:6px}
  .qty{display:flex;align-items:center;gap:5px;flex:none;flex-wrap:wrap;margin-top:7px}
  .qty button{width:23px;height:23px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.14);
    color:#fff;font-weight:900;font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0;font-family:var(--ui-font)}
  .qty button:active{transform:scale(.9)}
  .qty button[disabled]{opacity:.3;pointer-events:none}
  .qty input.qin{width:48px;flex:none;padding:4px 3px;border-radius:9px;border:1px solid var(--line);
    background:rgba(0,0,0,.3);color:#fff;font-family:var(--ui-font);font-weight:900;font-size:12.5px;
    text-align:center;-moz-appearance:textfield}
  .qty .qmax{width:auto;height:23px;padding:0 8px;border-radius:9px;font-size:9.5px;letter-spacing:.06em;
    background:rgba(255,206,77,.22);border-color:rgba(255,206,77,.5);color:var(--gold)}
  .qty .qhint{font-size:10px;opacity:.6;font-weight:800;margin-left:1px}

  .lovebar{margin:10px 0 12px}
  .lovebar .lt{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:12px;font-weight:900;margin-bottom:5px}
  .lovebar .lt span:last-child{opacity:.7;font-size:11px}
  .lovebar .ld{font-size:10.5px;opacity:.6;margin-top:5px;line-height:1.45}
  .lovebar .meter{height:9px;border-radius:999px;background:rgba(0,0,0,.32);overflow:hidden;border:1px solid rgba(255,255,255,.14);
    flex:none;padding:0;backdrop-filter:none;-webkit-backdrop-filter:none}
  .lovebar .meter i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ff9ec8,#ff4d8d);
    box-shadow:0 0 10px rgba(255,127,176,.55);transition:width .35s ease}

  .rar{font-size:9px;font-weight:900;padding:2px 6px;border-radius:6px;letter-spacing:.05em}
  .r-common{background:#8fb8c9;color:#062a45}
  .r-rare{background:#7cc6ff;color:#062a45}
  .r-epic{background:#c79bff;color:#2b0d47}
  .r-legend{background:linear-gradient(90deg,var(--gold),var(--accent));color:#3a2500}
  .r-mythic{background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#1dd1a1,#a55eea);color:#1a0a2e}
  .r-ancient{background:linear-gradient(90deg,#0f0620,#4c1d95,#7c3aed,#0f0620);color:#e9d5ff}
  .r-eternal{background:linear-gradient(90deg,#78350f,#f59e0b,#fef3c7,#f59e0b,#78350f);color:#3a2500}

  .empty{text-align:center;padding:34px 16px;opacity:.75;font-size:13px;line-height:1.6}
  .empty .e{font-size:40px;display:block;margin-bottom:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;margin-bottom:9px}
  .row .l{font-weight:800;font-size:13.5px}
  .row .d{font-size:11px;opacity:.68;margin-top:2px}

  .sw{width:50px;height:28px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;
    cursor:pointer;flex:none;transition:background .2s;border:none}
  .sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#fff;transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
  .sw.on{background:linear-gradient(90deg,var(--gold),var(--gold2))}
  .sw.on:after{transform:translateX(22px)}

  .themes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .th{border-radius:15px;padding:11px;cursor:pointer;border:2px solid transparent;position:relative;
    display:flex;flex-direction:column;gap:7px;transition:transform .12s}
  .th:active{transform:scale(.96)}
  .th.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
  .th .tn{font-weight:900;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .th .dots{display:flex;gap:4px}
  .th .dots i{width:13px;height:13px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.35)}
  .th .lk{position:absolute;top:7px;right:8px;font-size:11px}

  input[type=text]{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);
    background:rgba(0,0,0,.28);color:#fff;font-size:15px;font-family:var(--ui-font);font-weight:700}
  input:focus{outline:2px solid var(--gold);outline-offset:1px}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .st{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:10px 11px}
  .st .v{font-family:var(--dis-font);font-size:20px;font-weight:800}
  .st .k{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-top:1px}

  .ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;margin-bottom:8px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  .ach.got{background:linear-gradient(90deg,rgba(255,206,77,.2),rgba(255,127,176,.12));border-color:rgba(255,206,77,.45)}
  .ach .ai{font-size:22px;width:38px;height:38px;border-radius:11px;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
  .ach.got .ai{background:linear-gradient(135deg,var(--gold),var(--accent))}
  .ach .an{font-weight:900;font-size:13px}
  .ach .ad{font-size:11px;opacity:.7;margin-top:1px}
  .ach .ac{margin-left:auto;font-size:16px;flex:none}
  .ach.locked{opacity:.55}

  #toasts{position:absolute;top:calc(104px + env(safe-area-inset-top));left:0;right:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;gap:6px;pointer-events:none}
  .toast{background:rgba(4,26,40,.9);border:1px solid var(--line);border-radius:999px;padding:8px 16px;
    font-weight:800;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:tin .3s cubic-bezier(.2,1.4,.4,1), tout .3s ease 2.2s forwards;
    backdrop-filter:blur(10px);max-width:90%;text-align:center}
  .toast.gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#3a2500;border-color:#fff5}
  @keyframes tin{from{transform:translateY(-16px) scale(.85);opacity:0}}
  @keyframes tout{to{transform:translateY(-10px);opacity:0}}

  #floats{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
  .fl{position:absolute;font-weight:900;font-size:15px;color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.6);animation:flup 1.1s ease-out forwards}
  @keyframes flup{to{transform:translate(-50%,-52px) scale(1.15);opacity:0}}

  #banner{position:absolute;top:-140px;left:14px;right:14px;z-index:70;
    background:linear-gradient(135deg,#ffce4d,#ff7fb0);color:#3a2500;border-radius:20px;padding:13px 15px;
    display:flex;gap:11px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.5);
    transition:top .5s cubic-bezier(.2,1.4,.4,1)}
  #banner.show{top:calc(14px + env(safe-area-inset-top))}
  #banner .bi{font-size:26px}
  #banner .bt{font-size:9.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
  #banner .bn{font-weight:900;font-size:15px;font-family:var(--dis-font)}

  .reward{text-align:center;padding:8px 4px 4px}
  .reward .big{font-size:56px;animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
  .reward h3{font-family:var(--dis-font);font-size:26px;margin:6px 0 2px}
  .reward p{opacity:.78;font-size:13px;line-height:1.5}
  .amt{font-family:var(--dis-font);font-size:38px;font-weight:800;color:var(--gold);margin:10px 0 2px}
  .streak{display:flex;gap:5px;justify-content:center;margin:14px 0 4px}
  .streak i{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.12);display:grid;place-items:center;
    font-size:11px;font-weight:900;font-style:normal;border:1px solid rgba(255,255,255,.15)}
  .streak i.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2500;border-color:transparent}

  .hint{position:absolute;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:18;
    background:rgba(4,26,40,.75);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
    font-size:11.5px;font-weight:800;backdrop-filter:blur(10px);white-space:nowrap;
    animation:pulse 1.8s ease-in-out infinite;pointer-events:none}
  @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  .hint.hide{display:none}

  .fishrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  .mini{font-size:10px;font-weight:800;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.28)}
  .mini.warn{background:rgba(255,107,107,.3)}
  .mini.good{background:rgba(92,224,141,.22)}

  .deco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .deco{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;
    padding:9px 5px;text-align:center;cursor:pointer;transition:transform .12s}
  .deco:active{transform:scale(.94)}
  .deco.owned{border-color:var(--accent2)}
  .deco.placed{background:rgba(124,231,200,.18)}
  .deco .de{font-size:26px;line-height:1.2}
  .deco .dn{font-size:9.5px;font-weight:800;margin-top:3px;opacity:.85}
  .deco .dp{font-size:10px;font-weight:900;color:var(--gold);margin-top:3px}
  .deco.owned .dp{color:var(--accent2)}

  #splash{position:absolute;inset:0;z-index:100;background:linear-gradient(180deg,#0b4a70,#031825);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    transition:opacity .6s;cursor:pointer}
  #splash.gone{opacity:0;pointer-events:none}
  #splash .lg{font-family:var(--dis-font);font-size:52px;font-weight:800;
    background:linear-gradient(90deg,#ffce4d,#ff7fb0,#7ce7c8);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:bob 3s ease-in-out infinite}
  #splash .sb{opacity:.7;font-size:13px;font-weight:700;letter-spacing:.05em}
  #splash .go{margin-top:22px;padding:13px 34px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);font-weight:900;font-size:14px;animation:pulse 1.6s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="tank"></canvas>
  <div id="floats"></div>

  <div class="hud">
    <div class="chip" id="coinChip" style="cursor:pointer"><span>🪙</span><span id="coins">0</span><span style="opacity:.55;font-weight:900;margin-left:1px">＋</span></div>
    <div class="chip" id="fishChip" style="cursor:pointer"><span>🐠</span><span id="fishCount">0/3</span></div>
    <div class="chip"><span id="seasonEmo">☀️</span><span id="seasonTx">Summer</span></div>
    <div class="spacer"></div>
    <button class="icbtn" id="muteBtn">🔊</button>
    <button class="icbtn" id="menuBtn">☰</button>
  </div>

  <div class="strip">
    <div class="meter"><div class="lab"><span>Clean</span><span id="cleanVal">100%</span></div>
      <div class="bar"><i id="cleanFill" style="width:100%"></i></div></div>
    <div class="meter"><div class="lab"><span>Fed</span><span id="hungerVal">100%</span></div>
      <div class="bar"><i id="hungerFill" style="width:100%"></i></div></div>
  </div>
  <div id="boostRow"></div>

  <div class="hint" id="hint">Tap a tool below to begin</div>

  <div class="dock">
    <button class="tool" id="tFeed"><span class="ic">🍤</span><span class="tx">FEED</span><span class="badge" id="feedBadge" style="display:none"></span></button>
    <button class="tool" id="tClean"><span class="ic">🧽</span><span class="tx">CLEAN</span></button>
    <button class="tool" id="tShop"><span class="ic">🛒</span><span class="tx">MARKET</span></button>
    <button class="tool" id="tFish"><span class="ic">🐠</span><span class="tx">FISHIES</span></button>
  </div>

  <div id="toasts"></div>

const K='fishies.save.v1';
const SLOTS_KEY='fishies.slots.v1', ACTIVE_KEY='fishies.activeSlot';
const slotKey=id=>'fishies.save.'+id;
function loadSlots(){
  try{const raw=localStorage.getItem(SLOTS_KEY);const arr=raw?JSON.parse(raw):[];return Array.isArray(arr)?arr:[];}
  catch(e){return [];}
}
function saveSlots(arr){try{localStorage.setItem(SLOTS_KEY,JSON.stringify(arr));}catch(e){}}
function getActiveSlot(){try{return localStorage.getItem(ACTIVE_KEY);}catch(e){return null;}}
function setActiveSlot(id){try{localStorage.setItem(ACTIVE_KEY,id);}catch(e){}}
function activeKey(){const id=getActiveSlot();return id?slotKey(id):null;}
function updateSlotMeta(id){
  if(!id||!S)return;
  const slots=loadSlots();
  const i=slots.findIndex(x=>x.id===id);
  const meta={id:id,name:S.name,difficulty:S.difficulty||'normal',coins:S.coins,totalCoins:S.totalCoins,
    fishCount:S.fish.length,achCount:Object.keys(S.ach).length,streak:S.streak,devMode:!!S.devMode,updated:Date.now()};
  if(i>=0)slots[i]=meta; else slots.push(meta);
  saveSlots(slots);
}
function ensureSlots(){
  let slots=loadSlots();
  const active=getActiveSlot();
  if(slots.length===0){
    let legacy=null;
    try{legacy=localStorage.getItem(K);}catch(e){}
    if(legacy){
      const id='s'+Date.now();
      try{localStorage.setItem(slotKey(id),legacy);}catch(e){}
      let name='Fish Keeper', diffId='normal', coins=0, fishCount=0;
      try{const d=JSON.parse(legacy);name=d.name||name;coins=d.coins||0;fishCount=(d.fish||[]).length;diffId=d.difficulty||'normal';}catch(e){}
      slots=[{id:id,name:name,difficulty:diffId,coins:coins,fishCount:fishCount,updated:Date.now()}];
      saveSlots(slots); setActiveSlot(id);
      return id;
    }
    return null;
  }
  if(active&&slots.some(s=>s.id===active))return active;
  const fallback=slots.slice().sort((a,b)=>(b.updated||0)-(a.updated||0))[0];
  if(fallback){setActiveSlot(fallback.id);return fallback.id;}
  return null;
}

const fmt=n=>{
  n=Math.floor(n);
  const neg=n<0?'-':''; n=Math.abs(n);
  if(n>=1e12)return neg+(n/1e12).toFixed(n>=1e14?0:1).replace(/\.0$/,'')+'T';
  if(n>=1e9)return neg+(n/1e9).toFixed(n>=1e11?0:1).replace(/\.0$/,'')+'B';
  if(n>=1e6)return neg+(n/1e6).toFixed(n>=1e8?0:1).replace(/\.0$/,'')+'M';
  if(n>=1e4)return neg+(n/1e3).toFixed(1)+'k';
  return neg+String(n);
};

}

    s.fish.forEach(f=>{f.hunger=typeof f.hunger==='number'?f.hunger:100;f.growth=f.growth||0;f.born=f.born||now();f.xp=f.xp||0;

function addLove(f,n,x,y){

  }
  return sp.c;
}

function paintAnemone(ctx,sp,fish,x,y,L,side,t){

  }
  const n=14;
  for(let i=0;i<n;i++){

    const len=L*(0.9+Math.sin(i*1.7)*.15);

    ctx.beginPath();ctx.arc(tipX,tipY,L*.06,0,7);ctx.fill();

  if(e.blink<=0){

    cx.beginPath();cx.arc(ex+L*.06+clamp(e.vx*.05,-.5,.5)*3,ey,L*.105,0,7);cx.fill();
    cx.fillStyle='#fff';cx.globalAlpha=.9;

  }else{

function drawFishInto(ctx,sp,px,py,scale,fish){
  const L=16*sp.size*scale;
  if(sp.shape==='star'){
    paintStarfish(ctx,sp,fish,px,py,L*.85,'sand',0);
    if(fish)drawCosmetics(ctx,fish,px,py-L*.5,L*.7,1);
    return;
  }
  if(sp.shape==='crab'){
    paintCrab(ctx,sp,fish,px,py,L*.85,1,0);
    if(fish)drawCosmetics(ctx,fish,px,py-L*.4,L*.7,1);
    return;
  }
  if(sp.shape==='anemone'){
    paintAnemone(ctx,sp,fish,px,py,L*.85,'sand',0);
    if(fish)drawCosmetics(ctx,fish,px,py-L*.8,L*.7,1);
    return;
  }
  if(sp.shape==='urchin'){
    paintUrchin(ctx,sp,fish,px,py,L*.85,'sand');
    if(fish)drawCosmetics(ctx,fish,px,py-L*.8,L*.7,1);
    return;
  }
  const [body,fin,acc]=colorsFor(fish,sp);
  ctx.save();ctx.translate(px,py);
  ctx.fillStyle=fin;ctx.beginPath();
  ctx.moveTo(-L*.86,0);ctx.lineTo(-L*1.6,-L*.6);
  ctx.quadraticCurveTo(-L*1.2,0,-L*1.6,L*.6);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-L*.28,-L*.36);
  ctx.quadraticCurveTo(0,-L*1.0,L*.34,-L*.30);
  ctx.quadraticCurveTo(0,-L*.46,-L*.28,-L*.36);ctx.fill();
  const g=ctx.createLinearGradient(0,-L*.7,0,L*.7);
  g.addColorStop(0,shade(body,34));g.addColorStop(.55,body);g.addColorStop(1,shade(body,-30));
  ctx.fillStyle=g;fishBody(ctx,sp,L,0);ctx.fill();
  fishBody(ctx,sp,L,0);fishPattern(ctx,sp,L,0);
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(L*.55,-L*.14,L*.19,0,7);ctx.fill();
  ctx.fillStyle='#0d1520';ctx.beginPath();ctx.arc(L*.60,-L*.14,L*.1,0,7);ctx.fill();
  if(fish)drawCosmetics(ctx,fish,0,0,L,1);
  ctx.restore();
}
function paintThumbs(){
  document.querySelectorAll('canvas.fc').forEach(c=>{
    const sp=spec(c.dataset.sp); if(!sp)return;
    const ctx=c.getContext('2d');
    ctx.clearRect(0,0,c.width,c.height);
    drawFishInto(ctx,sp,c.width*.56,c.height*.5,c.width/70);
  });
}

function feedGrowth(f,x,y,wasHungry){
  const sp0=spec(f.sp);
  const gmul=(growthBoostActive()?1+(S.growthBoost||0):1)*(sp0.growthMul||1)*(tankDef().growthMul||1)*(S.clean<40?0:1);
  if(sp0.feedBonus&&wasHungry)addCoins(Math.floor(sp0.feedBonus*boostMul()),false);
  if(wasHungry)addLove(f,.4,x,y);
  if((f.growth||0)<1){
    f.growth=clamp((f.growth||0)+.012*gmul,0,1);
    if(wasHungry)rollLucky(f,x,y);
    return;
  }
  if(fishLevel(f)<10){
    const lv0=fishLevel(f);
    f.xp=(f.xp||0)+1*gmul*(sp0.xpMul||1);
    const lv1=fishLevel(f);
    if(lv1>lv0){
      for(let i=0;i<10;i++)sparks.push({x:x,y:y,vx:rnd(-1.4,1.4),vy:rnd(-1.8,-.3),l:36,c:'#ffd166'});
      toast(f.name+' reached Level '+lv1+'! ⭐','gold');
      sfx('ach'); checkAch();
    }
  }
  if(wasHungry)rollLucky(f,x,y);
}
const LUCKY_BONUS={common:200,rare:350,epic:600,legend:1000,mythic:2000,ancient:4000,eternal:25000};
function rollLucky(f,x,y){
  const base=spec(f.sp).luckyChance; if(!base)return;
  const chance=base*(luckyBoostActive()?(1+(S.luckyBoost||0)):1);
  if(Math.random()>=chance)return;
  const bonus=LUCKY_BONUS[spec(f.sp).r]||500;
  for(let i=0;i<10;i++)sparks.push({x:x,y:y,vx:rnd(-1.4,1.4),vy:rnd(-1.8,-.3),l:34,c:'#ffe58a'});
  addCoins(Math.floor(bonus*boostMul()),true,x,y-16);
  toast(f.name+' found '+fmt(bonus)+' lucky coins! 🍀✨','gold'); sfx('coin');
  grant('luckyfound');
}
const RAR_FX={
  rare:{chance:0},
  epic:{chance:.010,col:['#c79bff','#a97bff','#e0c8ff']},
  legend:{chance:.018,col:['#ffce4d','#ffa62b','#fff3c4']},
  mythic:{chance:.032,col:['#ff6b6b','#feca57','#48dbfb','#1dd1a1','#a55eea']},
  ancient:{chance:.045,col:['#a855f7','#7c3aed','#e9d5ff','#4c1d95']},
  eternal:{chance:.07,col:['#f59e0b','#fef3c7','#fde68a','#ffffff']},
};
function spawnRarityFx(e,sp){
  const fx=RAR_FX[sp.r]; if(!fx||!fx.chance)return;
  if(Math.random()<fx.chance){
    const L=18*sp.size;
    sparks.push({x:e.x+rnd(-L,L),y:e.y+rnd(-L*.6,L*.6),vx:rnd(-.25,.25),vy:rnd(-.55,-.15),l:38,c:pick(fx.col),star:true});
  }
}
function spawnBloom(x,y,core,mid,maxR,maxLife,peak){
  blooms.push({x:x,y:y,r:4,maxR:maxR,life:0,maxLife:maxLife,core:core,mid:mid,peak:peak==null?1:peak});
}
function drawSparkle(x,y,r,rot){
  cx.save();cx.translate(x,y);cx.rotate(rot);
  cx.beginPath();
  cx.moveTo(0,-r);cx.lineTo(r*.28,-r*.28);cx.lineTo(r,0);cx.lineTo(r*.28,r*.28);
  cx.lineTo(0,r);cx.lineTo(-r*.28,r*.28);cx.lineTo(-r,0);cx.lineTo(-r*.28,-r*.28);
  cx.closePath();cx.fill();
  cx.restore();
}
function fishAura(e,t,sp){
  if(sp.r==='eternal'){

function stepStationary(e,f,sp,dt,t){
  applyStationaryPos(e);

    e.crawlT=(e.crawlT||0)-dt;
    if(e.crawlT<=0){e.crawlDir=pick([-1,1]);e.crawlT=rnd(2.5,5);}
    e.crawlOff=clamp((e.crawlOff||0)+e.crawlDir*dt*.05,-.12,.12);
    applyStationaryPos(e);
  }
  for(let i=pellets.length-1;i>=0;i--){
    const p=pellets[i];
    if(p.claim&&p.claim!==e.id)continue;
    const d=Math.hypot(p.x-e.x,p.y-e.y);
    if(d<60){
      pellets.splice(i,1);
      const wasHungry=f.hunger<99;
      f.hunger=clamp(f.hunger+p.fill,0,100);
      feedGrowth(f,p.x,p.y,wasHungry);
      S.hunger=S.fish.length?S.fish.reduce((a,ff)=>a+ff.hunger,0)/S.fish.length:100;
      if(wasHungry){
        addCoins(Math.floor(2*boostMul()),true,p.x,p.y-8);
        for(let k=0;k<4;k++)sparks.push({x:p.x,y:p.y,vx:rnd(-.5,.5),vy:rnd(-.8,-.1),l:22,c:'#ffe58a'});
      }
      sfx('bubble'); refreshHUD();
      break;
    }
  }
  e.blink--;
  if(e.blink<-160&&Math.random()<.02)e.blink=6;
  spawnRarityFx(e,sp);
}
function stepSim(dt,t){
  dispZoom+=(tankZoom()-dispZoom)*Math.min(1,dt*0.9);
  updateWorldSize();
  ENT.forEach(e=>{
    const sp=e.sp,f=e.f;
    if(sp.stationary){stepStationary(e,f,sp,dt,t);return;}
    const speed=sp.spd*(f.hunger>25?1:.55)*(S.clean>40?1:.75);
    const dirty=S.clean<=25;
    if(dirty)e.chase=null;
    else if(e.chase&&pellets.indexOf(e.chase)<0)e.chase=null;
    if(!dirty&&!e.chase&&pellets.length&&Math.random()<.4){
      let best=null,bd=1e9;
      pellets.forEach(p=>{
        if(p.claim&&p.claim!==e.id)return;
        const d=(p.x-e.x)*(p.x-e.x)+(p.y-e.y)*(p.y-e.y);
        if(d<bd){bd=d;best=p;}
      });
      if(best){e.chase=best;best.claim=e.id;}
    }
    if(dirty){
      if(e.tornR===undefined){
        e.tornR=rnd(0,1);
        e.tornSpin=(Math.random()<.5?-1:1)*rnd(1.5,2.8);
        e.tornAngle=rnd(0,Math.PI*2);
      }
      e.tornAngle+=dt*e.tornSpin*(2.1-e.tornR*.9);

      const maxR=Math.min(W*.36,130), minR=16*sp.size;
      const rad=minR+(maxR-minR)*e.tornR;
      const vy=vcy-e.tornR*H*.34;
      const hx=vcx+Math.cos(e.tornAngle)*rad, hy=vy+Math.sin(e.tornAngle)*rad*.32;
      const dx=hx-e.x, dy=hy-e.y, d=Math.hypot(dx,dy)||1;
      e.vx+=(dx/d)*.09*speed;
      e.vy+=(dy/d)*.09*speed;
      e.tx=null;
    }else if(e.chase){
      const p=e.chase, dx=p.x-e.x, dy=p.y-e.y, d=Math.hypot(dx,dy)||1;
      e.vx+=(dx/d)*.42*speed; e.vy+=(dy/d)*.42*speed;
      if(d<20){
        pellets.splice(pellets.indexOf(p),1); e.chase=null;
        const wasHungry=f.hunger<99;
        f.hunger=clamp(f.hunger+p.fill,0,100);
        feedGrowth(f,p.x,p.y,wasHungry);
        S.hunger=S.fish.length?S.fish.reduce((a,ff)=>a+ff.hunger,0)/S.fish.length:100;
        if(wasHungry){
          addCoins(Math.floor(2*boostMul()),true,p.x,p.y-8);
          for(let i=0;i<4;i++)sparks.push({x:p.x,y:p.y,vx:rnd(-.7,.7),vy:rnd(-1.1,-.2),l:26,c:'#ffe58a'});
        }

    }else{
      e.wait-=dt;
      if(e.wait<=0||e.tx===null){e.tx=rnd(24,W-24);e.ty=rnd(H*.12,H*.85);e.wait=rnd(2.6,6.8);}
      const dx=e.tx-e.x, dy=e.ty-e.y, d=Math.hypot(dx,dy)||1;
      e.vx+=(dx/d)*.085*speed;
      e.vy+=(dy/d)*.085*speed+Math.sin(t*.001+e.ph)*.008;
      if(d<26)e.tx=null;
    }
    const mx=2.5*speed, s2=Math.hypot(e.vx,e.vy);
    if(s2>mx){e.vx*=mx/s2;e.vy*=mx/s2;}

    e.vy+=Math.sin(t*.0016+e.ph*2)*.012;

    const pad=22*sp.size;

    if(e.x>W-pad){e.x=W-pad;e.vx=-Math.abs(e.vx)-.15;e.tx=null;}
    if(e.y<H*.13){e.y=H*.13;e.vy=Math.abs(e.vy)+.1;e.ty=null;}
    if(e.y>H*.83){e.y=H*.83;e.vy=-Math.abs(e.vy)-.1;e.ty=null;}
    if(Math.abs(e.vx)>.05)e.dir=e.vx>0?1:-1;
    e.blink--;
    if(e.blink<-160&&Math.random()<.02)e.blink=6;
    if(Math.random()<.004)bubbles.push({x:e.x+e.dir*22,y:e.y,r:rnd(1.5,3.4),s:rnd(20,36),w:rnd(0,6),tmp:1});
    if(sp.id==='octopus'&&Math.random()<.0018){
      spawnBloom(e.x,e.y,'rgba(30,10,45,.85)','rgba(50,20,65,.5)',rnd(46,66),100,.85);
      sfx('bubble');
    }
    if(sp.id==='squid'&&Math.random()<.0022){
      const dashAng=Math.atan2(e.vy,e.vx)||0;
      e.vx+=Math.cos(dashAng)*1.6; e.vy+=Math.sin(dashAng)*1.6;
      spawnBloom(e.x-Math.cos(dashAng)*22,e.y-Math.sin(dashAng)*22,'rgba(15,10,40,.7)','rgba(30,25,60,.4)',rnd(26,36),50,.7);
      sfx('blip');
    }
    if(sp.shape==='octopus'&&sp.r==='ancient'&&Math.random()<.0012){
      spawnBloom(e.x,e.y,'rgba(10,4,20,.92)','rgba(60,20,95,.6)',rnd(85,115),150,1);
      for(let k=0;k<9;k++)sparks.push({x:e.x,y:e.y,vx:rnd(-1.6,1.6),vy:rnd(-1.8,-.2),l:40,c:pick(['#e9d5ff','#a855f7','#fff']),star:true});
      sfx('bubble');
    }
    spawnRarityFx(e,sp);
  });
  for(let i=pellets.length-1;i>=0;i--){
    const p=pellets[i];
    p.vy=Math.min(p.vy+22*dt,34);
    p.y+=p.vy*dt; p.x+=Math.sin(t*.002+p.ph)*.24;
    if(p.y>H*.95)pellets.splice(i,1);
  }
  for(let i=bubbles.length-1;i>=0;i--){
    const b=bubbles[i];
    b.y-=b.s*dt; b.w+=dt*2.4; b.x+=Math.sin(b.w)*.28;
    if(b.y<H*.09){ if(b.tmp){bubbles.splice(i,1);continue;} b.y=H*.98;b.x=rnd(0,W); }
  }
  motes.forEach(m=>{m.y-=m.s*dt*.5;m.w+=dt;m.x+=Math.sin(m.w*.6)*.16;
    if(m.y<0){m.y=H;m.x=rnd(0,W);}});
  for(let i=sparks.length-1;i>=0;i--){
    const s2=sparks[i];
    s2.x+=s2.vx;s2.y+=s2.vy;s2.vy+=.02;s2.l--;
    if(s2.l<=0)sparks.splice(i,1);
  }
  for(let i=blooms.length-1;i>=0;i--){
    const bl=blooms[i];
    bl.life++; bl.r+=(bl.maxR-bl.r)*.08; bl.y-=.05;
    if(bl.life>bl.maxLife)blooms.splice(i,1);
  }
}

let awaySummary=null;
function tickWorld(){
  const t=now();
  let el=(t-S.lastTick)/1000;
  if(!isFinite(el)||el<0)el=0;
  if(el>43200)el=43200;
  const wasAway=el>=120;
  S.lastTick=t;
  if(el<=0)return;
  const mins=el/60;
  const dd=diffDef(), td=tankDef(), tl=toolDef();
  const slow=tl.slow;
  const prev=S.clean;
  const bioload=S.fish.reduce((a,f)=>a+(spec(f.sp).size||1)*.055,0);
  const baseDecay=(0.28+bioload)*mins*2*dd.dirtMul*td.dirtMul;
  const toolDecay=baseDecay*slow;
  const plecoCount=S.fish.filter(f=>spec(f.sp).cleanHelp).length;
  const plecoMul=Math.max(.6,1-plecoCount*.08);
  const cleanBoostMul=cleanBoostActive()?Math.max(.05,1-(S.cleanBoost||0)):1;
  S.clean=clamp(S.clean-toolDecay*plecoMul*cleanBoostMul,0,100);
  let autoCoins=0;
  if(slow<1){
    const avoided=baseDecay*(1-slow);
    const rawAuto=(avoided/2.4)*10+(S.autoCleanFrac||0);
    autoCoins=Math.floor(rawAuto);
    S.autoCleanFrac=rawAuto-autoCoins;
    if(autoCoins>0){S.cleans+=Math.round(avoided/2.4);addCoins(autoCoins,false);}
  }
  const hungerHelpCount=S.fish.filter(f=>spec(f.sp).hungerHelp).length;
  const hungerHelpMul=Math.max(.7,1-hungerHelpCount*.06);
  S.fish.forEach(f=>{
    const sp=spec(f.sp);
    f.hunger=clamp(f.hunger-0.42*sp.feed*mins*dd.hungerMul*tl.hungerMul*hungerHelpMul,0,100);
    const neglect=(f.hunger<35?1:0)+(S.clean<35?1:0);
    if(neglect&&loveOf(f)>0)f.love=clamp(loveOf(f)-.14*neglect*mins,0,100);
    if(isFav(f)&&loveOf(f)>0){
      const lonelyFrom=Math.max(favClock(f)+FAV_GRACE,t-el*1000);
      const lonelyMins=Math.max(0,t-lonelyFrom)/60000;
      if(lonelyMins>0)f.love=clamp(loveOf(f)-FAV_LONELY*lonelyMins,0,100);
    }
  });
  const fdDef=feederDef();
  if(fdDef&&S.feederStock>0&&S.feederFoodId&&S.fish.length){
    S.feederAcc=(S.feederAcc||0)+mins;
    let guard=0;
    while(S.feederAcc>=fdDef.interval&&S.feederStock>0&&guard<1000){
      const food=FOODS.find(f=>f.id===S.feederFoodId);
      if(!food)break;
      const per=(food.fill*1.9*(fdDef.fillMul||1))/S.fish.length;
      S.fish.forEach(f=>{f.hunger=clamp(f.hunger+per,0,100);});
      S.feederStock--; S.feederAcc-=fdDef.interval; guard++;
    }
    if(S.feederStock<=0)S.feederAcc=0;
  }
  S.hunger=S.fish.length?S.fish.reduce((a,f)=>a+f.hunger,0)/S.fish.length:100;
  const auraMul=S.fish.reduce((m,f)=>Math.max(m,spec(f.sp).incomeAura||1),1);
  let fishCoins=0, topFish=null, topAmt=0;
  if(S.clean>25){
    const inc=S.fish.reduce((a,f)=>a+(f.hunger>25?fishIncome(f):0),0)*tl.incomeMul*dd.incomeMul*td.incomeMul*auraMul;
    const raw=inc*mins*Math.pow(S.clean/100,1.6)*boostMul()+(S.coinFrac||0);
    fishCoins=Math.floor(raw);
    S.coinFrac=raw-fishCoins;
    if(fishCoins>0)addCoins(fishCoins,false);
    if(wasAway){
      S.fish.forEach(f=>{
        if(f.hunger<=25)return;
        const amt=fishIncome(f)*tl.incomeMul*dd.incomeMul*td.incomeMul*auraMul*mins*Math.pow(S.clean/100,1.6)*boostMul();
        if(amt>topAmt){topAmt=amt;topFish=f;}
      });
    }
  }
  if(Math.abs(prev-S.clean)>3)seedDirt();
  if(wasAway&&(fishCoins+autoCoins)>0){
    awaySummary={total:fishCoins+autoCoins,fish:fishCoins,clean:autoCoins,mins:mins,
      topName:topFish?topFish.name:null,topSp:topFish?spec(topFish.sp).n:null};
  }
}

function holdRepeat(btn,step){
  const begin=ev=>{
    if(ev.type==='mousedown'&&ev.button!==0)return;
    if(btn.disabled)return;
    ev.preventDefault(); stopHold();
    step(1); sfx('tap');
    let reps=0;
    const tick=()=>{
      reps++;
      step(reps>26?10:(reps>12?3:1));
      if(btn.disabled){stopHold();return;}
      holdT=setTimeout(tick,reps>18?45:(reps>6?70:105));
    };
    holdT=setTimeout(tick,420);
  };
  btn.addEventListener('mousedown',begin);
  btn.addEventListener('touchstart',begin,{passive:false});
  btn.addEventListener('mouseleave',stopHold);
}
// Renders the −  [input]  +  MAX control used by the fish and food shelves.
function qtyBox(kind,id,q){
  return '<div class="qty" data-kind="'+kind+'" data-id="'+id+'">'+
    '<button class="qmin" type="button" aria-label="One fewer">−</button>'+
    '<input class="qin" type="text" inputmode="numeric" autocomplete="off" value="'+q+'" aria-label="How many">'+
    '<button class="qplus" type="button" aria-label="One more">+</button>'+
    '<button class="qmax" type="button" title="Fill up to what your coins and space allow">MAX</button>'+
    '<span class="qhint"></span></div>';
}
function qtyOf(kind,id){
  const store=kind==='fish'?buyQty:foodQty;
  const max=Math.max(1,kind==='fish'?maxFishQty(id):maxFoodQty(id));
  const q=clamp(Math.floor(store[id]||1),1,max);
  store[id]=q; return q;
}
function syncQty(kind,id){
  const B=$('shBody'); if(!B)return;
  const q=qtyOf(kind,id);
  const max=Math.max(1,kind==='fish'?maxFishQty(id):maxFoodQty(id));
  const box=B.querySelector('.qty[data-kind="'+kind+'"][data-id="'+id+'"]');
  if(box){
    const inp=box.querySelector('.qin');
    if(inp&&document.activeElement!==inp)inp.value=q;
    const mn=box.querySelector('.qmin'), pl=box.querySelector('.qplus'), mx=box.querySelector('.qmax');
    if(mn)mn.disabled=q<=1;
    if(pl)pl.disabled=q>=max;
    if(mx)mx.disabled=q>=max;
    const hint=box.querySelector('.qhint');
    if(hint){
      if(kind==='food')hint.textContent=q>=10?'📦 −20%':'';
      else if(q>1&&q>=max){
        const sp=spec(id), free=Math.max(0,tankDef().cap-S.fish.length);
        const afford=(sp&&sp.price>0)?Math.floor(S.coins/sp.price):Infinity;
        hint.textContent=free<=afford?'fills the tank':'spends every coin';
      }else hint.textContent='';
    }
  }
  const btn=B.querySelector('['+(kind==='fish'?'data-buy':'data-food')+'="'+id+'"]');
  if(!btn)return;
  if(kind==='fish'){
    const sp=spec(id); if(!sp)return;
    btn.textContent=sp.price?fmt(sp.price*q)+' 🪙':'FREE';
    btn.disabled=S.coins<sp.price*q||S.fish.length>=tankDef().cap;
  }else{
    const f=FOODS.find(x=>x.id===id); if(!f)return;
    const total=foodCost(f,q);
    btn.textContent=fmt(total)+' 🪙';
    btn.disabled=S.coins<total;
  }
}
function wireQty(box){
  const kind=box.dataset.kind, id=box.dataset.id;
  const store=kind==='fish'?buyQty:foodQty;
  const maxOf=()=>Math.max(1,kind==='fish'?maxFishQty(id):maxFoodQty(id));
  const set=v=>{store[id]=clamp(Math.floor(v)||1,1,maxOf());syncQty(kind,id);};
  const inp=box.querySelector('.qin');
  holdRepeat(box.querySelector('.qmin'),n=>set((store[id]||1)-n));
  holdRepeat(box.querySelector('.qplus'),n=>set((store[id]||1)+n));
  box.querySelector('.qmax').onclick=()=>{sfx('tap');set(maxOf());};
  inp.onfocus=()=>{try{inp.select();}catch(e){}};
  inp.oninput=()=>{
    let v=inp.value.replace(/[^0-9]/g,'').slice(0,5);
    if(v!==''){
      const max=maxOf();
      let n=parseInt(v,10)||0;
      if(n>max){n=max;v=String(max);}
      store[id]=Math.max(1,n);
    }
    if(v!==inp.value)inp.value=v;
    syncQty(kind,id);
  };
  inp.onblur=()=>{set(parseInt(inp.value,10)||1);inp.value=store[id];};
  inp.onkeydown=e=>{
    if(e.key==='Enter'){e.preventDefault();inp.blur();}
    else if(e.key==='ArrowUp'){e.preventDefault();set((store[id]||1)+1);inp.value=store[id];}
    else if(e.key==='ArrowDown'){e.preventDefault();set((store[id]||1)-1);inp.value=store[id];}
  };
}

function findDecoAt(x,y){
  if(y<H*.66||y>H*.96)return null;
  let best=null,bd=1e9;
  S.decoPlaced.forEach(d=>{
    const dx=Math.abs((d._x!=null?d._x:W/2)-x);
    if(dx<44&&dx<bd){bd=dx;best=d;}
  });
  return best;
}

function scrub(x,y){
  const R=18+toolDef().pw*5;
  let hit=0;
  for(let i=dirt.length-1;i>=0;i--){
    const d=dirt[i];
    if((d.x-x)*(d.x-x)+(d.y-y)*(d.y-y)<(R+d.r)*(R+d.r)){
      d.hp-=.20+toolDef().pw*.06;
      if(d.hp<=0){
        dirt.splice(i,1);hit++;
        for(let k=0;k<5;k++)sparks.push({x:d.x,y:d.y,vx:rnd(-1,1),vy:rnd(-1.2,-.1),l:22,c:'#a8f0dd'});
      }
    }
  }
  if(hit){
    S.clean=clamp(S.clean+hit*2.4,0,100);
    S.cleans+=hit;
    const res=applyDouble(Math.round(hit*10*boostMul()));
    addCoins(res.amt,true,x,y-12);
    if(res.doubled)toast('💥 Double payout!','gold');
    sfx('scrub'); checkAch(); save(); refreshHUD();
  }else if(Math.random()<.08)sfx('scrub');
}
function applyDouble(n){
  const toolCh=toolDef().doubleChance||0;
  const fishCh=S.fish.reduce((m,f)=>Math.max(m,spec(f.sp).doubleChance||0),0);
  const ch=1-(1-toolCh)*(1-fishCh);
  if(ch>0&&Math.random()<ch){grant('doubled1');return {amt:n*2,doubled:true};}
  return {amt:n,doubled:false};
}
function stackBoost(magKey,endKey,inc,dur,msg){
  const active=now()<(S[endKey]||0);
  S[magKey]=active?Math.max(S[magKey]||0,inc):inc;
  S[endKey]=now()+dur;
  toast(msg(S[magKey]),'gold');
}

function pos(ev){
  const r=cv.getBoundingClientRect();
  const p=(ev.touches&&ev.touches[0])||ev;
  return {x:(p.clientX-r.left)/dispZoom,y:(p.clientY-r.top)/dispZoom};
}
let dragPetted=null;
function tryPetAt(x,y){
  let best=null,bd=1e9;
  ENT.forEach(e=>{
    const d=(e.x-x)*(e.x-x)+(e.y-y)*(e.y-y);
    const R=34*e.sp.size;
    if(d<R*R&&d<bd){bd=d;best=e;}
  });
  if(best&&(!dragPetted||!dragPetted.has(best.id))){
    if(dragPetted)dragPetted.add(best.id);
    petFish(best);
    return true;
  }
  return false;
}
function down(ev){
  audioInit();audioResume();
  const {x,y}=pos(ev);
  cursor.x=x;cursor.y=y;cursor.on=true;
  if(armed==='feed'){ev.preventDefault();dropFood(x,y);return;}
  if(armed==='clean'){ev.preventDefault();dragging=true;scrub(x,y);return;}
  dragPetted=new Set();
  petSession={count:0,coins:0,firstName:null};
  if(tryPetAt(x,y))return;
  const dec=findDecoAt(x,y);
  if(dec){
    ev.preventDefault();
    draggingDeco=dec;
    decoDragOffset=(dec._x!=null?dec._x:W/2)-x;
    dragPetted=null;
    petSession=null;
    sfx('tap');
  }else{
    for(let i=0;i<3;i++)bubbles.push({x:x+rnd(-8,8),y:y,r:rnd(2,4),s:rnd(24,44),w:rnd(0,6),tmp:1});
    sfx('bubble');
  }
}
function move(ev){
  const {x,y}=pos(ev);
  cursor.x=x;cursor.y=y;
  if(dragging&&armed==='clean'){ev.preventDefault();scrub(x,y);}
  if(draggingDeco){
    ev.preventDefault();
    draggingDeco._x=clamp(x+decoDragOffset,30,W-30);
    draggingDeco.fx=draggingDeco._x/W;
  }
  if(dragPetted&&!armed&&!draggingDeco){
    tryPetAt(x,y);
  }
}

    if(petSession.count===1)toast(petSession.firstName+' loved that! +'+petSession.coins+' 🪙');
    else if(petSession.count>1)toast('Petted '+petSession.count+' fish! +'+petSession.coins+' 🪙');

  }
}

    ENT.forEach(en=>{const d=(en.x-x)*(en.x-x)+(en.y-y)*(en.y-y);const R=34*en.sp.size;
      if(d<R*R&&d<bd){bd=d;best=en;}});

  }
});

let toastQueue=[], toastBusy=false;
function toast(msg,kind){
  toastQueue.push({msg:msg,kind:kind});
  if(!toastBusy)advanceToast();
}
function advanceToast(){
  if(!toastQueue.length){toastBusy=false;return;}
  toastBusy=true;
  const t=toastQueue.shift();
  const box=$('toasts');
  box.innerHTML='';
  const el=document.createElement('div');
  el.className='toast'+(t.kind==='gold'?' gold':'');
  el.textContent=t.msg;
  box.appendChild(el);
  setTimeout(()=>{el.remove();advanceToast();},2600);
}

function sellPrice(f){

function scaleGameReward(sp){return Math.max(15,Math.round(15+sp.price*.015));}
function breedPartner(f){

}
function breedCost(sp){return Math.max(20,Math.round(sp.price*.5));}
function canBreed(f){

function renameFish(id){

  const sugs=[];
  const used=new Set(S.fish.map(x=>x.name));
  const rnSp=spec(f.sp);
  while(sugs.length<4){const n=newName(used,rnSp);if(sugs.indexOf(n)<0)sugs.push(n);}
  openModal('Rename',
    '<p style="opacity:.75;font-size:13px;margin-bottom:10px">What should we call this one?</p>'+
    '<input type="text" id="rnIn" maxlength="18" value="'+esc(f.name)+'"/>'+
    '<div style="display:flex;gap:7px;flex-wrap:wrap;margin:11px 0 4px">'+

    '</div><button class="btn wide" id="rnSave">Save name</button>');

  $('sh2Body').querySelectorAll('[data-sug]').forEach(b=>b.onclick=()=>{inp.value=b.dataset.sug;sfx('tap');});

    checkAch(); save(); closeModal();
    if(scrim.classList.contains('on'))openFishies();
  };
  $('rnSave').onclick=go;

function buildStatsCard(){
  const W2=340, H2=480, tankH=280;
  const out=document.createElement('canvas');
  out.width=W2; out.height=H2;
  const g=out.getContext('2d');
  g.fillStyle='#062a45'; g.fillRect(0,0,W2,H2);
  const srcW=cv.width, srcH=cv.height;
  const scale=Math.max(W2/srcW,tankH/srcH);
  const sw=W2/scale, sh=tankH/scale;
  const sx=(srcW-sw)/2, sy=(srcH-sh)*.35;
  g.drawImage(cv,sx,sy,sw,sh,0,0,W2,tankH);
  const grad=g.createLinearGradient(0,tankH-60,0,tankH);
  grad.addColorStop(0,'rgba(6,42,69,0)'); grad.addColorStop(1,'rgba(6,42,69,1)');
  g.fillStyle=grad; g.fillRect(0,tankH-60,W2,60);
  g.fillStyle='#062a45'; g.fillRect(0,tankH,W2,H2-tankH);
  g.fillStyle='#ffce4d'; g.font='800 21px Nunito,sans-serif'; g.textAlign='left';
  g.fillText(S.name+"'s Aquarium",18,tankH+34);
  g.fillStyle='rgba(255,255,255,.6)'; g.font='700 11px Nunito,sans-serif';
  const dd=diffDef();
  g.fillText(dd.e+' '+dd.n+' difficulty',18,tankH+54);
  const gotN=Object.keys(S.ach).length;
  const rows=[['🐠',String(S.fish.length),'Fish'],['🪙',fmt(S.totalCoins),'Coins earned'],
    ['🏆',String(gotN),'Achievements'],['📅',String(S.streak),'Day streak']];
  const colW=W2/2, rowH=70, top=tankH+70;
  rows.forEach((r,i)=>{
    const cx2=(i%2)*colW+colW/2, cy2=top+Math.floor(i/2)*rowH;
    g.textAlign='center';
    g.font='800 20px Nunito,sans-serif'; g.fillStyle='#ffce4d';
    g.fillText(r[0]+' '+r[1],cx2,cy2);
    g.font='700 10px Nunito,sans-serif'; g.fillStyle='rgba(255,255,255,.55)';
    g.fillText(r[2].toUpperCase(),cx2,cy2+18);
  });
  g.textAlign='center'; g.font='700 10px Nunito,sans-serif'; g.fillStyle='rgba(255,255,255,.4)';
  g.fillText('made with Fishies 🐠',W2/2,H2-14);
  return out.toDataURL('image/png');
}

function importSave(){
  const inp=document.createElement('input');
  inp.type='file'; inp.accept='application/json,.json';
  inp.onchange=()=>{
    const file=inp.files&&inp.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      let d;
      try{d=JSON.parse(reader.result);}catch(e){toast('Could not read that file','err');sfx('err');return;}
      if(!d||typeof d!=='object'||!Array.isArray(d.fish)||typeof d.coins!=='number'){
        toast('That doesn’t look like a Fishies save','err');sfx('err');return;
      }
      openModal('Import this save?',
        '<p style="opacity:.8;font-size:13.5px;line-height:1.6;margin-bottom:14px">This will replace your current tank — '+
        S.fish.length+' fish and '+fmt(S.coins)+' 🪙 — with the save you picked ('+
        d.fish.length+' fish, '+fmt(d.coins||0)+' 🪙). This can\'t be undone.</p>'+
        '<button class="btn wide" id="yesImp">Yes, import it</button>'+
        '<button class="btn wide ghost" id="noImp" style="margin-top:8px">Cancel</button>');
      $('noImp').onclick=()=>{sfx('tap');closeModal();};
      $('yesImp').onclick=()=>{
        try{
          localStorage.setItem(activeKey(),JSON.stringify(d));
          musicStop();
          S=load();
          updateSlotMeta(getActiveSlot());
          syncEnt(); seedDirt(); layoutDeco(); refreshHUD();
          closeModal(); closeSheet(); toast('Save imported 🎉','gold'); sfx('buy');
          musicSync();
        }catch(e){toast('Import failed','err');sfx('err');}
      };
    };
    reader.readAsText(file);
  };
  inp.click();
}

    '<div class="st"><div class="v">'+fmt(s.fish)+'</div><div class="k">From your fish</div></div>'+
    '<div class="st"><div class="v">'+fmt(s.clean)+'</div><div class="k">Auto-cleaned</div></div></div>'+
    (s.topName?'<p style="font-size:12px;margin-top:6px;opacity:.8">Top earner: <b>'+esc(s.topName)+'</b> the '+esc(s.topSp)+'</p>':'')+
    '<button class="btn wide" id="wbOk" style="margin-top:12px">Nice!</button></div>');
  $('wbOk').onclick=()=>{sfx('coin');closeModal();setTimeout(checkDaily,150);};
  setTimeout(()=>sfx('coin'),200);
}
function checkDaily(){
  const today=dayNum(now()), lastD=S.lastLogin?dayNum(S.lastLogin):0;
  if(lastD===today)return;
  S.streak=(lastD===today-1)?Math.min(S.streak+1,999):1;
  S.lastLogin=now();
  const streakFishBonus=S.fish.reduce((m,f)=>Math.max(m,spec(f.sp).streakBonus||0),0);
  const total=50+Math.min(S.streak,7)*25+streakFishBonus;
  addCoins(total,false);
  S.food.pellet=(S.food.pellet||0)+2;
  if(S.streak%7===0)S.food.gourmet=(S.food.gourmet||0)+1;
  checkAch(); saveNow(); refreshHUD();
  const d7=[0,1,2,3,4,5,6].map(i=>'<i class="'+(i<Math.min(S.streak,7)?'on':'')+'">'+(i+1)+'</i>').join('');
  openModal('Welcome back',
    '<div class="reward"><div class="big">🎁</div><h3>Day '+S.streak+'</h3>'+
    '<p>Thanks for checking on your fishies.</p>'+
    '<div class="amt">+'+total+' 🪙</div>'+
    (streakFishBonus?'<p style="font-size:11px;opacity:.6">Includes +'+streakFishBonus+' 🪙 from a loyal fish</p>':'')+
    '<p style="font-size:12px">Plus 2× Pellets'+(S.streak%7===0?' and a Gourmet feast!':'')+'</p>'+
    '<div class="streak">'+d7+'</div>'+
    '<p style="font-size:11px;opacity:.6">Come back tomorrow to keep the streak</p>'+
    '<button class="btn wide" id="claimBtn" style="margin-top:12px">Collect</button></div>');
  $('claimBtn').onclick=()=>{sfx('coin');closeModal();refreshHUD();};
  setTimeout(()=>sfx('coin'),350);
}
function checkSeason(){
  const s=seasonNow();
  if(S.seasonSeen!==s){
    S.seasonSeen=s;
    toast(SEASONS[s].emo+' '+SEASONS[s].name+' has arrived','gold');
    musicSync(); saveNow(); refreshHUD();
  }
}

$('tFeed').onclick=()=>{
  audioInit();
  if(armed==='feed'){setArmed('feed');return;}
  if(!currentFood()){toast('Out of food — buy some','err');sfx('err');openShop('food');return;}
  openFoodPicker();
};
$('tClean').onclick=()=>{audioInit();setArmed('clean');};
$('tShop').onclick=()=>{audioInit();sfx('tap');armed=null;
  $('tFeed').classList.remove('armed');$('tClean').classList.remove('armed');updateHint();openShop('fish');};
$('tFish').onclick=()=>{audioInit();sfx('tap');armed=null;
  $('tFeed').classList.remove('armed');$('tClean').classList.remove('armed');updateHint();openFishies();};
$('menuBtn').onclick=()=>{audioInit();sfx('tap');openMenu();};
$('coinChip').onclick=()=>{audioInit();sfx('tap');armed=null;
  $('tFeed').classList.remove('armed');$('tClean').classList.remove('armed');updateHint();openCoinShop();};
$('fishChip').onclick=()=>{audioInit();sfx('tap');armed=null;
  $('tFeed').classList.remove('armed');$('tClean').classList.remove('armed');updateHint();openFishies();};
$('muteBtn').onclick=()=>{
  audioInit();
  const on=S.music||S.sound;
  S.music=!on; S.sound=!on;
  musicSync(); save(); refreshHUD();
  if(!on)sfx('tap');
  toast(!on?'Sound on 🔊':'Sound off 🔇');
};
function proceedIntoGame(){
  audioInit(); audioResume();
  $('splash').classList.add('gone');
  setTimeout(()=>{$('splash').style.display='none';},700);
  musicSync();
  if(!S.onboarded){
    S.onboarded=true; saveNow();
    setTimeout(()=>runOnboarding(0),500);
  }else if(awaySummary){
    setTimeout(showWelcomeBack,500);
  }else{
    setTimeout(checkDaily,500);
  }
}
function startNewSlot(diffId,name){
  const id='s'+Date.now()+Math.floor(Math.random()*99);
  const st=fresh();
  st.difficulty=diffId;
  const cleanName=(name||'').trim().slice(0,20);
  if(cleanName)st.name=cleanName;
  const isDev=diffId==='easy'&&cleanName.toLowerCase()==='fishngo';
  if(isDev||wantsDevMode())st.devMode=true;
  try{localStorage.setItem(slotKey(id),JSON.stringify(st));}catch(e){}
  setActiveSlot(id);
  musicStop();
  S=st; ENT=[]; pellets=[]; sparks=[]; blooms=[];
  updateSlotMeta(id);
  dispZoom=tankZoom();
  resize(); tickWorld(); syncEnt(); initFx(); seedDirt(); layoutDeco(); refreshHUD(); checkSeason();
  proceedIntoGame();
  if(isDev||wantsDevMode())setTimeout(()=>{toast('🛠️ Developer Mode unlocked — check Settings','gold');sfx('ach');},1300);
}
function renderDifficultyPicker(){
  const el=$('splash');
  let h='<div class="lg">Fishies</div><div class="sb">a cozy little aquarium</div>'+
    '<div style="margin-top:22px;width:min(84vw,320px)">'+
    '<input type="text" id="newName" maxlength="20" placeholder="Name your keeper" style="text-align:center"/></div>'+
    '<div style="margin-top:14px;display:flex;flex-direction:column;gap:10px;width:min(84vw,320px)">';
  DIFFICULTIES.forEach(d=>{
    h+='<button class="btn wide" data-diff="'+d.id+'" style="text-align:left;display:flex;gap:10px;align-items:center;'+
      'background:rgba(255,255,255,.12);color:#fff;box-shadow:none;padding:12px 14px;white-space:normal">'+
      '<span style="font-size:22px;flex:none">'+d.e+'</span><span style="min-width:0;flex:1"><b style="display:block;font-size:13.5px">'+d.n+'</b>'+
      '<span style="font-size:11px;opacity:.8;font-weight:600;display:block">'+d.desc+'</span></span></button>';
  });
  h+='</div><div class="sb" style="margin-top:16px;opacity:.65;font-size:11px">Name yourself, then choose a difficulty to start your aquarium</div>';
  el.innerHTML=h;
  const nameInp=$('newName');
  if(nameInp){
    nameInp.addEventListener('click',e=>e.stopPropagation());
    nameInp.addEventListener('touchstart',e=>e.stopPropagation());
    nameInp.addEventListener('keydown',e=>e.stopPropagation());
  }
  el.querySelectorAll('[data-diff]').forEach(b=>b.addEventListener('click',e=>{
    e.stopPropagation();
    startNewSlot(b.dataset.diff,nameInp?nameInp.value:'');
  }));
}
$('splash').onclick=()=>{
  if(!getActiveSlot())return;
  proceedIntoGame();
};
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)saveNow();
  else{
    tickWorld();refreshHUD();audioResume();
    if(awaySummary&&!scrim.classList.contains('on')&&!scrim2.classList.contains('on')){
      setTimeout(showWelcomeBack,300);
    }
  }
});
window.addEventListener('pagehide',saveNow);

// MOS's "Play as DevOps" opens with ?devmode=1 — this is a second door into
// the same S.devMode gate the "fishngo" easter egg already unlocks (see
// startNewSlot above), so the existing Settings > Developer Mode tools work
// without anyone needing to know that phrase.
function wantsDevMode(){
  try{ return new URLSearchParams(location.search).get('devmode')==='1'; }catch(e){ return false; }
}
function boot(){
  const activeId=ensureSlots();
  S=activeId?load():fresh();
  if(activeId&&wantsDevMode()&&!S.devMode){
    S.devMode=true; saveNow();
    setTimeout(()=>{toast('🛠️ Developer Mode unlocked — check Settings','gold');sfx('ach');},1300);
  }
  dispZoom=tankZoom();
  resize(); tickWorld(); syncEnt(); initFx(); seedDirt(); layoutDeco();
  refreshHUD(); checkSeason();
  requestAnimationFrame(loop);
  setInterval(()=>{
    tickWorld();
    refreshHUD(); checkAch(); save();
  },10000);
  setInterval(()=>{
    if(scrim.classList.contains('on')&&lastShopTab)openShop(lastShopTab);
  },2000);
  setInterval(checkSeason,60000);
  setInterval(()=>{
    const want=Math.round((100-S.clean)/2.4);
    if(dirt.length<want-2)seedDirt();
  },7000);
  if(!activeId)renderDifficultyPicker();
}
boot();
</script>
</body>
</html>
