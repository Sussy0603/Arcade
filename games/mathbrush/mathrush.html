<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B0B14">
<title>Math Rush — STeamWorkS</title>
<!--
════════════════════════════════════════════════════════════════════════
  STeamWorkS · Math Rush · v1.0.0 · single self-contained file
════════════════════════════════════════════════════════════════════════
  MOS INTEGRATION
  ───────────────
    <iframe src="mathrush.html?embed=1&prefix=PLAYER_ID"
            style="width:100%;height:100%;border:0" allow="autoplay"></iframe>

    window.addEventListener('message', (e) => {
      if (e.data && e.data.source === 'stws-puzzle') {
        // e.data = {source:'stws-puzzle', game:'mathrush', event, ...payload}
        // events: ready · newPuzzle · start · win · gameover
        // win/gameover payloads carry the run's stats (moves, time, score…)
      }
    });

  URL params:
    ?embed=1       hide footer chrome
    ?prefix=<id>   namespace localStorage per player  (stws-mathrush-v1:<id>)
    ?mute=1        start muted
    ?seed=<any>    deterministic puzzles (same seed = same sequence)
    ?daily=1       seed from today's date — everyone gets the same puzzle
    ?diff=<id>     start on a specific difficulty (where the game has them)

  Same-page API: STWGame.newGame() · STWGame.on(evt,cb) · STWGame.config
════════════════════════════════════════════════════════════════════════
-->
<style>
:root{
  --night:#0B0B14; --panel:#15152A; --panel-2:#1A1F38;
  --milk:#F2EFFF; --faded:#8B87A8; --line:rgba(242,239,255,.08);
  --acc:#38B6FF;
  --round:18px;
  --font:"SF Pro Rounded",ui-rounded,"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--night);color:var(--milk);font-family:var(--font);overflow:hidden;
  -webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;
  user-select:none;-webkit-user-select:none;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(55% 38% at 25% -5%, color-mix(in srgb,var(--acc) 9%,transparent), transparent 60%);
}
#app{
  position:relative;height:100dvh;max-width:520px;margin:0 auto;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#top{display:flex;align-items:center;gap:12px;padding:14px 16px 10px}
#top .ico{font-size:30px;line-height:1;filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--acc) 55%,transparent))}
#top h1{font-size:19px;font-weight:900;letter-spacing:.02em;line-height:1.1}
#top .sub{font-size:10px;font-weight:800;letter-spacing:.3em;color:var(--faded);text-transform:uppercase;margin-top:2px}
#top .grow{flex:1}
.iconbtn{
  width:40px;height:40px;border-radius:13px;border:1px solid var(--line);
  background:var(--panel);color:var(--milk);font-size:16px;font-family:var(--font);
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
  transition:transform .12s ease;
}
.iconbtn:active{transform:scale(.92)}
.iconbtn:focus-visible{outline:2px solid var(--milk);outline-offset:2px}
#status{display:flex;gap:8px;justify-content:center;padding:2px 16px 8px;flex-wrap:wrap}
.chip{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:6px 13px;text-align:center;min-width:66px;
}
.chip .l{font-size:9px;font-weight:800;letter-spacing:.22em;color:var(--faded);text-transform:uppercase}
.chip .v{font-size:17px;font-weight:900;color:var(--acc);font-variant-numeric:tabular-nums;margin-top:1px}
#toolrow{display:flex;gap:8px;justify-content:center;padding:0 16px 8px}
#toolrow:empty{display:none}
.pill{
  border:1px solid var(--line);background:var(--panel);color:var(--faded);
  font-family:var(--font);font-size:12px;font-weight:800;letter-spacing:.06em;
  padding:8px 16px;border-radius:999px;cursor:pointer;transition:transform .12s ease;
}
.pill:active{transform:scale(.94)}
.pill.on{background:var(--acc);color:#10101C;border-color:transparent}
#stage{flex:1;position:relative;min-height:0;margin:0 10px}
#board{position:absolute;inset:0;touch-action:none}
#ovl{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(11,11,20,.72);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  border-radius:var(--round);z-index:5;
}
#ovl[hidden]{display:none}
.ov-in{text-align:center;padding:26px 28px;max-width:330px;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1}}
.ov-ico{
  width:86px;height:86px;margin:0 auto 14px;border-radius:26px;
  background:var(--panel-2);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:42px;
  box-shadow:0 10px 40px -8px var(--acc);
}
.ov-in h2{font-size:25px;font-weight:900;letter-spacing:.02em}
.ov-in .tip{margin-top:10px;font-size:14px;line-height:1.55;color:var(--faded);font-weight:600}
.ov-in .chips{display:flex;gap:8px;justify-content:center;margin-top:16px}
.cta{margin-top:22px;font-size:12px;font-weight:900;letter-spacing:.3em;color:var(--milk)}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.btn{
  margin-top:16px;display:inline-block;padding:12px 22px;border-radius:14px;
  background:var(--acc);border:0;color:#10101C;
  font-family:var(--font);font-size:13px;font-weight:900;letter-spacing:.06em;cursor:pointer;
  transition:transform .12s ease;
}
.btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--milk)}
.btn:active{transform:scale(.94)}
.btn:focus-visible{outline:2px solid var(--milk);outline-offset:2px}
#foot{
  padding:10px 16px calc(12px + env(safe-area-inset-bottom));
  font-size:10.5px;color:var(--faded);text-align:center;font-weight:600;letter-spacing:.05em;
}
body.embed #foot{display:none}
@media (prefers-reduced-motion:reduce){.pulse,.ov-in{animation:none}}
@media (min-width:560px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.wmr{position:absolute;inset:0;display:flex;flex-direction:column;gap:16px;padding:4px 2px}
.mq{
  flex:1;display:flex;align-items:center;justify-content:center;
  font-size:clamp(30px,10vw,52px);font-weight:900;font-variant-numeric:tabular-nums;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--round);
  letter-spacing:.04em;
}
.mq.mqin{animation:mqin .16s ease}
@keyframes mqin{from{opacity:0;transform:scale(.92)}}
.mq.mqbad{background:rgba(255,92,108,.16);border-color:#FF5C6C;animation:ashk2 .3s ease}
@keyframes ashk2{25%{transform:translateX(-8px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.mbtns{display:flex;gap:12px;height:110px}
.mbtn{
  flex:1;border-radius:var(--round);border:1px solid var(--line);cursor:pointer;
  font-family:var(--font);font-size:38px;font-weight:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:transform .08s ease;
}
.mbtn span{font-size:11px;font-weight:800;letter-spacing:.25em;text-transform:uppercase;opacity:.7}
.mbtn:active{transform:scale(.95)}
.mbtn.yes{background:rgba(166,245,72,.12);color:#A6F548;border-color:rgba(166,245,72,.3)}
.mbtn.no{background:rgba(255,92,108,.10);color:#FF5C6C;border-color:rgba(255,92,108,.3)}

</style>
</head>
<body>
<div id="app">
  <header id="top">
    <span class="ico">➗</span>
    <div><h1>Math Rush</h1><div class="sub">STeamWorkS</div></div>
    <div class="grow"></div>
    <button class="iconbtn" id="btnUndo" aria-label="Undo" hidden>↩</button>
    <button class="iconbtn" id="btnNew" aria-label="New puzzle">↻</button>
    <button class="iconbtn" id="btnSnd" aria-label="Toggle sound">🔊</button>
  </header>
  <div id="status"></div>
  <div id="toolrow"></div>
  <div id="stage">
    <div id="board"></div>
    <div id="ovl" hidden></div>
  </div>
  <footer id="foot">Single file · saves on this device · v1.0.0</footer>
</div>
<script>
(() => {
'use strict';

/* ══ shell: helpers ════════════════════════════════════ */
const GAME_ID = 'mathrush', GAME_TITLE = 'Math Rush', GAME_ICON = '➗', ACCENT = '#38B6FF';
const GAME_TIP = 'Is the equation true or false? Answer before the bar runs out. Three hearts, rising speed.';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const $ = s => document.querySelector(s);
const FONT = '"SF Pro Rounded",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif';

/* ══ shell: config + seeded rng ════════════════════════ */
const QS = new URLSearchParams(location.search);
const CFG = {
  embed: QS.get('embed') === '1',
  mute: QS.get('mute') === '1',
  prefix: QS.get('prefix') || '',
  seed: QS.get('seed') || '',
  daily: QS.get('daily') === '1',
  diff: QS.get('diff') || ''
};
if (CFG.daily && !CFG.seed) {
  const d = new Date();
  CFG.seed = '' + d.getFullYear() + String(d.getMonth() + 1).padStart(2, '0') + String(d.getDate()).padStart(2, '0');
}
if (CFG.embed) document.body.classList.add('embed');

function strHash(s) {
  let h = 1779033703;
  for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); }
  return h >>> 0;
}
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let seedBase = CFG.seed ? strHash(CFG.seed) : null;
let gameN = 0;
let rng = Math.random;
function freshRng() { gameN++; rng = seedBase !== null ? mulberry32(seedBase + gameN * 7919) : Math.random; }
function setSeed(s) { seedBase = (s !== null && s !== undefined && s !== '') ? strHash('' + s) : null; gameN = 0; }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
const RF = (a = 1, b) => b === undefined ? rng() * a : a + rng() * (b - a);
const RI = (a, b) => Math.floor(RF(a, b + 1));
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };

/* ══ shell: storage ════════════════════════════════════ */
const STORE_KEY = 'stws-' + GAME_ID + '-v1' + (CFG.prefix ? ':' + CFG.prefix : '');
const DATA = (() => {
  try { return Object.assign({ sound: true, seen: false, best: {}, diff: '', save: null }, JSON.parse(localStorage.getItem(STORE_KEY) || '{}')); }
  catch (e) { return { sound: true, seen: false, best: {}, diff: '', save: null }; }
})();
if (CFG.mute) DATA.sound = false;
const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(DATA)); } catch (e) {} };

/* ══ shell: audio synth ════════════════════════════════ */
const AU = {
  ctx: null,
  ensure() {
    if (!this.ctx) { try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  },
  tone(f, d, type = 'sine', g = 0.15, slide = 0, at = 0) {
    if (!DATA.sound || !this.ctx) return;
    const t = this.ctx.currentTime + at;
    const o = this.ctx.createOscillator(), ga = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + d);
    ga.gain.setValueAtTime(g, t);
    ga.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(ga).connect(this.ctx.destination);
    o.start(t); o.stop(t + d + 0.02);
  },
  noise(d = 0.15, g = 0.18, fq = 1000) {
    if (!DATA.sound || !this.ctx) return;
    const t = this.ctx.currentTime, n = Math.floor(this.ctx.sampleRate * d);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fq;
    const ga = this.ctx.createGain(); ga.gain.value = g;
    src.connect(f).connect(ga).connect(this.ctx.destination);
    src.start(t);
  },
  play(name, p = 1) {
    switch (name) {
      case 'ui':    this.tone(520, 0.07, 'triangle', 0.10); break;
      case 'tap':   this.tone(300, 0.05, 'square', 0.06); break;
      case 'tick':  this.tone(230, 0.04, 'square', 0.05); break;
      case 'slide': this.noise(0.07, 0.08, 1400); break;
      case 'ok':    this.tone(540 * p, 0.09, 'triangle', 0.14); this.tone(810 * p, 0.11, 'triangle', 0.10, 0, 0.05); break;
      case 'good':  this.tone(660, 0.10, 'triangle', 0.14); this.tone(990, 0.14, 'triangle', 0.11, 0, 0.07); break;
      case 'pour':  this.tone(300, 0.16, 'sine', 0.12, 160); this.noise(0.10, 0.06, 900); break;
      case 'pop':   this.noise(0.10, 0.20, 1600); this.tone(200 * p, 0.07, 'square', 0.10); break;
      case 'bad':   this.tone(220, 0.16, 'sawtooth', 0.10, -80); break;
      case 'fail':  this.tone(300, 0.38, 'sawtooth', 0.13, -210); this.noise(0.2, 0.10, 500); break;
      case 'level': [440, 550, 660, 880].forEach((f, i) => this.tone(f, 0.10, 'triangle', 0.12, 0, i * 0.07)); break;
      case 'win':   [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.13, 'triangle', 0.13, 0, i * 0.085)); break;
    }
  }
};
const snd = (n, p) => AU.play(n, p);

/* ══ shell: events (postMessage for MOS) ═══════════════ */
const listeners = {};
function on(ev, cb) { (listeners[ev] = listeners[ev] || []).push(cb); }
function emit(ev, payload = {}) {
  (listeners[ev] || []).forEach(cb => { try { cb(payload); } catch (e) {} });
  if (window.parent !== window) {
    try { window.parent.postMessage(Object.assign({ source: 'stws-puzzle', game: GAME_ID, event: ev }, payload), '*'); } catch (e) {}
  }
}

/* ══ shell: status chips + toolbar pills ═══════════════ */
const boardEl = $('#board'), ovl = $('#ovl'), statusEl = $('#status'), toolEl = $('#toolrow');
function setChips(pairs) {
  statusEl.innerHTML = pairs.map(p =>
    '<div class="chip"><div class="l">' + p[0] + '</div><div class="v">' + p[1] + '</div></div>').join('');
}
function setPills(list, cur, cb) {
  toolEl.innerHTML = '';
  for (const d of list) {
    const b = document.createElement('button');
    b.className = 'pill' + (d.id === cur ? ' on' : '');
    b.textContent = d.label;
    b.addEventListener('click', () => { snd('ui'); cb(d.id); });
    toolEl.appendChild(b);
  }
}

/* ══ shell: overlays ═══════════════════════════════════ */
let ovlAction = null;
function overlay(html, tapAction) {
  ovl.innerHTML = html; ovl.hidden = false; ovlAction = tapAction || null;
}
function hideOverlay() { ovl.hidden = true; ovlAction = null; }
function chipsHtml(pairs) {
  return '<div class="chips">' + pairs.map(p =>
    '<div class="chip"><div class="l">' + p[0] + '</div><div class="v">' + p[1] + '</div></div>').join('') + '</div>';
}
function winOverlay(pairs, payload) {
  snd('win');
  emit('win', payload || {});
  overlay(
    '<div class="ov-in">' +
      '<div class="ov-ico">' + GAME_ICON + '</div>' +
      '<h2>Solved!</h2>' +
      chipsHtml(pairs) +
      '<div><button class="btn" id="ovNew">New puzzle</button></div>' +
    '</div>');
}
function overOverlay(title, pairs, payload) {
  snd('fail');
  emit('gameover', payload || {});
  overlay(
    '<div class="ov-in">' +
      '<div class="ov-ico">' + GAME_ICON + '</div>' +
      '<h2>' + title + '</h2>' +
      chipsHtml(pairs) +
      '<div><button class="btn" id="ovNew">Play again</button></div>' +
    '</div>');
}
function helpOverlay() {
  overlay(
    '<div class="ov-in">' +
      '<div class="ov-ico">' + GAME_ICON + '</div>' +
      '<h2>' + GAME_TITLE + '</h2>' +
      '<p class="tip">' + GAME_TIP + '</p>' +
      '<div class="cta pulse">TAP TO PLAY</div>' +
    '</div>', 'close');
  DATA.seen = true; save();
}
ovl.addEventListener('click', e => {
  if (e.target.closest('#ovNew')) { AU.ensure(); snd('ui'); hideOverlay(); game.newGame(); return; }
  if (e.target.closest('.btn')) return;
  if (ovlAction === 'close') { AU.ensure(); hideOverlay(); }
});

/* ══ shell: timer ══════════════════════════════════════ */
const T = {
  t0: 0, acc: 0, run: false,
  reset() { this.t0 = 0; this.acc = 0; this.run = false; },
  start() { if (!this.run) { this.run = true; this.t0 = Date.now(); } },
  stop() { if (this.run) { this.acc += Date.now() - this.t0; this.run = false; } },
  sec() { return Math.floor((this.acc + (this.run ? Date.now() - this.t0 : 0)) / 1000); }
};
const fmtT = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
setInterval(() => { if (game.tick) game.tick(); }, 500);

/* ══ shell: canvas helper ══════════════════════════════ */
let CW = 0, CH = 0;
function initCanvas() {
  const cvs = document.createElement('canvas');
  cvs.style.cssText = 'position:absolute;inset:0;display:block;touch-action:none';
  boardEl.appendChild(cvs);
  const g = cvs.getContext('2d');
  function fit() {
    const r = boardEl.getBoundingClientRect();
    CW = Math.max(1, Math.round(r.width)); CH = Math.max(1, Math.round(r.height));
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    cvs.width = CW * dpr; cvs.height = CH * dpr;
    cvs.style.width = CW + 'px'; cvs.style.height = CH + 'px';
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (game.onResize) game.onResize();
  }
  fit();
  window.addEventListener('resize', fit);
  const pos = e => { const r = cvs.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; };
  cvs.addEventListener('contextmenu', e => e.preventDefault());
  return { cvs, g, pos, fit };
}
function startLoop() {
  let last = performance.now();
  (function raf(now) {
    requestAnimationFrame(raf);
    const dt = Math.min(0.033, (now - (last || now)) / 1000); last = now;
    if (game.frame) game.frame(dt);
  })(performance.now());
}

/* ══ shell: top buttons ════════════════════════════════ */
function syncSnd() { $('#btnSnd').textContent = DATA.sound ? '🔊' : '🔇'; }
$('#btnSnd').addEventListener('click', () => { DATA.sound = !DATA.sound; save(); syncSnd(); AU.ensure(); snd('ui'); });
$('#btnNew').addEventListener('click', () => { AU.ensure(); snd('ui'); hideOverlay(); game.newGame(); });
$('#btnUndo').addEventListener('click', () => { AU.ensure(); if (game.undo) game.undo(); });
window.addEventListener('pointerdown', () => AU.ensure(), { once: true, capture: true });

/* ══ game ══════════════════════════════════════════════ */
/* Math Rush — true or false, fast. Three hearts. */
let mScore = 0, mLives = 3, mQ = null, mDeadline = 0, mLimit = 0, mOver = false, mRunning = false;
let stEl, barEl2, btnT, btnF, timerId = null;

function genQ() {
  const lvl = mScore;
  const op = ['+', '−', '×'][RI(0, 2)];
  let a, b, correct;
  if (op === '+') { a = RI(2, 9 + Math.min(40, lvl * 2)); b = RI(2, 9 + Math.min(40, lvl * 2)); correct = a + b; }
  else if (op === '−') { a = RI(5, 12 + Math.min(50, lvl * 2)); b = RI(2, a - 1); correct = a - b; }
  else { a = RI(2, 5 + Math.min(7, Math.floor(lvl / 3))); b = RI(2, 9); correct = a * b; }
  const truth = RF() < 0.5;
  let shown = correct;
  if (!truth) {
    const deltas = [1, -1, 2, -2, 10, -10];
    do { shown = correct + deltas[RI(0, deltas.length - 1)]; } while (shown === correct || shown < 0);
  }
  mQ = { a, b, op, shown, truth };
  mLimit = Math.max(1.5, 3.8 - mScore * 0.05);
  mDeadline = Date.now() + mLimit * 1000;
  stEl.textContent = a + ' ' + op + ' ' + b + ' = ' + shown;
  stEl.classList.remove('mqin'); void stEl.offsetWidth; stEl.classList.add('mqin');
}
function answer(v) {
  if (mOver || !mRunning || !ovl.hidden) return;
  if (v === mQ.truth) {
    mScore++;
    snd('ok', 1 + Math.min(0.9, mScore * 0.02));
    refresh();
    genQ();
  } else miss();
}
function miss() {
  mLives--;
  snd('bad');
  stEl.classList.add('mqbad');
  setTimeout(() => stEl.classList.remove('mqbad'), 350);
  refresh();
  if (mLives <= 0) {
    mOver = true; mRunning = false;
    const best = Math.max(DATA.best.score || 0, mScore);
    DATA.best.score = best; save();
    setTimeout(() => overOverlay('Out of hearts', [['SCORE', mScore], ['BEST', best]], { score: mScore, best }), 500);
  } else genQ();
}
function refresh() {
  setChips([['SCORE', mScore], ['LIVES', '♥'.repeat(mLives) || '—'], ['BEST', DATA.best.score || 0]]);
}
function build() {
  boardEl.innerHTML = '';
  const wrap = document.createElement('div'); wrap.className = 'wmr';
  const barBox = document.createElement('div'); barBox.className = 'oobarbox';
  barEl2 = document.createElement('div'); barEl2.className = 'oobar';
  barBox.appendChild(barEl2);
  stEl = document.createElement('div'); stEl.className = 'mq';
  const btns = document.createElement('div'); btns.className = 'mbtns';
  btnF = document.createElement('button'); btnF.className = 'mbtn no'; btnF.innerHTML = '✗<span>false</span>';
  btnT = document.createElement('button'); btnT.className = 'mbtn yes'; btnT.innerHTML = '✓<span>true</span>';
  btnF.addEventListener('pointerdown', () => answer(false));
  btnT.addEventListener('pointerdown', () => answer(true));
  btns.appendChild(btnF); btns.appendChild(btnT);
  wrap.appendChild(barBox); wrap.appendChild(stEl); wrap.appendChild(btns);
  boardEl.appendChild(wrap);
}

const game = {
  init() {
    build();
    window.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight' || e.key === 'j') answer(true);
      if (e.key === 'ArrowLeft' || e.key === 'f') answer(false);
    });
    timerId = setInterval(() => {
      if (!mRunning || mOver || !ovl.hidden) return;
      const left = mDeadline - Date.now();
      barEl2.style.width = clamp(left / (mLimit * 1000), 0, 1) * 100 + '%';
      barEl2.classList.toggle('oolow', left < mLimit * 300);
      if (left <= 0) miss();
    }, 50);
    this.newGame(true);
  },
  newGame(silent) {
    freshRng();
    mScore = 0; mLives = 3; mOver = false; mRunning = true;
    refresh();
    genQ();
    if (!silent) emit('newPuzzle', {});
  },
  debug() {
    const val = mQ.op === '+' ? mQ.a + mQ.b : mQ.op === '−' ? mQ.a - mQ.b : mQ.a * mQ.b;
    return { q: { ...mQ }, truthMatches: (mQ.shown === val) === mQ.truth, score: mScore, lives: mLives };
  }
};


/* ══ public API + boot ═════════════════════════════════ */
window.STWGame = {
  id: GAME_ID, version: '1.0.0', config: CFG,
  newGame: () => { hideOverlay(); game.newGame(); },
  on,
  getBest: () => JSON.parse(JSON.stringify(DATA.best)),
  mute: v => { DATA.sound = !v; save(); syncSnd(); },
  _debug: () => (game.debug ? game.debug() : null)
};
game.init();
syncSnd();
if (!DATA.seen) helpOverlay();
emit('ready', {});
})();
</script>
