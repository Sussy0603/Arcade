<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Connect Four</title>
<style>
:root{
  --bg1:#1B3B6F; --bg2:#0E2145;
  --board:#2E5CB8; --board-dark:#234A99;
  --hole:#0E2145;
  --p1:#FF4757; --p1b:#C0392B;
  --p2:#FFD93D; --p2b:#D4A017;
  --ink:#F5F7FF;
  --panel:#24457E;
  --good:#2ED573;
  --shadow:0 6px 0 rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:'Baloo 2','Comic Sans MS','Chalkboard SE','Segoe UI',system-ui,sans-serif;
  background:radial-gradient(circle at 50% 0%,var(--bg1),var(--bg2));
  color:var(--ink);min-height:100%;
  display:flex;flex-direction:column;align-items:center;
  padding:12px 10px 24px;user-select:none;-webkit-user-select:none;overflow-x:hidden;
}
header{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
h1{font-size:clamp(21px,5.5vw,29px);}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:700;color:var(--ink);
  background:var(--panel);border-radius:999px;padding:8px 14px;font-size:14px;
  box-shadow:var(--shadow);transition:transform .1s;}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35);}
.btn.small{padding:6px 10px;font-size:13px;}
.btn.primary{background:linear-gradient(145deg,#FF6B81,#E84118);color:#fff;}
.topbtns{display:flex;gap:6px;}
.controls{width:100%;max-width:520px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:8px;}
.seg{display:flex;background:rgba(255,255,255,.1);border-radius:999px;padding:4px;gap:4px;}
.seg button{border:none;cursor:pointer;font-family:inherit;font-weight:700;font-size:13px;color:var(--ink);
  background:transparent;border-radius:999px;padding:6px 12px;opacity:.6;}
.seg button.on{background:rgba(255,255,255,.18);opacity:1;box-shadow:0 3px 0 rgba(0,0,0,.25);}
#status{
  width:100%;max-width:520px;text-align:center;font-weight:800;font-size:clamp(16px,4.4vw,20px);
  min-height:34px;margin:4px 0 8px;display:flex;align-items:center;justify-content:center;gap:8px;
}
.chip{display:inline-block;width:20px;height:20px;border-radius:50%;vertical-align:-4px;}
.chip.c1{background:radial-gradient(circle at 35% 30%,#ff8a95,var(--p1) 60%,var(--p1b));}
.chip.c2{background:radial-gradient(circle at 35% 30%,#ffe98a,var(--p2) 60%,var(--p2b));}
#boardWrap{position:relative;width:min(94vw,520px);}
#cols{position:absolute;inset:0;display:grid;grid-template-columns:repeat(7,1fr);z-index:5;}
#cols button{background:transparent;border:none;cursor:pointer;}
#cols button:hover{background:rgba(255,255,255,.06);}
svg{display:block;width:100%;height:auto;}
.disc{transition:transform .06s;}
.winline{stroke:#fff;stroke-width:6;stroke-linecap:round;opacity:.9;filter:drop-shadow(0 0 6px #fff);}
.hud{width:100%;max-width:520px;display:flex;justify-content:space-between;margin-top:10px;font-weight:700;font-size:14px;}
.hud .stat{background:var(--panel);border-radius:14px;padding:7px 13px;box-shadow:var(--shadow);}
footer{margin-top:14px;font-size:12px;opacity:.4;font-weight:600;}
#thinking{display:inline-block;animation:think 1s infinite;}
@keyframes think{0%,100%{opacity:.3;}50%{opacity:1;}}
@media (prefers-reduced-motion:reduce){#thinking{animation:none;}}
</style>
</head>
<body>
<header>
  <h1>🔴🟡 <span data-i18n="title">Connect Four</span></h1>
  <div class="topbtns">
    <button class="btn small" id="langBtn">FR</button>
    <button class="btn small" id="soundBtn">🔊</button>
  </div>
</header>

<div class="controls">
  <div class="seg" id="modeSeg">
    <button data-mode="1p" class="on">🤖 <span data-i18n="vsBot">vs Bot</span></button>
    <button data-mode="2p">👥 <span data-i18n="twoP">2 Players</span></button>
  </div>
  <div class="seg" id="diffSeg">
    <button data-diff="easy" class="on" data-i18n="easy">Easy</button>
    <button data-diff="medium" data-i18n="medium">Medium</button>
    <button data-diff="hard" data-i18n="hard">Hard</button>
  </div>
  <button class="btn primary" id="newBtn" data-i18n="new">New Game</button>
</div>

<div id="status"></div>

<div id="boardWrap">
  <svg id="board" viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg"></svg>
  <div id="cols"></div>
</div>

<div class="hud">
  <div class="stat"><span class="chip c1"></span> <span id="score1">0</span></div>
  <div class="stat" data-i18n="draws">Draws: <span id="scoreD">0</span></div>
  <div class="stat"><span class="chip c2"></span> <span id="score2">0</span></div>
</div>

<footer>STeamWorkS · Connect Four</footer>

<script>
"use strict";
const STR={
  en:{title:"Connect Four",vsBot:"vs Bot",twoP:"2 Players",easy:"Easy",medium:"Medium",hard:"Hard",
      new:"New Game",draws:"Draws: ",
      turnYou:"Your turn",turnBot:"Bot is thinking",turnP1:"Red's turn",turnP2:"Yellow's turn",
      winYou:"You win! 🎉",winBot:"Bot wins! 🤖",winP1:"Red wins! 🎉",winP2:"Yellow wins! 🎉",draw:"It's a draw!"},
  fr:{title:"Puissance 4",vsBot:"vs Robot",twoP:"2 Joueurs",easy:"Facile",medium:"Moyen",hard:"Difficile",
      new:"Nouvelle partie",draws:"Nulles : ",
      turnYou:"À toi de jouer",turnBot:"Le robot réfléchit",turnP1:"Aux rouges",turnP2:"Aux jaunes",
      winYou:"Tu gagnes ! 🎉",winBot:"Le robot gagne ! 🤖",winP1:"Les rouges gagnent ! 🎉",winP2:"Les jaunes gagnent ! 🎉",draw:"Partie nulle !"}
};
const ROWS=6, COLS=7;
const SKEY="stws_connect4_v1";
const ORDER=[3,2,4,1,5,0,6];

let save=load();
let lang=save.lang||"en";
let soundOn=save.sound!==false;
let mode=save.mode||"1p";
let diff=save.diff||"easy";
let scores=save.scores||{p1:0,p2:0,d:0};

let grid, turn, over, winCells, humanFirst=true, botBusy=false;

function load(){try{return JSON.parse(localStorage.getItem(SKEY))||{};}catch(e){return {};}}
function persist(){save.lang=lang;save.sound=soundOn;save.mode=mode;save.diff=diff;save.scores=scores;
  try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}

let AC=null;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,t,dur,type,vol){
  if(!soundOn)return;const c=ac();if(!c)return;
  const o=c.createOscillator(),g=c.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,c.currentTime+t);
  g.gain.setValueAtTime(0,c.currentTime+t);
  g.gain.linearRampToValueAtTime(vol||.14,c.currentTime+t+.01);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+t+dur);
  o.connect(g);g.connect(c.destination);
  o.start(c.currentTime+t);o.stop(c.currentTime+t+dur+.05);
}
const sDrop=()=>tone(240,0,.13,"triangle",.16);
const sWin=()=>{[523,659,784,1047].forEach((f,i)=>tone(f,i*.11,.16,"triangle",.14));};
const sLose=()=>{[392,330,262].forEach((f,i)=>tone(f,i*.14,.2,"sawtooth",.07));};

/* ============ core game logic (pure, testable) ============ */
function emptyGrid(){return Array.from({length:ROWS},()=>Array(COLS).fill(0));}
function landingRow(g,c){for(let r=ROWS-1;r>=0;r--)if(g[r][c]===0)return r;return -1;}
function legalMoves(g){const m=[];for(const c of ORDER)if(g[0][c]===0)m.push(c);return m;}
function place(g,c,p){const r=landingRow(g,c);if(r<0)return -1;g[r][c]=p;return r;}
function unplace(g,c){for(let r=0;r<ROWS;r++)if(g[r][c]!==0){g[r][c]=0;return;}}
function checkWin(g,p){
  // returns winning 4 cells or null
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    if(g[r][c]!==p)continue;
    const dirs=[[0,1],[1,0],[1,1],[1,-1]];
    for(const[dr,dc]of dirs){
      let cells=[[r,c]];
      for(let k=1;k<4;k++){
        const rr=r+dr*k,cc=c+dc*k;
        if(rr<0||rr>=ROWS||cc<0||cc>=COLS||g[rr][cc]!==p)break;
        cells.push([rr,cc]);
      }
      if(cells.length===4)return cells;
    }
  }
  return null;
}
function isFull(g){return g[0].every(v=>v!==0);}

/* evaluation: sliding windows of 4 */
function evalWindow(w,p){
  const o=3-p;
  const cp=w.filter(x=>x===p).length, co=w.filter(x=>x===o).length, ce=4-cp-co;
  if(cp===4)return 100000;
  if(co===4)return -100000;
  if(cp===3&&ce===1)return 120;
  if(cp===2&&ce===2)return 12;
  if(co===3&&ce===1)return -140;
  if(co===2&&ce===2)return -10;
  return 0;
}
function evaluate(g,p){
  let s=0;
  // center preference
  for(let r=0;r<ROWS;r++){if(g[r][3]===p)s+=6;else if(g[r][3]===3-p)s-=6;}
  // horizontals
  for(let r=0;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)s+=evalWindow([g[r][c],g[r][c+1],g[r][c+2],g[r][c+3]],p);
  // verticals
  for(let c=0;c<COLS;c++)for(let r=0;r<=ROWS-4;r++)s+=evalWindow([g[r][c],g[r+1][c],g[r+2][c],g[r+3][c]],p);
  // diagonals
  for(let r=0;r<=ROWS-4;r++)for(let c=0;c<=COLS-4;c++)s+=evalWindow([g[r][c],g[r+1][c+1],g[r+2][c+2],g[r+3][c+3]],p);
  for(let r=3;r<ROWS;r++)for(let c=0;c<=COLS-4;c++)s+=evalWindow([g[r][c],g[r-1][c+1],g[r-2][c+2],g[r-3][c+3]],p);
  return s;
}
function minimax(g,depth,alpha,beta,maximizing,p){
  const o=3-p;
  if(checkWin(g,p))return {score:1000000+depth};
  if(checkWin(g,o))return {score:-1000000-depth};
  if(isFull(g))return {score:0};
  if(depth===0)return {score:evaluate(g,p)};
  const moves=legalMoves(g);
  let bestCol=moves[0];
  if(maximizing){
    let best=-Infinity;
    for(const c of moves){
      place(g,c,p);
      const {score}=minimax(g,depth-1,alpha,beta,false,p);
      unplace(g,c);
      if(score>best){best=score;bestCol=c;}
      alpha=Math.max(alpha,best);
      if(alpha>=beta)break;
    }
    return {score:best,col:bestCol};
  }else{
    let best=Infinity;
    for(const c of moves){
      place(g,c,o);
      const {score}=minimax(g,depth-1,alpha,beta,true,p);
      unplace(g,c);
      if(score<best){best=score;bestCol=c;}
      beta=Math.min(beta,best);
      if(alpha>=beta)break;
    }
    return {score:best,col:bestCol};
  }
}
function botMove(g,difficulty){
  const p=2;
  // always take an immediate win, always block an immediate loss (all levels)
  for(const c of legalMoves(g)){place(g,c,p);const w=!!checkWin(g,p);unplace(g,c);if(w)return c;}
  for(const c of legalMoves(g)){place(g,c,1);const w=!!checkWin(g,1);unplace(g,c);if(w)return c;}
  if(difficulty==="easy"){
    // shallow with 35% randomness
    if(Math.random()<.35){const m=legalMoves(g);return m[Math.floor(Math.random()*m.length)];}
    return minimax(g,2,-Infinity,Infinity,true,p).col;
  }
  if(difficulty==="medium")return minimax(g,4,-Infinity,Infinity,true,p).col;
  return minimax(g,7,-Infinity,Infinity,true,p).col;
}

/* ============ rendering ============ */
const CELL=100,R=38;
function renderBoard(){
  const svg=document.getElementById("board");
  let s=`<defs>
    <radialGradient id="g1" cx="35%" cy="30%"><stop offset="0%" stop-color="#ff8a95"/><stop offset="60%" stop-color="#FF4757"/><stop offset="100%" stop-color="#C0392B"/></radialGradient>
    <radialGradient id="g2" cx="35%" cy="30%"><stop offset="0%" stop-color="#ffe98a"/><stop offset="60%" stop-color="#FFD93D"/><stop offset="100%" stop-color="#D4A017"/></radialGradient>
  </defs>`;
  s+=`<rect x="0" y="0" width="700" height="600" rx="26" fill="var(--board)"/>`;
  s+=`<rect x="0" y="14" width="700" height="586" rx="26" fill="var(--board-dark)" opacity=".35"/>`;
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const cx=c*CELL+50, cy=r*CELL+50;
    s+=`<circle cx="${cx}" cy="${cy}" r="${R+4}" fill="rgba(0,0,0,.25)"/>`;
    s+=`<circle id="cell-${r}-${c}" class="disc" cx="${cx}" cy="${cy}" r="${R}" fill="var(--hole)"/>`;
  }
  svg.innerHTML=s;
  const cols=document.getElementById("cols");
  cols.innerHTML="";
  for(let c=0;c<COLS;c++){
    const b=document.createElement("button");
    b.setAttribute("aria-label","column "+(c+1));
    b.addEventListener("click",()=>humanPlay(c));
    cols.appendChild(b);
  }
}
function paint(){
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
    const el=document.getElementById(`cell-${r}-${c}`);
    el.setAttribute("fill",grid[r][c]===1?"url(#g1)":grid[r][c]===2?"url(#g2)":"var(--hole)");
  }
  const old=document.getElementById("winline");if(old)old.remove();
  if(winCells){
    const [a,,,d]=[winCells[0],0,0,winCells[3]];
    const l=document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("id","winline");l.setAttribute("class","winline");
    l.setAttribute("x1",a[1]*CELL+50);l.setAttribute("y1",a[0]*CELL+50);
    l.setAttribute("x2",d[1]*CELL+50);l.setAttribute("y2",d[0]*CELL+50);
    document.getElementById("board").appendChild(l);
  }
}
function setStatus(){
  const el=document.getElementById("status"),S=STR[lang];
  if(over){
    if(winCells){
      const w=grid[winCells[0][0]][winCells[0][1]];
      if(mode==="1p")el.innerHTML=w===1?S.winYou:S.winBot;
      else el.innerHTML=w===1?S.winP1:S.winP2;
    }else el.textContent=S.draw;
    return;
  }
  if(mode==="1p"){
    el.innerHTML=turn===1?`<span class="chip c1"></span> ${S.turnYou}`:`<span class="chip c2"></span> ${S.turnBot} <span id="thinking">…</span>`;
  }else{
    el.innerHTML=turn===1?`<span class="chip c1"></span> ${S.turnP1}`:`<span class="chip c2"></span> ${S.turnP2}`;
  }
}

/* ============ flow ============ */
function newGame(){
  grid=emptyGrid();turn=1;over=false;winCells=null;botBusy=false;
  if(mode==="1p"){
    turn=humanFirst?1:2;
    humanFirst=!humanFirst;
  }
  paint();setStatus();
  if(mode==="1p"&&turn===2)queueBot();
}
function humanPlay(c){
  if(over||botBusy)return;
  if(mode==="1p"&&turn!==1)return;
  doMove(c);
}
function doMove(c){
  const r=place(grid,c,turn);
  if(r<0)return;
  sDrop();
  const w=checkWin(grid,turn);
  if(w){winCells=w;over=true;endGame();}
  else if(isFull(grid)){over=true;scores.d++;persist();endGame();}
  else{turn=3-turn;if(mode==="1p"&&turn===2)queueBot();}
  paint();setStatus();updateHud();
}
function endGame(){
  if(winCells){
    const w=grid[winCells[0][0]][winCells[0][1]];
    if(w===1)scores.p1++;else scores.p2++;
    persist();
    if(mode==="1p")(w===1?sWin:sLose)();else sWin();
  }
}
function queueBot(){
  botBusy=true;setStatus();
  setTimeout(()=>{
    const c=botMove(grid,diff);
    botBusy=false;
    doMove(c);
  },420);
}
function updateHud(){
  document.getElementById("score1").textContent=scores.p1;
  document.getElementById("score2").textContent=scores.p2;
  document.getElementById("scoreD").textContent=scores.d;
}

/* ============ ui ============ */
document.getElementById("newBtn").addEventListener("click",newGame);
document.getElementById("modeSeg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#modeSeg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");mode=b.dataset.mode;persist();
  document.getElementById("diffSeg").style.visibility=mode==="1p"?"visible":"hidden";
  newGame();
});
document.getElementById("diffSeg").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  document.querySelectorAll("#diffSeg button").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");diff=b.dataset.diff;persist();newGame();
});
document.getElementById("langBtn").addEventListener("click",()=>{lang=lang==="en"?"fr":"en";persist();applyLang();setStatus();});
document.getElementById("soundBtn").addEventListener("click",e=>{
  soundOn=!soundOn;persist();e.currentTarget.textContent=soundOn?"🔊":"🔇";});
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.dataset.i18n;
    if(k==="draws"){el.childNodes[0].textContent=STR[lang][k];return;}
    if(STR[lang][k])el.textContent=STR[lang][k];
  });
  document.getElementById("langBtn").textContent=lang==="en"?"FR":"EN";
}
document.querySelectorAll("#modeSeg button").forEach(b=>b.classList.toggle("on",b.dataset.mode===mode));
document.querySelectorAll("#diffSeg button").forEach(b=>b.classList.toggle("on",b.dataset.diff===diff));
document.getElementById("diffSeg").style.visibility=mode==="1p"?"visible":"hidden";
document.getElementById("soundBtn").textContent=soundOn?"🔊":"🔇";
renderBoard();applyLang();updateHud();newGame();

window.__test={emptyGrid,place,unplace,landingRow,legalMoves,checkWin,isFull,evaluate,minimax,botMove,
  getState:()=>({grid:grid.map(r=>r.slice()),turn,over}),doMove,newGame,
  setGrid:(g)=>{grid=g;},setTurn:(t)=>{turn=t;},setMode:(m)=>{mode=m;}};
</script>
</body>
</html>
