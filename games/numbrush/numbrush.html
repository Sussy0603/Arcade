<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f4efe6">
<title>Numbrush — Colour by Numbers</title>
<style>
:root{
  --bg1:#f6efe2; --bg2:#e9dcc6; --surface:#fffdf8; --surface2:#f3ecdd; --line:#ddd0b8;
  --ink:#3b3229; --ink2:#8a7c68; --accent:#c85a3c; --accent2:#3f7f7a; --good:#4e9a63;
  --r:16px; --pad:14px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","Nunito","Avenir Next",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  font-family:var(--font); color:var(--ink); overscroll-behavior:none;
  background:var(--bg1);
  -webkit-user-select:none;user-select:none; touch-action:manipulation;
}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
#app{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;
  max-width:600px;margin:0 auto;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.screen{display:none;flex:1;min-height:0;flex-direction:column}
.screen.on{display:flex}

/* ---- bars ---- */
.bar{display:flex;align-items:center;gap:10px;padding:10px 12px;flex:0 0 auto}
.bar h1{font-size:19px;margin:0;letter-spacing:.13em;text-transform:uppercase;font-weight:800}
.bar .grow{flex:1;min-width:0}
.ico{width:40px;height:40px;flex:0 0 auto;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:12px;font-size:17px;line-height:1;display:grid;place-items:center;cursor:pointer}
.ico:active{transform:scale(.94)}
.ico.on{background:var(--accent);border-color:var(--accent);color:#fff}

/* ---- wordmark ---- */
.brand{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 0 10px}
.brand .w{display:flex;align-items:baseline;gap:2px}
.brand .w span{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1}
.brand .w i{width:13px;height:13px;display:inline-block;margin-left:5px;background:var(--accent);
  border-radius:62% 38% 45% 55%/55% 45% 60% 40%}
.brand small{color:var(--ink2);letter-spacing:.22em;text-transform:uppercase;font-size:10px}

.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 12px 24px}

/* ---- category / picture cards ---- */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;
  text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;color:var(--ink);font-family:inherit}
.cat:active{transform:scale(.98)}
.cat .em{font-size:24px}
.cat b{font-size:15px}
.cat small{color:var(--ink2);font-size:11px}

.pics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pic{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  cursor:pointer;display:flex;flex-direction:column;padding:0;font-family:inherit;color:var(--ink)}
.pic:active{transform:scale(.98)}
.pic canvas{width:100%;aspect-ratio:1;display:block;background:var(--surface2)}
.pic .meta{padding:8px 10px 10px;text-align:left}
.pic b{font-size:13px;display:block}
.pic .dots{display:flex;gap:4px;margin-top:6px}
.pic .dots i{width:100%;height:4px;border-radius:2px;background:var(--line)}
.pic .dots i.part{background:var(--accent2)}
.pic .dots i.done{background:var(--good)}

/* ---- difficulty sheet ---- */
.sheet{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;
  background:rgba(30,24,18,.42);backdrop-filter:blur(2px)}
.sheet.on{display:flex}
.sheet .card{background:var(--surface);width:100%;max-width:600px;border-radius:22px 22px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(18px);opacity:.4}}
.sheet h3{margin:0 0 2px;font-size:18px}
.sheet p{margin:0 0 14px;color:var(--ink2);font-size:12px}
.dlist{display:flex;flex-direction:column;gap:8px}
.dbtn{display:flex;align-items:center;gap:12px;background:var(--surface2);border:1px solid var(--line);
  border-radius:14px;padding:12px 14px;cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
.dbtn:active{transform:scale(.985)}
.dbtn .chip{width:34px;height:34px;border-radius:60% 40% 52% 48%/48% 56% 44% 52%;flex:0 0 auto;
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:13px}
.dbtn .t{flex:1}
.dbtn b{display:block;font-size:14px}
.dbtn small{color:var(--ink2);font-size:11px}
.dbtn .st{font-size:11px;color:var(--ink2);text-align:right}
.dbtn .st.done{color:var(--good);font-weight:700}

/* ---- play ---- */
.ptitle{flex:1;min-width:0;text-align:center;line-height:1.15}
.ptitle b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle span{font-size:10px;color:var(--ink2);letter-spacing:.14em;text-transform:uppercase}
.stage{flex:1;min-height:0;position:relative;margin:0 8px;border-radius:var(--r);overflow:hidden;
  background:var(--surface);border:1px solid var(--line);touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.zoomb{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.zoomb button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);
  background:rgba(255,255,255,.85);color:var(--ink);font-size:16px;cursor:pointer;font-family:inherit}
.progwrap{display:flex;align-items:center;gap:10px;padding:8px 14px 4px}
.prog{flex:1;height:7px;border-radius:4px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s ease}
.progwrap span{font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;min-width:64px;text-align:right}

.palette{display:flex;gap:8px;overflow-x:auto;padding:8px 12px;scrollbar-width:none;flex:0 0 auto}
.palette::-webkit-scrollbar{display:none}
.sw{flex:0 0 auto;width:48px;height:52px;border:none;background:none;padding:0;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;font-family:inherit;position:relative}
.sw .blob{width:40px;height:40px;border-radius:58% 42% 50% 50%/50% 55% 45% 50%;
  display:grid;place-items:center;font-weight:800;font-size:15px;border:2px solid transparent;
  transition:transform .12s ease}
.sw.sel .blob{transform:scale(1.14);border-color:var(--ink)}
.sw small{font-size:9.5px;color:var(--ink2);font-variant-numeric:tabular-nums}
.sw.done{opacity:.32}
.sw.done .blob::after{content:"\2713";position:absolute;font-size:16px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tools{display:flex;gap:8px;padding:2px 12px 12px}
.tools button{flex:1;padding:11px 6px;border-radius:12px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.tools button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tools button:active{transform:scale(.97)}

/* ---- misc ---- */
.load{position:absolute;inset:0;display:grid;place-items:center;background:var(--surface);z-index:5;
  font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.load.off{display:none}
.hint{position:absolute;font-weight:800;font-size:15px;pointer-events:none;z-index:4;
  animation:pop .7s ease forwards;text-shadow:0 1px 3px rgba(0,0,0,.35)}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.6);opacity:1}
100%{transform:translate(-50%,-160%) scale(1.1);opacity:0}}
.empty{text-align:center;color:var(--ink2);font-size:13px;padding:40px 20px;line-height:1.6}
.gal{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gal .g{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  cursor:pointer;padding:0;font-family:inherit;color:var(--ink)}
.gal canvas{width:100%;aspect-ratio:1;display:block}
.gal .meta{padding:7px 9px 9px;text-align:left}
.gal b{font-size:12px;display:block}
.gal small{font-size:10px;color:var(--ink2);text-transform:uppercase;letter-spacing:.1em}

.themes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.th{border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;background:var(--surface);
  display:flex;flex-direction:column;gap:7px;font-family:inherit;color:var(--ink);text-align:left}
.th.sel{outline:2px solid var(--accent);outline-offset:1px}
.th .sws{display:flex;gap:4px}
.th .sws i{width:100%;height:18px;border-radius:6px}
.th b{font-size:12px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);
  border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font-size:13px}
.sec{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin:18px 0 8px}
.toggle{width:48px;height:28px;border-radius:16px;background:var(--line);position:relative;
  border:none;cursor:pointer;flex:0 0 auto;transition:background .18s}
.toggle i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;
  transition:transform .18s}
.toggle.on{background:var(--good)}
.toggle.on i{transform:translateX(20px)}
.btn{display:block;width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:#b3402c}
.btn+.btn{margin-top:8px}

/* ---- finish modal ---- */
.modal{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;padding:20px;
  background:rgba(30,24,18,.5)}
.modal.on{display:flex}
.modal .card{background:var(--surface);border-radius:22px;padding:20px;width:100%;max-width:360px;text-align:center;
  animation:up .25s ease}
.modal canvas{width:180px;height:180px;border-radius:14px;border:1px solid var(--line);margin:6px auto 12px;display:block}
.modal h3{margin:0;font-size:20px}
.modal p{margin:4px 0 12px;color:var(--ink2);font-size:12px}
</style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="app">

  <!-- HOME -->
  <section class="screen on" id="scr-home">
    <div class="brand"><div class="w"><span>Numbrush</span><i></i></div><small>Colour by numbers</small></div>
    <div class="scroll">
      <div class="sec">Pick a set</div>
      <div class="cats" id="catList"></div>
      <div class="sec">More</div>
      <button class="btn" id="goGallery">Gallery</button>
      <button class="btn" id="goSettings">Themes &amp; sound</button>
    </div>
  </section>

  <!-- CATEGORY -->
  <section class="screen" id="scr-cat">
    <div class="bar"><button class="ico" data-back="home">&#8249;</button><h1 class="grow" id="catTitle"></h1></div>
    <div class="scroll"><div class="pics" id="picList"></div></div>
  </section>

  <!-- PLAY -->
  <section class="screen" id="scr-play">
    <div class="bar">
      <button class="ico" id="playBack">&#8249;</button>
      <div class="ptitle"><b id="playName"></b><span id="playSub"></span></div>
      <button class="ico" id="btnPeek">&#9673;</button>
    </div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="zoomb"><button id="zIn">+</button><button id="zOut">&minus;</button></div>
      <div class="load off" id="loader">Preparing canvas</div>
    </div>
    <div class="progwrap"><div class="prog"><i id="progFill"></i></div><span id="progTxt"></span></div>
    <div class="palette" id="palette"></div>
    <div class="tools">
      <button id="btnHint">Find one</button>
      <button id="btnPan">Move</button>
      <button id="btnFit">Fit</button>
    </div>
  </section>

  <!-- GALLERY -->
  <section class="screen" id="scr-gallery">
    <div class="bar"><button class="ico" data-back="home">&#8249;</button><h1 class="grow">Gallery</h1></div>
    <div class="scroll"><div class="gal" id="galList"></div><div class="empty" id="galEmpty">
      Finished pictures land here.<br>Paint one to start the collection.</div></div>
  </section>

  <!-- SETTINGS -->
  <section class="screen" id="scr-settings">
    <div class="bar"><button class="ico" data-back="home">&#8249;</button><h1 class="grow">Themes &amp; sound</h1></div>
    <div class="scroll">
      <div class="sec">Sound</div>
      <div class="row"><span>Sound effects</span><button class="toggle" id="tgSfx"><i></i></button></div>
      <div class="row"><span>Music</span><button class="toggle" id="tgMusic"><i></i></button></div>
      <div class="sec">Theme</div>
      <div class="themes" id="themeList"></div>
      <div class="sec">Data</div>
      <div class="row" id="statRow"><span>Progress</span><b id="statTxt"></b></div>
      <button class="btn danger" id="btnReset">Erase all progress</button>
    </div>
  </section>
</div>

<!-- difficulty sheet -->
<div class="sheet" id="sheet"><div class="card">
  <h3 id="sheetName"></h3><p id="sheetSub">Choose how detailed you want it.</p>
  <div class="dlist" id="dlist"></div>
</div></div>

<!-- finish modal -->
<div class="modal" id="finish"><div class="card">
  <h3>Finished</h3><p id="finTxt"></p>
  <canvas id="finCv" width="360" height="360"></canvas>
  <button class="btn primary" id="finNext">Paint the next one</button>
  <button class="btn" id="finSave">Save picture</button>
  <button class="btn" id="finClose">Back to the set</button>
</div></div>
<script>
// ==ENGINE_START==
var ENGINE = (function () {
  'use strict';

  /* ---------------- colour ---------------- */
  function hex2rgb(h) {
    h = h.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgb2hex(r, g, b) {
    return '#' + ((1 << 24) + (Math.round(r) << 16) + (Math.round(g) << 8) + Math.round(b)).toString(16).slice(1);
  }
  function luma(c) { return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2]; }
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function shift(c, d) {
    // d>0 -> toward white, d<0 -> toward black
    var t = clamp(Math.abs(d), 0, 1), o = d > 0 ? 255 : 0;
    return [c[0] + (o - c[0]) * t, c[1] + (o - c[1]) * t, c[2] + (o - c[2]) * t];
  }

  /* ---------------- geometry ---------------- */
  function circlePts(cx, cy, r, n) {
    var p = [];
    for (var i = 0; i < n; i++) { var a = i / n * Math.PI * 2; p.push(cx + Math.cos(a) * r, cy + Math.sin(a) * r); }
    return p;
  }
  function ellipsePts(cx, cy, rx, ry, rot, n) {
    var p = [], co = Math.cos(rot), si = Math.sin(rot);
    for (var i = 0; i < n; i++) {
      var a = i / n * Math.PI * 2, x = Math.cos(a) * rx, y = Math.sin(a) * ry;
      p.push(cx + x * co - y * si, cy + x * si + y * co);
    }
    return p;
  }
  function crSpline(pts, closed, seg) {
    var n = pts.length / 2, out = [];
    if (n < 3) return pts.slice();
    var last = closed ? n : n - 1;
    for (var i = 0; i < last; i++) {
      var i0, i1 = i, i2, i3;
      if (closed) { i0 = (i - 1 + n) % n; i2 = (i + 1) % n; i3 = (i + 2) % n; }
      else { i0 = Math.max(0, i - 1); i2 = Math.min(n - 1, i + 1); i3 = Math.min(n - 1, i + 2); }
      var x0 = pts[i0 * 2], y0 = pts[i0 * 2 + 1], x1 = pts[i1 * 2], y1 = pts[i1 * 2 + 1],
        x2 = pts[i2 * 2], y2 = pts[i2 * 2 + 1], x3 = pts[i3 * 2], y3 = pts[i3 * 2 + 1];
      for (var s = 0; s < seg; s++) {
        var t = s / seg, t2 = t * t, t3 = t2 * t;
        out.push(
          0.5 * (2 * x1 + (-x0 + x2) * t + (2 * x0 - 5 * x1 + 4 * x2 - x3) * t2 + (-x0 + 3 * x1 - 3 * x2 + x3) * t3),
          0.5 * (2 * y1 + (-y0 + y2) * t + (2 * y0 - 5 * y1 + 4 * y2 - y3) * t2 + (-y0 + 3 * y1 - 3 * y2 + y3) * t3)
        );
      }
    }
    if (!closed) out.push(pts[(n - 1) * 2], pts[(n - 1) * 2 + 1]);
    return out;
  }
  function strokeContours(path, w) {
    var out = [], h = w / 2;
    for (var i = 0; i + 3 < path.length; i += 2) {
      var x1 = path[i], y1 = path[i + 1], x2 = path[i + 2], y2 = path[i + 3];
      var dx = x2 - x1, dy = y2 - y1, L = Math.sqrt(dx * dx + dy * dy);
      if (L < 1e-6) continue;
      var nx = -dy / L * h, ny = dx / L * h;
      out.push([x1 + nx, y1 + ny, x2 + nx, y2 + ny, x2 - nx, y2 - ny, x1 - nx, y1 - ny]);
    }
    for (var j = 0; j < path.length; j += 2) out.push(circlePts(path[j], path[j + 1], h, 12));
    return out;
  }
  // shape -> array of contours (flat [x,y,...]); union semantics
  function shapeContours(a) {
    switch (a[0]) {
      case 'R': return [[a[2], a[3], a[2] + a[4], a[3], a[2] + a[4], a[3] + a[5], a[2], a[3] + a[5]]];
      case 'C': return [circlePts(a[2], a[3], a[4], 56)];
      case 'E': return [ellipsePts(a[2], a[3], a[4], a[5], (a[6] || 0) * Math.PI / 180, 64)];
      case 'P': return [a.slice(2)];
      case 'B': return [crSpline(a.slice(2), true, 12)];
      case 'L': return strokeContours(crSpline(a.slice(3), false, 10), a[2]);
    }
    return [];
  }

  /* ---------------- rasterizer (even-odd scanline) ---------------- */
  function fillContour(map, res, p, id) {
    var n = p.length / 2;
    if (n < 3) return;
    var ymin = 1e9, ymax = -1e9, i;
    for (i = 0; i < n; i++) { var yy = p[i * 2 + 1]; if (yy < ymin) ymin = yy; if (yy > ymax) ymax = yy; }
    var y0 = Math.max(0, Math.ceil(ymin - 0.5)), y1 = Math.min(res - 1, Math.floor(ymax - 0.5));
    var xs = [];
    for (var y = y0; y <= y1; y++) {
      var sy = y + 0.5; xs.length = 0;
      for (i = 0; i < n; i++) {
        var j = (i + 1) % n, ay = p[i * 2 + 1], by = p[j * 2 + 1];
        if ((ay <= sy && by > sy) || (by <= sy && ay > sy)) {
          var t = (sy - ay) / (by - ay);
          xs.push(p[i * 2] + t * (p[j * 2] - p[i * 2]));
        }
      }
      if (xs.length < 2) continue;
      xs.sort(function (a, b) { return a - b; });
      var row = y * res;
      for (var k = 0; k + 1 < xs.length; k += 2) {
        var xa = Math.max(0, Math.ceil(xs[k] - 0.5)), xb = Math.min(res - 1, Math.floor(xs[k + 1] - 0.5));
        for (var x = xa; x <= xb; x++) map[row + x] = id;
      }
    }
  }
  function rasterize(pic, res) {
    var S = res / 100, map = new Int16Array(res * res), cols = [];
    map.fill(-1);
    for (var i = 0; i < pic.s.length; i++) {
      var sh = pic.s[i];
      cols.push(hex2rgb(sh[1]));
      var cs = shapeContours(sh);
      for (var c = 0; c < cs.length; c++) {
        var p = cs[c], q = new Array(p.length);
        for (var k = 0; k < p.length; k++) q[k] = p[k] * S;
        fillContour(map, res, q, i);
      }
    }
    return { map: map, cols: cols, res: res };
  }

  /* ---------------- distance to nearest different shape ---------------- */
  function edgeDT(map, res) {
    var d = new Float32Array(res * res), INF = 1e9, x, y, i;
    for (y = 0; y < res; y++) for (x = 0; x < res; x++) {
      i = y * res + x;
      var v = map[i], b = (x === 0 || y === 0 || x === res - 1 || y === res - 1);
      if (!b) b = (map[i - 1] !== v || map[i + 1] !== v || map[i - res] !== v || map[i + res] !== v);
      d[i] = b ? 0 : INF;
    }
    chamfer(d, res);
    return d;
  }
  function chamfer(d, res) {
    var A = 1, B = 1.41421356, x, y, i, v;
    for (y = 0; y < res; y++) for (x = 0; x < res; x++) {
      i = y * res + x; v = d[i];
      if (y > 0) {
        if (d[i - res] + A < v) v = d[i - res] + A;
        if (x > 0 && d[i - res - 1] + B < v) v = d[i - res - 1] + B;
        if (x < res - 1 && d[i - res + 1] + B < v) v = d[i - res + 1] + B;
      }
      if (x > 0 && d[i - 1] + A < v) v = d[i - 1] + A;
      d[i] = v;
    }
    for (y = res - 1; y >= 0; y--) for (x = res - 1; x >= 0; x--) {

      r: 2 + Math.random() * 4, c: t[(Math.random() * t.length) | 0], life: 1
    });
  }

  /* ---- draw loop ---- */
  function loop(ts) {
    raf = requestAnimationFrame(loop);
    if (!P || !P.ready) return;
    var dt = Math.min(50, ts - lastFrame || 16); lastFrame = ts;
    var s = V.size * V.zoom;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cw, ch);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(paintCv, V.panX, V.panY, s, s);

    if (P.done && P.fade > 0) P.fade = Math.max(0, P.fade - dt / 900);
    if (P.fade > 0) {
      ctx.globalAlpha = P.fade;
      ctx.drawImage(lineCv, V.panX, V.panY, s, s);
      ctx.globalAlpha = 1;
      drawNumbers(s);
    }
    if (pulse) {
      var e = (performance.now() - pulse.t) / 420;
      if (e >= 1) pulse = null; else {
        var k = s / P.pz.res;
        ctx.globalAlpha = (1 - e) * 0.7;
        ctx.strokeStyle = theme().accent; ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(pulse.x * k + V.panX, pulse.y * k + V.panY, (pulse.r * k + 4) * (0.6 + e * 1.3), 0, 6.284);
        ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
    if (hintR !== null) {
      var hr = P.pz.regions[hintR], hk = s / P.pz.res;
      var he = ((performance.now() - hintT) / 1400);
      if (he >= 1) hintR = null;
      else {
        ctx.globalAlpha = 0.85 * (1 - he);
        ctx.strokeStyle = theme().accent; ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(hr.x * hk + V.panX, hr.y * hk + V.panY, (hr.r * hk + 8) * (1 + Math.sin(he * 12) * 0.08), 0, 6.284);
        ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
    if (sparks.length) {
      for (var i = sparks.length - 1; i >= 0; i--) {
        var sp = sparks[i];
        sp.x += sp.vx; sp.y += sp.vy; sp.vy += 0.22; sp.life -= 0.012;
        if (sp.life <= 0) { sparks.splice(i, 1); continue; }
        ctx.globalAlpha = Math.max(0, sp.life);
        ctx.fillStyle = sp.c;
        ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, 6.284); ctx.fill();
      }
      ctx.globalAlpha = 1;
    }
  }
  function drawNumbers(s) {
    var pz = P.pz, k = s / pz.res, R = pz.regions;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var dim = 'rgba(74,64,54,.58)';
    var hot = theme().dark ? '#1d1a2e' : theme().accent;
    for (var i = 0; i < R.length; i++) {
      var r = R[i];
      if (P.filled.has(i)) continue;
      var fs = Math.min(r.r * k * 1.45, 26);
      if (fs < 5.5) continue;
      var x = r.x * k + V.panX, y = r.y * k + V.panY;
      if (x < -20 || y < -20 || x > cw + 20 || y > ch + 20) continue;
      var on = r.num === P.sel;
      if (on) {
        ctx.globalAlpha = 0.18; ctx.fillStyle = hot;
        ctx.beginPath(); ctx.arc(x, y, fs * 0.95, 0, 6.284); ctx.fill(); ctx.globalAlpha = 1;
      }
      ctx.font = (on ? '800 ' : '600 ') + fs.toFixed(1) + 'px ' + getComputedStyle(document.body).fontFamily;
      ctx.fillStyle = on ? hot : dim;
      ctx.fillText(r.num, x, y);
    }
  }

  /* ---- input ---- */
  var ptrs = new Map(), panMode = false, pinch = null, moved = 0, painting = false, lastPaint = null;
  stage.addEventListener('pointerdown', function (e) {
    if (!P || !P.ready) return;
    stage.setPointerCapture(e.pointerId);
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY, sx: e.clientX, sy: e.clientY });
    moved = 0;
    if (ptrs.size === 2) {
      var a = Array.from(ptrs.values());
      pinch = {
        d: Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y),
        cx: (a[0].x + a[1].x) / 2, cy: (a[0].y + a[1].y) / 2,
        z: V.zoom, px: V.panX, py: V.panY
      };
      painting = false;
    } else if (!panMode) {
      painting = true; lastPaint = null;
      paintAt(e);
    }
    audio();
  });
  stage.addEventListener('pointermove', function (e) {
    if (!P || !P.ready) return;
    var p = ptrs.get(e.pointerId); if (!p) return;
    var dx = e.clientX - p.x, dy = e.clientY - p.y;
    p.x = e.clientX; p.y = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    if (ptrs.size === 2 && pinch) {
      var a = Array.from(ptrs.values());
      var d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      var cx = (a[0].x + a[1].x) / 2, cy = (a[0].y + a[1].y) / 2;
      var nz = Math.max(0.85, Math.min(14, pinch.z * (d / pinch.d)));
      var rb = stage.getBoundingClientRect();
      var ox = pinch.cx - rb.left, oy = pinch.cy - rb.top;
      var f = nz / pinch.z;
      V.zoom = nz;
      V.panX = (pinch.px - ox) * f + (cx - rb.left);
      V.panY = (pinch.py - oy) * f + (cy - rb.top);
      clampView();
    } else if (panMode || (!painting && ptrs.size === 1)) {
      V.panX += dx; V.panY += dy; clampView();
    } else if (painting) {
      paintAt(e);
    }
  });
  function endPtr(e) {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (ptrs.size === 0) painting = false;
  }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);
  stage.addEventListener('wheel', function (e) {
    if (!P || !P.ready) return;
    e.preventDefault();
    var rb = stage.getBoundingClientRect(), ox = e.clientX - rb.left, oy = e.clientY - rb.top;
    var nz = Math.max(0.85, Math.min(14, V.zoom * (e.deltaY < 0 ? 1.14 : 1 / 1.14)));
    var f = nz / V.zoom;
    V.panX = ox - (ox - V.panX) * f; V.panY = oy - (oy - V.panY) * f;
    V.zoom = nz; clampView();
  }, { passive: false });

  function paintAt(e) {
    var rb = stage.getBoundingClientRect();
    var x = e.clientX - rb.left, y = e.clientY - rb.top;
    var id = E.pickAt(P.pz, viewFor(), x, y);
    if (id >= 0 && id === lastPaint) return;
    lastPaint = id;
    tryFill(x, y, moved > 12);
  }

  function zoomBy(f) {
    var nz = Math.max(0.85, Math.min(14, V.zoom * f));
    var ox = cw / 2, oy = ch / 2, k = nz / V.zoom;
    V.panX = ox - (ox - V.panX) * k; V.panY = oy - (oy - V.panY) * k;
    V.zoom = nz; clampView();
  }
  $('#zIn').onclick = function () { zoomBy(1.35); };
  $('#zOut').onclick = function () { zoomBy(1 / 1.35); };
  $('#btnFit').onclick = function () { fitView(); SFX.tap(); };
  $('#btnPan').onclick = function () {
    panMode = !panMode; this.classList.toggle('on', panMode); SFX.tap();
  };
  $('#playBack').onclick = function () { back(); };
  var peeking = false;
  addEventListener('pointerup', function () { peekOff(); });
  addEventListener('pointercancel', function () { peekOff(); });
  $('#btnPeek').onmousedown = peekOn; $('#btnPeek').onmouseup = peekOff;
  $('#btnPeek').ontouchstart = function (e) { e.preventDefault(); peekOn(); };
  $('#btnPeek').ontouchend = function (e) { e.preventDefault(); peekOff(); };
  function peekOn() {
    if (!P || !P.ready || peeking) return;
    peeking = true;
    var pz = P.pz, d = paintImg.data;
    for (var i = 0; i < pz.regions.length; i++) {
      if (P.filled.has(i)) continue;
      var r = pz.regions[i], col = pz.palette[r.num - 1].rgb;
      for (var k = r.off; k < r.off + r.len; k++) {
        var p = pz.pix[k], o = p * 4;
        d[o] = (col[0] + PAPER[0] * 2.1) / 3.1; d[o + 1] = (col[1] + PAPER[1] * 2.1) / 3.1;
        d[o + 2] = (col[2] + PAPER[2] * 2.1) / 3.1;
      }
    }
    flush();
  }
  function peekOff() {
    if (!peeking || !P || !P.ready) { peeking = false; return; }
    peeking = false;
    var pz = P.pz;
    for (var i = 0; i < pz.regions.length; i++) if (!P.filled.has(i)) paintRegion(i);
    flush();
  }
  var hintR = null, hintT = 0;
  $('#btnHint').onclick = function () {
    if (!P || !P.ready || P.done) return;
    SFX.tap();
    var pz = P.pz, pool = [];
    for (var i = 0; i < pz.regions.length; i++)
      if (!P.filled.has(i) && pz.regions[i].num === P.sel) pool.push(i);
    if (!pool.length) {
      nextColour();
      for (var j = 0; j < pz.regions.length; j++)
        if (!P.filled.has(j) && pz.regions[j].num === P.sel) pool.push(j);
    }
    if (!pool.length) return;
    hintR = pool[(Math.random() * pool.length) | 0]; hintT = performance.now();
    var r = pz.regions[hintR], k = V.size * V.zoom / pz.res;
    var x = r.x * k + V.panX, y = r.y * k + V.panY;
    if (x < 20 || y < 20 || x > cw - 20 || y > ch - 20) {
      V.panX += cw / 2 - x; V.panY += ch / 2 - y; clampView();
    }
  };

  /* ---- finish modal ---- */
  $('#finClose').onclick = function () { $('#finish').classList.remove('on'); back(); };
  $('#finNext').onclick = function () {
    $('#finish').classList.remove('on');
    var list = picsOf(P.pic.cat), i = list.indexOf(P.pic);
    var nxt = list[(i + 1) % list.length], d = P.diff;
    back(); setTimeout(function () { startPlay(nxt, d); }, 60);
  };
  $('#finSave').onclick = function () {
    var out = document.createElement('canvas'); out.width = out.height = 1024;
    var o = out.getContext('2d'); o.imageSmoothingEnabled = true;
    o.drawImage(paintCv, 0, 0, 1024, 1024);
    try {
      var a = document.createElement('a');
      a.download = 'numbrush-' + P.pic.id + '-' + P.diff + '.png';
      a.href = out.toDataURL('image/png');
      a.click();
    } catch (e) { }
  };

  /* =================== GALLERY =================== */
  var galQueue = [];
  function buildGallery() {
    var el = $('#galList'); el.innerHTML = '';
    galQueue = [];
    var items = [];
    Object.keys(PROG).forEach(function (k) {
      if (!PROG[k].d) return;
      var parts = k.split('|'), pic = PICTURES.filter(function (p) { return p.id === parts[0]; })[0];
      if (pic) items.push({ pic: pic, diff: parts[1], t: PROG[k].t || 0 });
    });
    items.sort(function (a, b) { return b.t - a.t; });
    $('#galEmpty').style.display = items.length ? 'none' : 'block';
    items.forEach(function (it) {
      var b = document.createElement('button'); b.className = 'g';
      var c = document.createElement('canvas'); c.width = c.height = 160;
      var cx = c.getContext('2d');
      var im = cx.createImageData(160, 160);
      im.data.set(E.thumbPixels(it.pic, 160));
      cx.putImageData(im, 0, 0);
      b.appendChild(c);
      var m = document.createElement('div'); m.className = 'meta';
      m.innerHTML = '<b>' + it.pic.name + '</b><small>' + E.DIFF[it.diff].label + '</small>';
      b.appendChild(m);
      b.onclick = function () { SFX.tap(); openSheet(it.pic); };
      el.appendChild(b);
      galQueue.push({ it: it, cx: cx });
    });
    drainGallery();
  }
  function drainGallery() {
    var job = galQueue.shift(); if (!job) return;
    setTimeout(function () {
      try {
        var pz = E.buildPuzzle(job.it.pic, job.it.diff, { res: 160, searchRes: 160 });
        var im = job.cx.createImageData(160, 160), d = im.data;
        for (var i = 0; i < pz.regions.length; i++) {
          var r = pz.regions[i], col = pz.palette[r.num - 1].rgb;
          for (var k = r.off; k < r.off + r.len; k++) {
            var p = pz.pix[k], o = p * 4;
            var c = E.shift(col, (pz.shade[p] - 128) / 420);
            d[o] = c[0]; d[o + 1] = c[1]; d[o + 2] = c[2]; d[o + 3] = 255;
          }
        }
        job.cx.putImageData(im, 0, 0);
      } catch (e) { }
      drainGallery();
    }, 40);
  }

  /* =================== SETTINGS =================== */
  function buildSettings() {
    $('#tgSfx').classList.toggle('on', !!SET.sfx);
    $('#tgMusic').classList.toggle('on', !!SET.music);
    var done = Object.keys(PROG).filter(function (k) { return PROG[k].d; }).length;
    $('#statTxt').textContent = done + ' painted \u00b7 ' + Object.keys(PROG).length + ' started';
    var el = $('#themeList'); el.innerHTML = '';
    THEMES.forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'th' + (t.id === SET.theme ? ' sel' : '');
      b.innerHTML = '<span class="sws"><i style="background:' + t.bg1 + '"></i><i style="background:' + t.accent +
        '"></i><i style="background:' + t.accent2 + '"></i><i style="background:' + t.surface + '"></i></span><b>' + t.name + '</b>';
      b.onclick = function () {
        SET.theme = t.id; save(K.set, SET); applyTheme(); buildSettings(); SFX.tap();
        if (SET.music) musicOn();
      };
      el.appendChild(b);
    });
  }
  $('#tgSfx').onclick = function () { SET.sfx = !SET.sfx; save(K.set, SET); this.classList.toggle('on', SET.sfx); if (SET.sfx) SFX.tap(); };
  $('#tgMusic').onclick = function () {
    SET.music = !SET.music; save(K.set, SET); this.classList.toggle('on', SET.music);
    if (SET.music) { audio(); musicOn(); } else musicOff();
  };
  $('#btnReset').onclick = function () {
    if (!confirm('Erase every painted picture and all progress?')) return;
    PROG = {}; STAT = { filled: 0, done: 0 };
    save(K.prog, PROG); save(K.stat, STAT);
    buildSettings(); buildHome();
  };
  $('#goGallery').onclick = function () { SFX.tap(); go('gallery'); };
  $('#goSettings').onclick = function () { SFX.tap(); go('settings'); };

  /* =================== BOOT =================== */
  applyTheme();
  buildHome();
  drawParts();
  addEventListener('keydown', function (e) {
    if (!P || !P.ready) return;
    if (e.key === '+' || e.key === '=') zoomBy(1.3);
    if (e.key === '-') zoomBy(1 / 1.3);
    if (e.key === '0') fitView();
    if (e.key === 'Escape') back();
  });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  window.addEventListener('pointerdown', function once() {
    if (SET.music) { audio(); musicOn(); }
    window.removeEventListener('pointerdown', once);
  });
})();
// ==APP_END==
</script>
</body></html>
