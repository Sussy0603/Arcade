<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="theme-color" content="#16261a"/>
<title>Mossling</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --line:rgba(255,255,255,.22);
    --gold:#e8c34d; --gold2:#e8a02b;
    --accent:#6bcf7a; --accent2:#e8905a;
    --bad:#ff6b6b;
    --ui-font:'Nunito',system-ui,sans-serif;
    --dis-font:'Baloo 2',system-ui,sans-serif;
    --r:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{font-family:var(--ui-font);background:#0e1a12;color:#fff;
    display:flex;align-items:center;justify-content:center;user-select:none;-webkit-user-select:none}
  #app{position:relative;width:100%;height:100%;max-width:520px;max-height:100vh;
    overflow:hidden;background:#16261a;box-shadow:0 0 80px rgba(0,0,0,.6)}
  @media(min-width:700px){#app{max-width:min(92vw,900px)}}
  canvas#terra{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

  .hud{position:absolute;top:0;left:0;right:0;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;gap:8px;align-items:flex-start;z-index:20;pointer-events:none}
  .hud>*{pointer-events:auto}
  .chip{background:rgba(10,26,14,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--line);border-radius:999px;padding:7px 13px;display:flex;align-items:center;gap:7px;
    font-weight:800;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);white-space:nowrap}
  .icbtn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);
    background:rgba(10,26,14,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    display:grid;place-items:center;font-size:17px;cursor:pointer;color:#fff;
    box-shadow:0 6px 20px rgba(0,0,0,.25);transition:transform .12s;flex:none}
  .icbtn:active{transform:scale(.9)}
  .icbtn.off{opacity:.45}
  .spacer{flex:1}

  .strip{position:absolute;top:calc(58px + env(safe-area-inset-top));left:12px;right:12px;z-index:19;display:flex;gap:8px;pointer-events:none}
  #boostRow{position:absolute;top:calc(98px + env(safe-area-inset-top));left:12px;right:12px;z-index:19;
    display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
  .boostpill{background:rgba(232,195,77,.2);border:1px solid rgba(232,195,77,.55);color:#f5e6b0;
    border-radius:999px;padding:4px 10px;font-size:10.5px;font-weight:800;display:flex;align-items:center;gap:4px;
    backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:pulse 1.8s ease-in-out infinite}
  .meter{flex:1;background:rgba(10,26,14,.5);border:1px solid var(--line);border-radius:999px;
    padding:5px 10px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
  .meter .lab{font-size:9.5px;font-weight:800;letter-spacing:.10em;text-transform:uppercase;opacity:.75;display:flex;justify-content:space-between}
  .bar{height:6px;border-radius:999px;background:rgba(255,255,255,.16);margin-top:4px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:999px;transition:width .45s cubic-bezier(.3,1,.4,1)}
  #tidyFill{background:linear-gradient(90deg,#6bcf7a,#5fc48a)}
  #waterFill{background:linear-gradient(90deg,#5fb0e8,#6bcf7a)}

  .dock{position:absolute;left:0;right:0;bottom:0;z-index:20;padding:10px 10px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center}
  .tool{position:relative;flex:1;max-width:110px;border-radius:16px;cursor:pointer;padding:10px 4px 8px;
    font-family:var(--ui-font);color:#fff;background:rgba(10,26,14,.6);border:1px solid var(--line);
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:flex;flex-direction:column;align-items:center;gap:3px;
    transition:transform .12s,background .2s;box-shadow:0 8px 24px rgba(0,0,0,.3)}
  .tool:active{transform:translateY(2px) scale(.96)}
  .tool .ic{font-size:21px;line-height:1}
  .tool .tx{font-size:10.5px;font-weight:800;letter-spacing:.03em}
  .tool.armed{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2a00;border-color:#fff6;
    box-shadow:0 0 0 3px rgba(232,195,77,.28),0 10px 26px rgba(0,0,0,.35)}
  .tool.armed .tx{color:#3a2a00}
  .badge{position:absolute;top:4px;right:6px;background:var(--bad);border-radius:999px;font-size:9px;font-weight:900;padding:1px 5px;line-height:1.5}

  .scrim{position:absolute;inset:0;z-index:40;display:none;background:rgba(4,16,8,.62);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);align-items:flex-end;justify-content:center}
  .scrim.on{display:flex;animation:fade .22s ease}
  @keyframes fade{from{opacity:0}}
  .sheet{width:100%;max-height:86%;background:linear-gradient(180deg,#1c3520,#0f1f14);
    border-top-left-radius:26px;border-top-right-radius:26px;border-top:1px solid rgba(255,255,255,.2);
    display:flex;flex-direction:column;animation:up .3s cubic-bezier(.2,1,.3,1);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
  @keyframes up{from{transform:translateY(100%)}}
  .sheet.center{border-radius:24px;margin:auto 14px;max-width:400px;animation:pop .28s cubic-bezier(.2,1.3,.4,1)}
  @keyframes pop{from{transform:scale(.85);opacity:0}}
  .scrim.mid{align-items:center}
  .grab{width:38px;height:4px;border-radius:9px;background:rgba(255,255,255,.3);margin:9px auto 2px;flex:none}
  .shead{display:flex;align-items:center;gap:10px;padding:10px 18px 12px;flex:none;border-bottom:1px solid rgba(255,255,255,.1)}
  .shead h2{font-family:var(--dis-font);font-size:23px;font-weight:800;flex:1}
  .x{width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.12);border:none;color:#fff;
    font-size:16px;cursor:pointer;display:grid;place-items:center;flex:none}
  .sbody{overflow-y:auto;padding:14px 16px 22px;-webkit-overflow-scrolling:touch;flex:1}
  .sbody::-webkit-scrollbar{width:0}
  .tabs{display:flex;gap:6px;padding:0 16px 12px;flex:none;flex-wrap:wrap}
  .tab{flex:1;min-width:64px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);
    color:#fff;font-weight:800;font-size:11.5px;cursor:pointer;font-family:var(--ui-font)}
  .tab.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2a00;border-color:transparent}

  .card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:var(--r);
    padding:12px;margin-bottom:10px;display:flex;gap:11px;align-items:center}
  .card .art{width:52px;height:52px;border-radius:14px;flex:none;display:grid;place-items:center;background:rgba(0,0,0,.22);overflow:hidden}
  .card .art canvas{width:100%;height:100%}
  .card .art .emo{font-size:26px}
  .card .info{flex:1;min-width:0}
  .card .nm{font-weight:900;font-size:14.5px;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
  .card .sub{font-size:11.5px;opacity:.72;margin-top:2px;line-height:1.35}
  .card.fx-boost,.row.fx-boost{border-color:rgba(232,195,77,.5);animation:fxglow 2.2s ease-in-out infinite}
  @keyframes fxglow{0%,100%{box-shadow:0 0 0 1px rgba(232,195,77,.22),0 4px 14px rgba(232,195,77,.08)}
    50%{box-shadow:0 0 0 1px rgba(232,195,77,.5),0 4px 18px rgba(232,195,77,.3)}}
  .btn{border:none;border-radius:12px;padding:9px 13px;font-weight:900;font-size:12.5px;cursor:pointer;
    font-family:var(--ui-font);background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2a00;
    flex:none;box-shadow:0 4px 12px rgba(0,0,0,.25);transition:transform .12s;white-space:nowrap}
  .btn:active{transform:scale(.93)}
  .btn.ghost{background:rgba(255,255,255,.14);color:#fff;box-shadow:none}
  .btn.mint{background:linear-gradient(180deg,#6bcf7a,#3fa65c);color:#04321a}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .btn.wide{width:100%;padding:13px;font-size:14px;margin-top:6px}
  .qty{display:flex;align-items:center;gap:5px;flex:none}
  .qty button{width:23px;height:23px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.14);
    color:#fff;font-weight:900;font-size:13px;cursor:pointer;display:grid;place-items:center;padding:0;font-family:var(--ui-font)}
  .qty button:active{transform:scale(.9)}
  .qty button[disabled]{opacity:.3;pointer-events:none}
  .qty .qn{min-width:15px;text-align:center;font-weight:900;font-size:12.5px}

  .rar{font-size:9px;font-weight:900;padding:2px 6px;border-radius:6px;letter-spacing:.05em}
  .r-common{background:#9db9a3;color:#16261a}
  .r-rare{background:#7cc6ff;color:#0a2a45}
  .r-epic{background:#c79bff;color:#2b0d47}
  .r-legend{background:linear-gradient(90deg,var(--gold),var(--accent2));color:#3a2a00}
  .r-mythic{background:linear-gradient(90deg,#ff6b6b,#feca57,#48dbfb,#1dd1a1,#a55eea);color:#1a0a2e}
  .r-ancient{background:linear-gradient(90deg,#0a2013,#1d9450,#3adf8c,#0a2013);color:#d5ffe9}

  .empty{text-align:center;padding:34px 16px;opacity:.75;font-size:13px;line-height:1.6}
  .empty .e{font-size:40px;display:block;margin-bottom:8px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:14px;margin-bottom:9px}
  .row .l{font-weight:800;font-size:13.5px}
  .row .d{font-size:11px;opacity:.68;margin-top:2px}

  .sw{width:50px;height:28px;border-radius:999px;background:rgba(255,255,255,.2);position:relative;
    cursor:pointer;flex:none;transition:background .2s;border:none}
  .sw:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
    background:#fff;transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
  .sw.on{background:linear-gradient(90deg,var(--gold),var(--gold2))}
  .sw.on:after{transform:translateX(22px)}

  .themes{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
  .th{border-radius:15px;padding:11px;cursor:pointer;border:2px solid transparent;position:relative;
    display:flex;flex-direction:column;gap:7px;transition:transform .12s}
  .th:active{transform:scale(.96)}
  .th.on{border-color:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.22)}
  .th .tn{font-weight:900;font-size:12.5px;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .th .dots{display:flex;gap:4px}
  .th .dots i{width:13px;height:13px;border-radius:50%;display:block;border:1px solid rgba(255,255,255,.35)}
  .th .lk{position:absolute;top:7px;right:8px;font-size:11px}

  input[type=text]{width:100%;padding:12px 13px;border-radius:13px;border:1px solid var(--line);
    background:rgba(0,0,0,.28);color:#fff;font-size:15px;font-family:var(--ui-font);font-weight:700}
  input:focus{outline:2px solid var(--gold);outline-offset:1px}

  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .st{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:14px;padding:10px 11px}
  .st .v{font-family:var(--dis-font);font-size:20px;font-weight:800}
  .st .k{font-size:10px;opacity:.65;text-transform:uppercase;letter-spacing:.07em;font-weight:800;margin-top:1px}

  .ach{display:flex;gap:10px;align-items:center;padding:10px;border-radius:14px;margin-bottom:8px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1)}
  .ach.got{background:linear-gradient(90deg,rgba(232,195,77,.2),rgba(107,207,122,.12));border-color:rgba(232,195,77,.45)}
  .ach .ai{font-size:22px;width:38px;height:38px;border-radius:11px;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
  .ach.got .ai{background:linear-gradient(135deg,var(--gold),var(--accent))}
  .ach .an{font-weight:900;font-size:13px}
  .ach .ad{font-size:11px;opacity:.7;margin-top:1px}
  .ach .ac{margin-left:auto;font-size:16px;flex:none}
  .ach.locked{opacity:.55}

  #toasts{position:absolute;top:calc(104px + env(safe-area-inset-top));left:0;right:0;z-index:60;display:flex;flex-direction:column;
    align-items:center;gap:6px;pointer-events:none}
  .toast{background:rgba(10,26,14,.9);border:1px solid var(--line);border-radius:999px;padding:8px 16px;
    font-weight:800;font-size:12.5px;box-shadow:0 8px 24px rgba(0,0,0,.4);
    animation:tin .3s cubic-bezier(.2,1.4,.4,1), tout .3s ease 2.2s forwards;
    backdrop-filter:blur(10px);max-width:90%;text-align:center}
  .toast.gold{background:linear-gradient(90deg,var(--gold),var(--gold2));color:#3a2a00;border-color:#fff5}
  @keyframes tin{from{transform:translateY(-16px) scale(.85);opacity:0}}
  @keyframes tout{to{transform:translateY(-10px);opacity:0}}

  #floats{position:absolute;inset:0;z-index:15;pointer-events:none;overflow:hidden}
  .fl{position:absolute;font-weight:900;font-size:15px;color:var(--gold);
    text-shadow:0 2px 6px rgba(0,0,0,.6);animation:flup 1.1s ease-out forwards}
  @keyframes flup{to{transform:translate(-50%,-52px) scale(1.15);opacity:0}}

  #banner{position:absolute;top:-140px;left:14px;right:14px;z-index:70;
    background:linear-gradient(135deg,#e8c34d,#6bcf7a);color:#1a2a12;border-radius:20px;padding:13px 15px;
    display:flex;gap:11px;align-items:center;box-shadow:0 14px 40px rgba(0,0,0,.5);
    transition:top .5s cubic-bezier(.2,1.4,.4,1)}
  #banner.show{top:calc(14px + env(safe-area-inset-top))}
  #banner .bi{font-size:26px}
  #banner .bt{font-size:9.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
  #banner .bn{font-weight:900;font-size:15px;font-family:var(--dis-font)}

  .reward{text-align:center;padding:8px 4px 4px}
  .reward .big{font-size:56px;animation:bob 2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(4deg)}}
  .reward h3{font-family:var(--dis-font);font-size:26px;margin:6px 0 2px}
  .reward p{opacity:.78;font-size:13px;line-height:1.5}
  .amt{font-family:var(--dis-font);font-size:38px;font-weight:800;color:var(--gold);margin:10px 0 2px}
  .streak{display:flex;gap:5px;justify-content:center;margin:14px 0 4px}
  .streak i{width:26px;height:26px;border-radius:9px;background:rgba(255,255,255,.12);display:grid;place-items:center;
    font-size:11px;font-weight:900;font-style:normal;border:1px solid rgba(255,255,255,.15)}
  .streak i.on{background:linear-gradient(180deg,var(--gold),var(--gold2));color:#3a2a00;border-color:transparent}

  .hint{position:absolute;bottom:calc(86px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:18;
    background:rgba(10,26,14,.75);border:1px solid var(--line);border-radius:999px;padding:6px 14px;
    font-size:11.5px;font-weight:800;backdrop-filter:blur(10px);white-space:nowrap;
    animation:pulse 1.8s ease-in-out infinite;pointer-events:none}
  @keyframes pulse{0%,100%{opacity:.75}50%{opacity:1}}
  .hint.hide{display:none}

  .plantrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:7px}
  .mini{font-size:10px;font-weight:800;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.28)}
  .mini.warn{background:rgba(255,107,107,.3)}
  .mini.good{background:rgba(92,224,141,.22)}

  .deco-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .deco{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);border-radius:14px;
    padding:9px 5px;text-align:center;cursor:pointer;transition:transform .12s}
  .deco:active{transform:scale(.94)}
  .deco.owned{border-color:var(--accent)}
  .deco.placed{background:rgba(107,207,122,.18)}
  .deco .de{font-size:26px;line-height:1.2}
  .deco .dn{font-size:9.5px;font-weight:800;margin-top:3px;opacity:.85}
  .deco .dp{font-size:10px;font-weight:900;color:var(--gold);margin-top:3px}
  .deco.owned .dp{color:var(--accent)}

  #splash{position:absolute;inset:0;z-index:100;background:linear-gradient(180deg,#1c3a24,#0a160e);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    transition:opacity .6s;cursor:pointer}
  #splash.gone{opacity:0;pointer-events:none}
  #splash .lg{font-family:var(--dis-font);font-size:52px;font-weight:800;
    background:linear-gradient(90deg,#e8c34d,#6bcf7a,#5fb0e8);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;animation:bob 3s ease-in-out infinite}
  #splash .sb{opacity:.7;font-size:13px;font-weight:700;letter-spacing:.05em}
  #splash .go{margin-top:22px;padding:13px 34px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);font-weight:900;font-size:14px;animation:pulse 1.6s ease-in-out infinite}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="terra"></canvas>
  <div id="floats"></div>

  <div class="hud">
    <div class="chip" id="coinChip" style="cursor:pointer"><span>🪙</span><span id="coins">0</span><span style="opacity:.55;font-weight:900;margin-left:1px">＋</span></div>
    <div class="chip" id="plantChip" style="cursor:pointer"><span>🌱</span><span id="plantCount">0/3</span></div>
    <div class="chip"><span id="seasonEmo">🌸</span><span id="seasonTx">Spring</span></div>
    <div class="spacer"></div>
    <button class="icbtn" id="muteBtn">🔊</button>
    <button class="icbtn" id="menuBtn">☰</button>
  </div>

  <div class="strip">
    <div class="meter"><div class="lab"><span>Tidy</span><span id="tidyVal">100%</span></div>
      <div class="bar"><i id="tidyFill" style="width:100%"></i></div></div>
    <div class="meter"><div class="lab"><span>Water</span><span id="waterVal">100%</span></div>
      <div class="bar"><i id="waterFill" style="width:100%"></i></div></div>
  </div>
  <div id="boostRow"></div>

  <div class="hint" id="hint">Tap a tool below to begin</div>

  <div class="dock">
    <button class="tool" id="tWater"><span class="ic">💧</span><span class="tx">WATER</span><span class="badge" id="waterBadge" style="display:none"></span></button>
    <button class="tool" id="tPrune"><span class="ic">✂️</span><span class="tx">PRUNE</span></button>
    <button class="tool" id="tShop"><span class="ic">🛒</span><span class="tx">MARKET</span></button>
    <button class="tool" id="tGarden"><span class="ic">🌿</span><span class="tx">GARDEN</span></button>
  </div>

  <div id="toasts"></div>
  <div id="banner"><div class="bi">🏆</div><div><div class="bt">Achievement</div><div class="bn" id="bnName"></div></div></div>

  <div class="scrim" id="scrim">
    <div class="sheet">
      <div class="grab"></div>
      <div class="shead"><span class="chip" id="shCoins" style="display:none"><span>🪙</span><span id="shCoinsVal">0</span></span><span class="chip" id="shPlants" style="display:none"><span>🌱</span><span id="shPlantsVal">0</span></span><h2 id="shTitle">Title</h2><button class="x" id="shX">✕</button></div>
      <div class="tabs" id="shTabs" style="display:none"></div>
      <div class="sbody" id="shBody"></div>
    </div>
  </div>

  <div class="scrim mid" id="scrim2">
    <div class="sheet center">
      <div class="shead"><h2 id="sh2Title">Title</h2><button class="x" id="sh2X">✕</button></div>
      <div class="sbody" id="sh2Body"></div>
    </div>
  </div>

  <div id="splash">
    <div class="lg">Mossling</div>
    <div class="sb">a tiny terrarium to tend</div>
    <div class="go">Tap to start growing</div>
  </div>
</div>

<script>
"use strict";
const K='mossling.save.v1';
const SLOTS_KEY='mossling.slots.v1', ACTIVE_KEY='mossling.activeSlot';
const slotKey=id=>'mossling.save.'+id;
function loadSlots(){
  try{const raw=localStorage.getItem(SLOTS_KEY);const arr=raw?JSON.parse(raw):[];return Array.isArray(arr)?arr:[];}
  catch(e){return [];}
}
function saveSlots(arr){try{localStorage.setItem(SLOTS_KEY,JSON.stringify(arr));}catch(e){}}
function getActiveSlot(){try{return localStorage.getItem(ACTIVE_KEY);}catch(e){return null;}}
function setActiveSlot(id){try{localStorage.setItem(ACTIVE_KEY,id);}catch(e){}}
function activeKey(){const id=getActiveSlot();return id?slotKey(id):null;}
function updateSlotMeta(id){
  if(!id||!S)return;
  const slots=loadSlots();
  const i=slots.findIndex(x=>x.id===id);
  const meta={id:id,name:S.name,difficulty:S.difficulty||'normal',coins:S.coins,totalCoins:S.totalCoins,
    plantCount:S.plants.length,achCount:Object.keys(S.ach).length,streak:S.streak,updated:Date.now()};
  if(i>=0)slots[i]=meta; else slots.push(meta);
  saveSlots(slots);
}
function ensureSlots(){
  let slots=loadSlots();
  const active=getActiveSlot();
  if(slots.length===0){
    let legacy=null;
    try{legacy=localStorage.getItem(K);}catch(e){}
    if(legacy){
      const id='s'+Date.now();
      try{localStorage.setItem(slotKey(id),legacy);}catch(e){}
      let name='Plant Parent', diffId='normal', coins=0, plantCount=0;
      try{const d=JSON.parse(legacy);name=d.name||name;coins=d.coins||0;plantCount=(d.plants||[]).length;diffId=d.difficulty||'normal';}catch(e){}
      slots=[{id:id,name:name,difficulty:diffId,coins:coins,plantCount:plantCount,updated:Date.now()}];
      saveSlots(slots); setActiveSlot(id);
      return id;
    }
    return null;
  }
  if(active&&slots.some(s=>s.id===active))return active;
  const fallback=slots.slice().sort((a,b)=>(b.updated||0)-(a.updated||0))[0];
  if(fallback){setActiveSlot(fallback.id);return fallback.id;}
  return null;
}

const fmt=n=>{
  n=Math.floor(n);
  const neg=n<0?'-':''; n=Math.abs(n);
  if(n>=1e12)return neg+(n/1e12).toFixed(n>=1e14?0:1).replace(/\.0$/,'')+'T';
  if(n>=1e9)return neg+(n/1e9).toFixed(n>=1e11?0:1).replace(/\.0$/,'')+'B';
  if(n>=1e6)return neg+(n/1e6).toFixed(n>=1e8?0:1).replace(/\.0$/,'')+'M';
  if(n>=1e4)return neg+(n/1e3).toFixed(1)+'k';
  return neg+String(n);
};

const A={ctx:null,master:null,musicGain:null,sfxGain:null,cur:null,nodes:[],timer:null};
function audioInit(){
  if(A.ctx)return;
  try{
    A.ctx=new (window.AudioContext||window.webkitAudioContext)();
    A.master=A.ctx.createGain(); A.master.gain.value=1; A.master.connect(A.ctx.destination);
    A.musicGain=A.ctx.createGain(); A.musicGain.gain.value=S.music?.25:0; A.musicGain.connect(A.master);
    A.sfxGain=A.ctx.createGain(); A.sfxGain.gain.value=S.sound?.5:0; A.sfxGain.connect(A.master);
  }catch(e){}
}
function audioResume(){if(A.ctx&&A.ctx.state==='suspended')A.ctx.resume().catch(()=>{});}
function noiseBuf(sec){const c=A.ctx,b=c.createBuffer(1,Math.max(1,(c.sampleRate*sec)|0),c.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1; return b;}
function sfx(type){
  if(!A.ctx||!S.sound)return;
  const c=A.ctx,t=c.currentTime;
  const mk=(f0,f1,dur,vol,wave)=>{
    const o=c.createOscillator(),g=c.createGain();
    o.type=wave||'sine'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.012); g.gain.exponentialRampToValueAtTime(.001,t+dur);
    o.connect(g); g.connect(A.sfxGain); o.start(t); o.stop(t+dur+.02);
  };
  if(type==='water')mk(340,220,.22,.35,'sine');
  else if(type==='prune')mk(900,500,.09,.3,'triangle');
  else if(type==='mist')mk(600,900,.14,.3,'sine');
  else if(type==='coin')mk(760,1180,.12,.32,'square');
  else if(type==='buy')mk(500,780,.16,.3,'triangle');
  else if(type==='sell')mk(420,260,.18,.3,'sine');
  else if(type==='ach')mk(500,1300,.4,.3,'triangle');
  else if(type==='bad')mk(220,120,.24,.3,'sawtooth');
  else if(type==='lucky')mk(700,1500,.5,.32,'triangle');
  else if(type==='tap')mk(500,700,.06,.2,'sine');
  else if(type==='pop')mk(300,900,.1,.25,'square');
}
function musicStop(){
  if(A.timer)clearTimeout(A.timer);
  A.nodes.forEach(n=>{try{n.stop&&n.stop();}catch(e){} try{n.disconnect&&n.disconnect();}catch(e){}});
  A.nodes=[]; A.cur=null;
}
function tone(f,st,dur,type,vol,dest){
  const c=A.ctx,o=c.createOscillator(),g=c.createGain();
  o.type=type||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(vol,st+.05); g.gain.exponentialRampToValueAtTime(.001,st+dur);
  o.connect(g); g.connect(dest); o.start(st); o.stop(st+dur+.05); A.nodes.push(o);
}
function musicPlay(kind){
  if(!A.ctx||!S.music)return;
  if(A.cur===kind)return;
  musicStop(); A.cur=kind;
  const scales={birds:[523,587,659,784,880],water:[392,440,523,587,659],lofi:[349,415,466,523,587],bells:[440,523,659,880,988]};
  const sc=scales[kind]||scales.birds;
  let i=0;
  const step=()=>{
    if(A.cur!==kind)return;
    const c=A.ctx, t=c.currentTime+.05;
    tone(pick(sc),t,rnd(1.4,2.6),'sine',.05,A.musicGain);
    if(Math.random()<.4)tone(pick(sc)/2,t+.1,rnd(1.8,3),'triangle',.03,A.musicGain);
    i++; A.timer=setTimeout(step,rnd(1400,2600));
  };
  step();
}

const cv=$('terra'), ctx=cv.getContext('2d');
let W=0,H=0,DPR=1;
function updateWorldSize(){

function soilTopY(){return H*0.5;}
let ents=[]; // rendered plant entities {f, sp, x, y, phase}
function layoutPlants(){
  dispZoom=potZoom();
  const cap=potDef().cap;
  const cols=Math.min(5,Math.max(3,Math.ceil(Math.sqrt(cap))));
  const rows=Math.ceil(cap/cols);
  const marginX=W*0.12;
  const bedTop=soilTopY()+H*0.04, bedBottom=H*0.86;
  const usableW=W-marginX*2, usableH=bedBottom-bedTop;
  const cellW=usableW/cols, cellH=usableH/Math.max(1,rows);
  ents=S.plants.map((f,i)=>{
    const col=i%cols, row=Math.floor(i/cols);
    const x=marginX+cellW*(col+.5);
    const y=bedTop+cellH*(row+.5);
    return {f,sp:spec(f.sp),x,y,phase:rnd(0,Math.PI*2)};
  });
}
function findEntAt(x,y){
  let best=null,bd=1e9;
  for(const e of ents){
    const r=42*dispZoom*(0.7+ (e.sp.size||1)*.3);
    const dx=x-e.x, dy=y-(e.y-r*.6);
    const d=Math.hypot(dx,dy);
    if(d<r&&d<bd){bd=d;best=e;}
  }
  return best;
}

function shade(hex,amt){
  const c=hex.replace('#',''); const n=parseInt(c,16);
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=clamp(r,0,255); g=clamp(g,0,255); b=clamp(b,0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---------------- Background ---------------- */
let motes=[];
function initFx(){
  motes=[];
  const n=18;
  for(let i=0;i<n;i++)motes.push({x:rnd(0,1),y:rnd(0,1),r:rnd(1,3),spd:rnd(.02,.06),drift:rnd(-1,1)});
}
function bg(t){
  const p=pal();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,p.sky[0]); g.addColorStop(1,p.sky[1]);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  // glass rim highlight
  ctx.save();
  ctx.globalAlpha=.12;
  ctx.strokeStyle='#ffffff'; ctx.lineWidth=Math.min(W,H)*.02;
  ctx.beginPath(); ctx.roundRect(6,6,W-12,H-12,26); ctx.stroke();
  ctx.restore();
  // soil floor
  const soilTop=soilTopY();
  const sg=ctx.createLinearGradient(0,soilTop,0,H);
  sg.addColorStop(0,shade(p.soil,30)); sg.addColorStop(1,shade(p.soil,-20));
  ctx.fillStyle=sg;
  ctx.beginPath();
  ctx.moveTo(0,soilTop);
  for(let x=0;x<=W;x+=W/20)ctx.lineTo(x,soilTop+Math.sin(x*0.02+t*0.0006)*6);
  ctx.lineTo(W,H); ctx.lineTo(0,H); ctx.closePath(); ctx.fill();
  // motes
  ctx.fillStyle=p.mote;
  motes.forEach(m=>{
    m.y-=m.spd*0.004; m.x+=Math.sin(t*0.0007+m.drift)*0.0006;
    if(m.y<-.05){m.y=1.05;m.x=rnd(0,1);}
    ctx.globalAlpha=.5;
    ctx.beginPath(); ctx.arc(m.x*W,m.y*H,m.r,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
}

/* ---------------- Plant drawing ---------------- */
function drawPlantBase(x,y,scale,ringColor){
  const p=pal();
  ctx.save();
  ctx.translate(x,y);
  const rw=27*scale, rh=10*scale;
  // soft shadow grounding the plant into the bed
  ctx.fillStyle='rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(1.5*scale,rh*0.55,rw*1.1,rh*1.0,0,0,7); ctx.fill();
  if(ringColor){
    // decorative garden edging (unlocked via Paint Kit)
    ctx.fillStyle=ringColor;
    ctx.beginPath(); ctx.ellipse(0,0,rw,rh,0,0,7); ctx.fill();
    ctx.fillStyle=shade(p.soil,18);
    ctx.beginPath(); ctx.ellipse(0,rh*0.08,rw*0.7,rh*0.62,0,0,7); ctx.fill();
  }else{
    // bare soil mound the plant is rooted in, blended with the ground
    const g=ctx.createRadialGradient(0,-rh*0.3,0,0,0,rw);
    g.addColorStop(0,shade(p.soil,24)); g.addColorStop(1,shade(p.soil,-10));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(0,0,rw,rh,0,0,7); ctx.fill();
  }
  ctx.restore();
}
function clusterBlobs(cx,cy,n,rBase,colors,wig){
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2+wig*0.2;
    const rr=rBase*(0.7+Math.sin(i*2.1)*0.15);
    const bx=cx+Math.cos(a)*rBase*0.55, by=cy+Math.sin(a)*rBase*0.4-rBase*0.3;
    ctx.fillStyle=colors[i%colors.length];
    ctx.beginPath(); ctx.ellipse(bx,by,rr*0.6,rr*0.5,a,0,7); ctx.fill();
  }
  ctx.fillStyle=colors[colors.length-1];
  ctx.beginPath(); ctx.arc(cx,cy-rBase*0.2,rBase*0.45,0,7); ctx.fill();
}
function drawPlant(e,t){
  const {f,sp,x,y}=e;
  const stage=plantStage(f);
  const growScale=0.35+stage*0.18;
  const scale=(0.55+(sp.size||1)*.45)*dispZoom*growScale;
  const wig=Math.sin(t*0.0012*(sp.spd||1)+e.phase)*0.12;
  drawPlantBase(x,y,dispZoom*(0.7+(sp.size||1)*.3),f.potColor||null);
  if(stage===0){
    ctx.save(); ctx.translate(x,y-2);
    ctx.fillStyle=sp.c[0];
    ctx.beginPath(); ctx.ellipse(0,0,7*dispZoom,5*dispZoom,0,0,7); ctx.fill();
    ctx.restore();
    return;
  }
  const baseY=y-4*dispZoom;
  const R=34*scale;
  ctx.save();
  ctx.translate(x,baseY);
  ctx.rotate(wig*0.3);
  if(sp.glow){
    ctx.save(); ctx.globalAlpha=.35;
    ctx.fillStyle=sp.c[1]; ctx.beginPath(); ctx.arc(0,-R*0.4,R*1.3,0,7); ctx.fill();
    ctx.restore();
  }
  if(sp.shape==='succulent'||sp.shape==='moss'){
    clusterBlobs(0,-R*0.25,sp.shape==='moss'?9:6,R*(sp.shape==='moss'?0.55:0.85),sp.c,wig);
  }else if(sp.shape==='vine'){
    ctx.strokeStyle=sp.c[0]; ctx.lineWidth=3*scale;
    for(let i=0;i<3;i++){
      const dir=(i-1)*0.5;
      ctx.beginPath(); ctx.moveTo(0,-R*0.1);
      const cx1=dir*R*0.6, cy1=-R*0.1+R*0.5+Math.sin(t*0.001+i)*4;
      const cx2=dir*R*1.1, cy2=R*0.9+Math.sin(t*0.0012+i)*4;
      ctx.quadraticCurveTo(cx1,cy1,cx2,cy2);
      ctx.stroke();
      for(let j=0;j<4;j++){
        const jt=j/4;
        const lx=cx2*jt, ly=(-R*0.1)+(cy2-(-R*0.1))*jt;
        ctx.fillStyle=sp.c[1];
        ctx.beginPath(); ctx.ellipse(lx,ly,4*scale,3*scale,dir,0,7); ctx.fill();
      }
    }
    ctx.fillStyle=sp.c[2]||sp.c[1];
    ctx.beginPath(); ctx.arc(0,-R*0.35,R*0.3,0,7); ctx.fill();
  }else if(sp.shape==='fern'){
    ctx.strokeStyle=sp.c[0];
    for(let i=-3;i<=3;i++){
      const a=(i/3)*1.1+wig;
      ctx.save(); ctx.rotate(a);
      ctx.lineWidth=2*scale;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-R*(0.8+Math.abs(i)*0.03)); ctx.stroke();
      for(let k=1;k<=5;k++){
        const ly=-R*(0.8)*(k/5);
        ctx.fillStyle=sp.c[1];
        ctx.beginPath(); ctx.ellipse(4*scale,ly,4*scale,2*scale,0,0,7); ctx.fill();
        ctx.beginPath(); ctx.ellipse(-4*scale,ly,4*scale,2*scale,0,0,7); ctx.fill();
      }
      ctx.restore();
    }
  }else if(sp.shape==='cactus'){
    ctx.fillStyle=sp.c[2]||sp.c[0];
    ctx.beginPath(); ctx.roundRect(-R*0.28,-R*0.9,R*0.56,R*0.9,R*0.28); ctx.fill();
    ctx.strokeStyle=shade(sp.c[2]||sp.c[0],-30); ctx.lineWidth=1.2*scale;
    for(let i=-1;i<=1;i++){ctx.beginPath(); ctx.moveTo(i*R*0.18,-R*0.85); ctx.lineTo(i*R*0.18,-R*0.05); ctx.stroke();}
    ctx.fillStyle=sp.c[0];
    ctx.beginPath(); ctx.arc(0,-R*0.95,R*0.22,0,7); ctx.fill();
    ctx.fillStyle=sp.c[1];
    for(let i=0;i<5;i++){
      const a=(i/5)*Math.PI*2;
      ctx.beginPath(); ctx.arc(Math.cos(a)*R*0.2,-R*0.95+Math.sin(a)*R*0.2,R*0.05,0,7); ctx.fill();
    }
  }else if(sp.shape==='flower'){
    ctx.strokeStyle=sp.c[0]; ctx.lineWidth=3*scale;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-R*0.85); ctx.stroke();
    ctx.fillStyle=sp.c[0];
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.ellipse(s*R*0.22,-R*0.45,R*0.22,R*0.12,s*0.6,0,7); ctx.fill();
    }
    const petals=6;
    for(let i=0;i<petals;i++){
      const a=(i/petals)*Math.PI*2;
      ctx.fillStyle=sp.c[2]||sp.c[1];
      ctx.beginPath(); ctx.ellipse(Math.cos(a)*R*0.22,-R*0.85+Math.sin(a)*R*0.22,R*0.16,R*0.09,a,0,7); ctx.fill();
    }
    ctx.fillStyle=sp.c[1];
    ctx.beginPath(); ctx.arc(0,-R*0.85,R*0.12,0,7); ctx.fill();
  }else if(sp.shape==='carnivorous'){
    ctx.strokeStyle=sp.c[0]; ctx.lineWidth=3*scale;
    for(const s of [-1,0,1]){
      ctx.beginPath(); ctx.moveTo(s*R*0.14,0); ctx.lineTo(s*R*0.3,-R*0.8); ctx.stroke();
      ctx.fillStyle=s===0?(sp.c[2]||sp.c[1]):sp.c[1];
      const open=(Math.sin(t*0.0015+e.phase+s)+1)/2*0.3+0.08;
      ctx.beginPath();
      ctx.ellipse(s*R*0.3,-R*0.82,R*0.16,R*0.1*(1+open),0,0,7);
      ctx.fill();
    }
  }else if(sp.shape==='fungus'){
    ctx.fillStyle=sp.c[0];
    for(const s of [-1,0,1]){
      const hh=R*(0.5+Math.abs(s)*0.15);
      ctx.fillRect(s*R*0.2-1.5*scale,-hh,3*scale,hh);
      ctx.fillStyle=sp.c[1];
      ctx.beginPath(); ctx.ellipse(s*R*0.2,-hh,R*0.16,R*0.1,0,Math.PI,0); ctx.fill();
      ctx.fillStyle=sp.c[2]||sp.c[0];
      ctx.beginPath(); ctx.arc(s*R*0.2,-hh,1.5*scale,0,7); ctx.fill();
      ctx.fillStyle=sp.c[0];
    }
  }else if(sp.shape==='bonsai'||sp.shape==='tree'){

    ctx.strokeStyle=sp.c[0]; ctx.lineWidth=(sp.shape==='tree'?7:5)*scale; ctx.lineCap='round';

    clusterBlobs(R*0.05,-trunkH,sp.shape==='tree'?10:7,R*(sp.shape==='tree'?0.75:0.55),[sp.c[1],sp.c[2]||sp.c[1],sp.c[1]],wig);
  }
  ctx.restore();
  // charm
  if(f.charm){

    if(cdef){
      ctx.save(); ctx.font=(16*dispZoom)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(cdef.e,x+18*dispZoom,y-8*dispZoom);
      ctx.restore();
    }
  }
  // name tag if low water
  if(f.water<25){
    ctx.save();
    ctx.font=(11*dispZoom)+'px sans-serif'; ctx.textAlign='center';
    ctx.fillStyle='#ffd9d9';
    ctx.fillText('💧?',x,y+16*dispZoom);

}

/* ---------------- Pests ---------------- */
let pests=[];
function maybeSpawnPest(){
  if(pests.length>=4)return;
  if(S.tidy>70)return;
  if(Math.random()>0.02)return;
  pests.push({x:rnd(0.1,0.9)*W,y:rnd(0.4,0.68)*H,vx:rnd(-.3,.3),vy:rnd(-.15,.15),born:now(),kind:pick(['🐛','🪲','🦟'])});
}
function drawPests(t){
  ctx.save();
  ctx.font=(18*dispZoom)+'px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  pests.forEach(p=>{
    p.x+=p.vx; p.y+=p.vy;
    if(p.x<0.05*W||p.x>0.95*W)p.vx*=-1;
    if(p.y<0.36*H||p.y>0.7*H)p.vy*=-1;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(Math.sin(now()*0.005)*0.2);
    ctx.fillText(p.kind,0,0);
    ctx.restore();
  });
  ctx.restore();
}
function tryPruneAt(x,y){
  for(let i=0;i<pests.length;i++){
    if(Math.hypot(pests[i].x-x,pests[i].y-y)<26){
      pests.splice(i,1);
      S.tidy=clamp(S.tidy+3,0,100); S.prunes++;
      addCoins(2,true,x,y); sfx('pop'); checkAch(); save();
      return true;
    }
  }
  return false;
}

/* ---------------- Water droplet fx ---------------- */
let drops=[];
function spawnDrops(x,y){
  for(let i=0;i<8;i++)drops.push({x,y,vx:rnd(-1.2,1.2),vy:rnd(-2.6,-1),life:1});
}
function stepDrops(){
  drops.forEach(d=>{d.x+=d.vx;d.y+=d.vy;d.vy+=0.14;d.life-=0.03;});
  drops=drops.filter(d=>d.life>0);
}
function drawDrops(){
  ctx.save();
  drops.forEach(d=>{
    ctx.globalAlpha=clamp(d.life,0,1);
    ctx.fillStyle='#7fd0ff';
    ctx.beginPath(); ctx.arc(d.x,d.y,3,0,7); ctx.fill();
  });
  ctx.restore();
}

/* ---------------- Sparkle / bloom fx (rare finds) ---------------- */
let blooms=[];
function spawnBloom(x,y,core,mid,maxR,maxLife,peak){
  blooms.push({x,y,core,mid,maxR,maxLife,peak,life:0});
}
function drawSparkle(x,y,r,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.beginPath();
  for(let i=0;i<4;i++){
    const a=(i/4)*Math.PI*2;
    ctx.moveTo(0,0);
    ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
  }
  ctx.strokeStyle='#fff'; ctx.lineWidth=r*0.15; ctx.stroke();
  ctx.restore();
}
function stepBlooms(dt){
  blooms.forEach(b=>b.life+=dt);
  blooms=blooms.filter(b=>b.life<b.maxLife);
}
function drawBlooms(t){
  blooms.forEach(b=>{
    const p=b.life/b.maxLife;
    const r=b.maxR*Math.min(1,p/b.peak);
    ctx.save();
    ctx.globalAlpha=1-p;
    const g=ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,r);
    g.addColorStop(0,b.core); g.addColorStop(1,b.mid);
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b.x,b.y,r,0,7); ctx.fill();
    drawSparkle(b.x,b.y,r*0.5,t*0.002);
    ctx.restore();
  });
}
function spawnRarityFx(e){
  const sp=e.sp;
  if(sp.r==='epic')spawnBloom(e.x,e.y-20,'#f2c8f2','#c79bff',60,1,0.4);
  else if(sp.r==='legend')spawnBloom(e.x,e.y-20,'#fff3c4','#e8c34d',80,1.3,0.4);
  else if(sp.r==='mythic')spawnBloom(e.x,e.y-20,'#ffffff','#a55eea',100,1.6,0.4);
  else if(sp.r==='ancient')spawnBloom(e.x,e.y-20,'#d5ffe9','#1d9450',120,2,0.4);
}

/* ---------------- Sim tick ---------------- */
let awaySummary=null;
function tickWorld(){
  const t=now();
  let el=(t-S.lastTick)/1000;
  if(!isFinite(el)||el<0)el=0;
  if(el>43200)el=43200;
  const wasAway=el>=120;
  S.lastTick=t;
  if(el<=0)return;
  const mins=el/60;
  const dd=diffDef(), pd=potDef(), td=toolDef();
  const slow=td.slow;
  const prevTidy=S.tidy;
  const bioload=S.plants.reduce((a,f)=>a+(spec(f.sp).size||1)*.05,0);
  const baseDecay=(0.24+bioload)*mins*2*dd.mossMul*pd.mossMul;
  const toolDecay=baseDecay*slow;
  const tidyHelpCount=S.plants.filter(f=>spec(f.sp).tidyHelp).length;
  const tidyHelpMul=Math.max(.6,1-tidyHelpCount*.08);
  const tidyBoostMul=tidyBoostActive()?Math.max(.05,1-(S.tidyBoost||0)):1;
  S.tidy=clamp(S.tidy-toolDecay*tidyHelpMul*tidyBoostMul,0,100);
  let autoCoins=0;
  if(slow<1){
    const avoided=baseDecay*(1-slow);
    const rawAuto=(avoided/2.4)*10+(S.autoTidyFrac||0);
    autoCoins=Math.floor(rawAuto);
    S.autoTidyFrac=rawAuto-autoCoins;
    if(autoCoins>0){S.prunes+=Math.round(avoided/2.4);addCoins(autoCoins,false);}
  }
  const waterHelpCount=S.plants.filter(f=>spec(f.sp).waterHelp).length;
  const waterHelpMul=Math.max(.7,1-waterHelpCount*.06);
  S.plants.forEach(f=>{
    const sp=spec(f.sp);
    f.water=clamp(f.water-0.4*sp.water*mins*dd.waterMul*td.waterMul*waterHelpMul,0,100);
  });
  const mdDef=misterDef();
  if(mdDef&&S.misterStock>0&&S.plants.length){
    S.misterAcc=(S.misterAcc||0)+mins;
    let guard=0;
    while(S.misterAcc>=mdDef.interval&&S.misterStock>0&&guard<1000){
      const per=22/S.plants.length;
      S.plants.forEach(f=>{f.water=clamp(f.water+per,0,100);});
      S.misterStock--; S.misterAcc-=mdDef.interval; guard++;
    }
    if(S.misterStock<=0)S.misterAcc=0;
  }
  S.water=S.plants.length?S.plants.reduce((a,f)=>a+f.water,0)/S.plants.length:100;
  const auraMul=S.plants.reduce((m,f)=>Math.max(m,spec(f.sp).incomeAura||1),1);
  let plantCoins=0, topPlant=null, topAmt=0;
  if(S.tidy>25){
    const seasonGrow=SEASONS[seasonNow()].growMul;
    const inc=S.plants.reduce((a,f)=>a+(f.water>25?spec(f.sp).income*plantLevelMul(f):0),0)*dd.incomeMul*pd.incomeMul*auraMul;
    const raw=inc*mins*Math.pow(S.tidy/100,1.6)*boostMul()+(S.coinFrac||0);
    plantCoins=Math.floor(raw);
    S.coinFrac=raw-plantCoins;
    if(plantCoins>0)addCoins(plantCoins,false);
    S.plants.forEach(f=>{
      if(f.water<=25)return;
      const sp=spec(f.sp);
      const growthMul=growthBoostActive()?(1+(S.growthBoost||0)):1;
      f.growth=(f.growth||0)+mins*0.06*(sp.xpMul||1)*seasonGrow*growthMul;
    });
    if(wasAway){
      S.plants.forEach(f=>{
        if(f.water<=25)return;
        const amt=spec(f.sp).income*plantLevelMul(f)*dd.incomeMul*pd.incomeMul*auraMul*mins*Math.pow(S.tidy/100,1.6)*boostMul();
        if(amt>topAmt){topAmt=amt;topPlant=f;}
      });
    }
  }
  if(Math.abs(prevTidy-S.tidy)>3){}
  if(wasAway&&(plantCoins+autoCoins)>0){
    awaySummary={total:plantCoins+autoCoins,plant:plantCoins,tidy:autoCoins,mins:mins,
      topName:topPlant?topPlant.name:null,topSp:topPlant?spec(topPlant.sp).n:null};
  }
}
function addCoins(n,fx,x,y){
  n=Math.round(n); if(n===0)return;
  S.coins+=n; if(n>0)S.totalCoins+=n;
  if(fx){ sfx('coin'); floatText(x,y,'+'+fmt(n)); }
  refreshHUD(); checkAch();
}
function spend(n){ if(S.coins<n)return false; S.coins-=n; refreshHUD(); save(); return true; }

/* ---------------- Interaction: pointer + tools ---------------- */
let armed=null; // 'water' | 'prune' | null
function setArmed(a){
  armed=(armed===a)?null:a;
  $('tWater').classList.toggle('armed',armed==='water');
  $('tPrune').classList.toggle('armed',armed==='prune');
  updateHint();
}
function updateHint(){
  const h=$('hint');
  if(armed==='water')h.textContent='Tap or drag across the terrarium to water';
  else if(armed==='prune')h.textContent='Tap weeds/bugs to tidy up';
  else h.textContent=S.plants.length?'Tap a plant to mist it':'Visit the Market to bring home your first plant';
}
function currentWater(){
  if(S.selWater&&S.waterInv[S.selWater]>0)return S.selWater;
  const w=WATERS.find(w=>S.waterInv[w.id]>0);
  return w?w.id:null;
}
function openWaterPicker(){
  const html=WATERS.map(w=>{
    const owned=S.waterInv[w.id]||0;
    const sel=currentWater()===w.id;
    return `<div class="row ${sel?'fx-boost':''}" data-pick-water="${w.id}" style="cursor:pointer">
      <div><div class="l">${esc(w.n)}</div><div class="d">+${w.fill} water each${owned?` · ${owned} in stock`:' · none in stock — buy in Market'}</div></div>
      <div class="mini ${owned?'good':'warn'}">${owned}</div>
    </div>`;
  }).join('');
  openModal('Choose water',`<div class="sbody" style="padding:0">${html}</div>`);
  $('sh2Body').querySelectorAll('[data-pick-water]').forEach(r=>r.addEventListener('click',()=>{
    S.selWater=r.dataset.pickWater; closeModal(); refreshHUD(); save();
  }));
}
function dropWater(x,y){
  const wid=currentWater();
  if(!wid||!S.waterInv[wid]){ toast('No water in stock — visit the Market','error'); return; }
  const e=findEntAt(x,y);
  const targets=e?[e]:ents;
  if(!targets.length)return;
  S.waterInv[wid]--; S.waters++;
  const wDef=WATERS.find(w=>w.id===wid);
  const per=wDef.fill/(e?1:Math.max(1,targets.length));
  targets.forEach(en=>{
    const f=en.f, sp=en.sp;
    const wasLow=f.water<30;
    f.water=clamp(f.water+per,0,100);
    if(sp.waterBonus&&wasLow)addCoins(sp.waterBonus,false);
    if(sp.luckyChance&&Math.random()<sp.luckyChance)rollLucky(f,en.x,en.y);
  });
  spawnDrops(x,y); sfx('water');
  refreshHUD(); refreshBoosts(); checkAch(); save();
}
const LUCKY_BONUS={common:80,rare:150,epic:280,legend:500,mythic:900,ancient:1800};
function rollLucky(f,x,y){
  const sp=spec(f.sp);
  const amt=LUCKY_BONUS[sp.r]||80;
  addCoins(amt,true,x,y);
  spawnBloom(x,y-10,'#fff3c4','#e8c34d',50,.9,.4);
  sfx('lucky'); toast('🍀 A lucky seed pod! +'+fmt(amt));
}
function scrub(x,y){
  if(tryPruneAt(x,y))return;
  S.tidy=clamp(S.tidy+2.5,0,100); S.prunes++;
  spawnDrops(x,y); sfx('prune');
  refreshHUD(); checkAch(); save();
}
function stackBoost(magKey,endKey,inc,dur,msg){
  const active=now()<(S[endKey]||0);
  S[magKey]=active?Math.min(2,(S[magKey]||0)+inc):inc;
  S[endKey]=now()+dur;
  toast(msg); refreshBoosts(); save();
}
const MIST_COIN_COOLDOWN=60000;
function mistPlant(e){
  const f=e.f, sp=e.sp;
  const before=plantStage(f);
  f.growth=(f.growth||0)+1.2;
  sfx('mist');
  if(now()-(f.lastMist||0)>=MIST_COIN_COOLDOWN){
    f.lastMist=now(); S.mists++;
    let coins=Math.round(4+plantLevel(f)*1.5);
    if(sp.doubleChance&&Math.random()<sp.doubleChance)coins*=2;
    addCoins(coins,true,e.x,e.y-30);
  }
  if(plantStage(f)>before)spawnRarityFx(e);
  refreshHUD(); checkAch(); save();
}
function pos(ev){
  const r=cv.getBoundingClientRect();
  const p=ev.touches?ev.touches[0]:ev;
  return {x:p.clientX-r.left,y:p.clientY-r.top};
}
let dragging=false;
function down(ev){
  audioInit(); audioResume();
  const p=pos(ev); dragging=true;
  if(armed==='water')dropWater(p.x,p.y);
  else if(armed==='prune')scrub(p.x,p.y);
  else{
    const e=findEntAt(p.x,p.y);
    if(e)mistPlant(e);
  }
}
function move(ev){
  if(!dragging)return;
  const p=pos(ev);
  if(armed==='water'&&Math.random()<0.35)dropWater(p.x,p.y);
  else if(armed==='prune')scrub(p.x,p.y);
}
function endPointer(){dragging=false;}
cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',endPointer);
cv.addEventListener('touchstart',e=>{e.preventDefault();down(e);},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();move(e);},{passive:false});
cv.addEventListener('touchend',endPointer);

let toastQ=[], toastBusy=false;

}

  if(!toastQ.length){toastBusy=false;return;}
  toastBusy=true;
  const {msg,kind}=toastQ.shift();
  const el=document.createElement('div');
  el.className='toast'+(kind==='gold'?' gold':'');
  el.textContent=msg;
  $('toasts').appendChild(el);

}

function grant(id){
  if(has(id))return;
  const a=ACHS.find(x=>x.id===id); if(!a)return;

function wireShop(t){
  $('shBody').querySelectorAll('[data-buy-seed]').forEach(b=>b.addEventListener('click',()=>{
    const sp=spec(b.dataset.buySeed);
    if(S.plants.length>=potDef().cap){toast('Terrarium is full — upgrade your pot','error');return;}
    if(!spend(sp.price)){toast('Not enough coins','error');return;}
    const used=S.plants.map(f=>f.name);
    S.plants.push({id:'p'+now()+Math.floor(Math.random()*999),sp:sp.id,name:newName(used,sp),born:now(),growth:STARTER_GROWTH,water:100,charm:null,potColor:null,lastMist:0,lastPropagate:0});
    sfx('buy'); toast('Welcome, '+sp.n+'!'); layoutPlants(); refreshHUD(); checkAch(); save(); openShop('seeds');
  }));
  $('shBody').querySelectorAll('[data-buy-water]').forEach(b=>b.addEventListener('click',()=>{
    const w=WATERS.find(x=>x.id===b.dataset.buyWater);
    if(w.price>0&&!spend(w.price))return;
    S.waterInv[w.id]=(S.waterInv[w.id]||0)+1; S.waterTried[w.id]=true;
    sfx('buy'); refreshHUD(); save(); openShop('water');
  }));
  $('shBody').querySelectorAll('[data-buy-pot]').forEach(b=>b.addEventListener('click',()=>{
    const lvl=+b.dataset.buyPot; const def=POTS[lvl-1];
    if(S.pot>=lvl)return;
    if(!spend(def.price))return;
    S.pot=lvl; sfx('buy'); toast('Upgraded to '+def.n); layoutPlants(); refreshHUD(); checkAch(); save(); openShop('pots');
  }));
  $('shBody').querySelectorAll('[data-buy-tool]').forEach(b=>b.addEventListener('click',()=>{
    const lvl=+b.dataset.buyTool; const def=TOOLS[lvl-1];
    if(S.tool>=lvl)return;
    if(!spend(def.price))return;
    S.tool=lvl; sfx('buy'); toast('New tool: '+def.n); refreshHUD(); checkAch(); save(); openShop('tools');
  }));
  $('shBody').querySelectorAll('[data-buy-mister]').forEach(b=>b.addEventListener('click',()=>{
    const lvl=+b.dataset.buyMister; const def=MISTERS[lvl-1];
    if(S.mister>=lvl)return;
    if(!spend(def.price))return;
    S.mister=lvl; S.misterStock=def.cap; sfx('buy'); toast('Installed: '+def.n); refreshHUD(); save(); openShop('tools');
  }));
  $('shBody').querySelectorAll('[data-deco]').forEach(d=>d.addEventListener('click',()=>{
    const def=DECOS.find(x=>x.id===d.dataset.deco);
    if(!S.decoOwned[def.id]){
      if(!spend(def.price))return;
      S.decoOwned[def.id]=true; sfx('buy');
    }
    const placedIdx=S.decoPlaced.findIndex(p=>p.id===def.id);
    if(placedIdx>=0)S.decoPlaced.splice(placedIdx,1);
    else S.decoPlaced.push({id:def.id});
    save(); checkAch(); openShop('decor');
  }));
  $('shBody').querySelectorAll('[data-theme]').forEach(th=>th.addEventListener('click',()=>{
    const def=THEMES.find(x=>x.id===th.dataset.theme);
    if(def.id!=='auto'&&!S.themesOwned[def.id]){
      if(!spend(def.price))return;
      S.themesOwned[def.id]=true; sfx('buy');
    }
    S.theme=def.id; musicSync(); save(); checkAch(); openShop('themes');
  }));
  $('shBody').querySelectorAll('[data-charm]').forEach(c=>c.addEventListener('click',()=>{
    const def=CHARMS.find(x=>x.id===c.dataset.charm);
    if(!S.charmsOwned[def.id]){
      if(!spend(def.price))return;
      S.charmsOwned[def.id]=true; sfx('buy'); toast("Charm unlocked — apply it from any plant's detail page.");
    }
    save(); openShop('charms');
  }));
}

    </div>

}
function openGarden(){
  const html=S.plants.length?S.plants.map(plantRowCard).join(''):
    `<div class="empty"><span class="e">🌱</span>Nothing planted yet.<br>Visit the Market to bring home your first seed.</div>`;
  openSheet('Garden',html,null,null,true,true);
  $('shBody').querySelectorAll('[data-open]').forEach(r=>r.addEventListener('click',()=>openPlant(r.dataset.open)));
}
function sellPrice(f){
  const sp=spec(f.sp);
  return Math.round((sp.price*0.4+plantLevel(f)*8)*(sp.sellBonus||1));
}
function propagateCost(sp){return Math.max(30,Math.round(sp.price*0.5));}
function canPropagate(f){
  const sp=spec(f.sp);
  return plantStage(f)>=3 && S.plants.filter(x=>x.sp===f.sp&&plantStage(x)>=3).length>=2 && (now()-(f.lastPropagate||0))>3600000;
}
function propagatePlant(id){
  const f=S.plants.find(x=>x.id===id); if(!f)return;
  const sp=spec(f.sp);
  if(!canPropagate(f)){toast('Needs another mature '+sp.n+' nearby, and an hour since its last cutting','error');return;}
  if(S.plants.length>=potDef().cap){toast('Terrarium is full','error');return;}
  const cost=propagateCost(sp);
  if(!spend(cost))return;
  f.lastPropagate=now();
  const used=S.plants.map(x=>x.name);
  S.plants.push({id:'p'+now()+Math.floor(Math.random()*999),sp:sp.id,name:newName(used,sp),born:now(),growth:STARTER_GROWTH,water:80,charm:null,potColor:null,lastMist:0,lastPropagate:0});
  S.propagations++; sfx('buy'); toast('A cutting took root! 🌿'); layoutPlants(); refreshHUD(); checkAch(); save(); openPlant(id);
}
function openPlant(id){
  const f=S.plants.find(x=>x.id===id);
  if(!f){ openGarden(); return; }
  const sp=spec(f.sp);
  const stage=plantStage(f);

/* ---------------- Minigames (3, daily) ---------------- */
function dayNum(t){const d=new Date(t); return d.getFullYear()*400+d.getMonth()*32+d.getDate();}

function canPlaySunCatch(){return (S.lastSunCatch||0)!==dayNum(now());}
function openSunCatch(){
  if(!canPlaySunCatch()){toast('Come back tomorrow for another round','error');return;}
  let score=0, timeLeft=12, running=true;
  openModal('Sun Catch',`
    <p style="opacity:.8;font-size:13px;margin-bottom:8px">Tap the sun drops before they fall! 12 seconds.</p>
    <div style="position:relative;height:220px;background:rgba(255,255,255,.06);border-radius:14px;overflow:hidden" id="scArena"></div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:800"><span>Score: <span id="scScore">0</span></span><span id="scTime">12s</span></div>
  `);
  const arena=$('scArena');
  const spawner=setInterval(()=>{
    if(!running)return;
    const d=document.createElement('div');
    d.textContent='☀️'; d.style.position='absolute'; d.style.left=rnd(5,85)+'%'; d.style.top='-30px';
    d.style.fontSize='26px'; d.style.transition='top 2.2s linear'; d.style.cursor='pointer';
    arena.appendChild(d);
    requestAnimationFrame(()=>{d.style.top='220px';});
    d.addEventListener('click',()=>{ if(!running)return; score++; $('scScore').textContent=score; d.remove(); sfx('pop'); });
    setTimeout(()=>d.remove(),2300);
  },550);
  const timer=setInterval(()=>{
    timeLeft--; $('scTime').textContent=timeLeft+'s';
    if(timeLeft<=0){
      clearInterval(timer); clearInterval(spawner); running=false; activeGameCleanup=null;
      const reward=score*15;
      S.lastSunCatch=dayNum(now());
      addCoins(reward,false); sfx('coin'); save(); checkAch();
      openModal('Sun Catch',`<div class="reward"><div class="big">☀️</div><h3>Caught ${score}!</h3><div class="amt">🪙 +${fmt(reward)}</div><p>Come back tomorrow for another round.</p></div><button class="btn wide" id="scDone">Nice</button>`);
      $('scDone').addEventListener('click',closeModal);
    }
  },1000);
  activeGameCleanup=()=>{clearInterval(timer);clearInterval(spawner);running=false;};
}

function canPlayBugSquish(){return (S.lastBugSquish||0)!==dayNum(now());}
function openBugSquish(){
  if(!canPlayBugSquish()){toast('Come back tomorrow for another round','error');return;}
  let score=0, timeLeft=12, running=true;
  const cells=9;
  openModal('Bug Squish',`
    <p style="opacity:.8;font-size:13px;margin-bottom:8px">Tap the bugs before they scurry off! 12 seconds.</p>
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px" id="bsGrid">
      ${Array.from({length:cells}).map((_,i)=>`<div class="deco" data-cell="${i}" style="height:64px;display:flex;align-items:center;justify-content:center"></div>`).join('')}
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:8px;font-weight:800"><span>Score: <span id="bsScore">0</span></span><span id="bsTime">12s</span></div>
  `);
  const cellsEl=[...document.querySelectorAll('[data-cell]')];
  let activeCell=-1;
  const pop=()=>{
    if(activeCell>=0)cellsEl[activeCell].textContent='';
    activeCell=Math.floor(Math.random()*cells);
    cellsEl[activeCell].textContent=pick(['🐛','🪲','🦟']);
  };
  cellsEl.forEach((c,i)=>c.addEventListener('click',()=>{
    if(!running||i!==activeCell||!c.textContent)return;
    score++; $('bsScore').textContent=score; c.textContent=''; activeCell=-1; sfx('pop');
  }));
  const spawner=setInterval(()=>{ if(running)pop(); },700);
  const timer=setInterval(()=>{
    timeLeft--; $('bsTime').textContent=timeLeft+'s';
    if(timeLeft<=0){
      clearInterval(timer); clearInterval(spawner); running=false; activeGameCleanup=null;
      const reward=score*15;
      S.lastBugSquish=dayNum(now());
      addCoins(reward,false); S.tidy=clamp(S.tidy+score*1.5,0,100); sfx('coin'); save(); checkAch();
      openModal('Bug Squish',`<div class="reward"><div class="big">🐞</div><h3>Squished ${score}!</h3><div class="amt">🪙 +${fmt(reward)}</div><p>Tidy boosted too. Come back tomorrow.</p></div><button class="btn wide" id="bsDone">Nice</button>`);
      $('bsDone').addEventListener('click',closeModal);
    }
  },1000);
  activeGameCleanup=()=>{clearInterval(timer);clearInterval(spawner);running=false;};
}

function canPlaySeedMatch(){return (S.lastSeedMatch||0)!==dayNum(now());}
function openSeedMatch(){
  if(!canPlaySeedMatch()){toast('Come back tomorrow for another round','error');return;}
  const icons=['🌱','🌻','🍀','🌵','🍄','🌿'];
  const deck=[...icons,...icons].sort(()=>Math.random()-.5);
  let first=null, lock=false, matched=0, moves=0;
  openModal('Seed Match',`
    <p style="opacity:.8;font-size:13px;margin-bottom:8px">Find all the matching seed pairs.</p>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px" id="smGrid">
      ${deck.map((_,i)=>`<div class="deco" data-card="${i}" style="height:56px;display:flex;align-items:center;justify-content:center;font-size:22px">❔</div>`).join('')}
    </div>
    <div style="margin-top:8px;font-weight:800">Moves: <span id="smMoves">0</span></div>
  `);
  const cards=[...document.querySelectorAll('[data-card]')];
  cards.forEach((c,i)=>c.addEventListener('click',()=>{
    if(lock||c.dataset.done||c===first)return;
    c.textContent=deck[i]; sfx('tap');
    if(!first){first=c; first._idx=i; return;}
    moves++; $('smMoves').textContent=moves;
    if(deck[first._idx]===deck[i]){
      c.dataset.done='1'; first.dataset.done='1'; matched++; first=null; sfx('pop');
      if(matched===icons.length){
        lock=true;
        const reward=Math.max(40,220-moves*8);
        S.lastSeedMatch=dayNum(now());
        addCoins(reward,false); sfx('coin'); save(); checkAch();
        setTimeout(()=>openModal('Seed Match',`<div class="reward"><div class="big">🌻</div><h3>Solved in ${moves} moves!</h3><div class="amt">🪙 +${fmt(reward)}</div><p>Come back tomorrow for another round.</p></div><button class="btn wide" id="smDone">Nice</button>`),400);
        setTimeout(()=>{const b=$('smDone'); if(b)b.addEventListener('click',closeModal);},450);
      }
    }else{
      lock=true;
      setTimeout(()=>{ c.textContent='❔'; first.textContent='❔'; first=null; lock=false; },600);
    }
  }));
}
function openMinigames(){
  openModal('Garden Games',`

    <button class="btn wide" id="openEncy">📖 Plant Compendium</button>
    <button class="btn wide ghost" id="openAchBtn" style="margin-top:8px">🏆 Achievements</button>
    <button class="btn wide ghost" id="openSlotsBtn" style="margin-top:8px">💾 Save slots</button>
    <button class="btn wide ghost" id="exportBtn" style="margin-top:8px">⬆️ Export save</button>
    <button class="btn wide ghost" id="importBtn" style="margin-top:8px">⬇️ Import save</button>
    <button class="btn wide" id="resetBtn" style="margin-top:14px;background:rgba(255,107,107,.3);color:#fff">Reset this terrarium</button>
  `);
  $('swSound').addEventListener('click',()=>{S.sound=!S.sound; if(A.sfxGain)A.sfxGain.gain.value=S.sound?.5:0; save(); openSettings();});
  $('swMusic').addEventListener('click',()=>{S.music=!S.music; if(A.musicGain)A.musicGain.gain.value=S.music?.25:0; if(S.music)musicSync(); else musicStop(); save(); openSettings();});
  $('openEncy').addEventListener('click',openEncyclopedia);
  $('openAchBtn').addEventListener('click',openAch);
  $('openSlotsBtn').addEventListener('click',openSaveSlots);
  $('exportBtn').addEventListener('click',exportSave);
  $('importBtn').addEventListener('click',importSave);
  $('resetBtn').addEventListener('click',()=>{
    if(!confirm("This wipes this terrarium's progress. Are you sure?"))return;
    const id=getActiveSlot();
    S=fresh(); S.onboarded=false;
    if(id){try{localStorage.setItem(slotKey(id),JSON.stringify(S));}catch(e){} updateSlotMeta(id);}
    closeModal(); location.reload();
  });
}
function openMenu(){
  openModal('Menu',`
    <button class="btn wide" id="mMarket">🛒 Market</button>
    <button class="btn wide" id="mGarden" style="margin-top:8px">🌿 Garden</button>
    <button class="btn wide" id="mGames" style="margin-top:8px">🎮 Garden Games</button>
    <button class="btn wide ghost" id="mSettings" style="margin-top:8px">⚙️ Settings</button>
  `);
  $('mMarket').addEventListener('click',()=>{closeModal();openShop();});
  $('mGarden').addEventListener('click',()=>{closeModal();openGarden();});
  $('mGames').addEventListener('click',()=>{closeModal();openMinigames();});
  $('mSettings').addEventListener('click',()=>{closeModal();openSettings();});
}
function openSaveSlots(){
  const slots=loadSlots(); const active=getActiveSlot();
  const html=slots.map(s=>`<div class="row"><div><div class="l">${esc(s.name)} ${s.id===active?'<span class="mini good">Active</span>':''}</div>
    <div class="d">${s.plantCount||0} plants · 🪙${fmt(s.coins||0)} · ${s.difficulty||'normal'}</div></div>
    <div style="display:flex;gap:6px">${s.id!==active?`<button class="btn btn-sm" data-switch="${s.id}">Play</button>`:''}${slots.length>1?`<button class="btn btn-sm ghost" data-del="${s.id}" style="background:rgba(255,107,107,.25)">Del</button>`:''}</div>
  </div>`).join('');
  openModal('Save slots',`${html}<button class="btn wide" id="newSlotBtn" style="margin-top:10px">+ New terrarium</button>`);
  $('sh2Body').querySelectorAll('[data-switch]').forEach(b=>b.addEventListener('click',()=>switchSlot(b.dataset.switch)));
  $('sh2Body').querySelectorAll('[data-del]').forEach(b=>b.addEventListener('click',()=>confirmDeleteSlot(b.dataset.del)));
  $('newSlotBtn').addEventListener('click',openNewSlotPicker);
}
function switchSlot(id){ setActiveSlot(id); closeModal(); location.reload(); }
function openNewSlotPicker(){
  openModal('New terrarium',`<input type="text" id="newSlotName" placeholder="Your name" maxlength="18"><button class="btn wide" id="newSlotGo" style="margin-top:10px">Start</button>`);
  $('newSlotGo').addEventListener('click',()=>{
    const name=$('newSlotName').value.trim()||'Plant Parent';
    const id='s'+Date.now();
    const fr=fresh(); fr.name=name; fr.onboarded=false;
    try{localStorage.setItem(slotKey(id),JSON.stringify(fr));}catch(e){}
    setActiveSlot(id); updateSlotMeta(id); closeModal(); location.reload();
  });
}
function confirmDeleteSlot(id){
  if(!confirm('Delete this terrarium forever?'))return;
  try{localStorage.removeItem(slotKey(id));}catch(e){}
  const slots=loadSlots().filter(s=>s.id!==id); saveSlots(slots);
  if(getActiveSlot()===id)setActiveSlot(slots[0]?slots[0].id:null);
  closeModal(); if(slots.length)openSaveSlots(); else location.reload();
}
function exportSave(){
  const data=JSON.stringify(S);
  openModal('Export save',`<p style="opacity:.75;font-size:12.5px;margin-bottom:8px">Copy this text somewhere safe.</p><textarea readonly style="width:100%;height:140px;background:rgba(0,0,0,.3);color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px">${esc(data)}</textarea>`);
}
function importSave(){
  openModal('Import save',`<textarea id="importArea" style="width:100%;height:140px;background:rgba(0,0,0,.3);color:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:11px" placeholder="Paste save text here"></textarea><button class="btn wide" id="importGo" style="margin-top:10px">Import</button>`);
  $('importGo').addEventListener('click',()=>{
    try{
      const d=JSON.parse($('importArea').value);
      const id=getActiveSlot()||('s'+Date.now());
      setActiveSlot(id);
      localStorage.setItem(slotKey(id),JSON.stringify(d));
      updateSlotMeta(id);
      closeModal(); location.reload();
    }catch(e){ toast("That didn't look like a valid save",'error'); }
  });
}

/* ---------------- Onboarding / daily / season ---------------- */
const ONBOARD=[
  {t:'Welcome to Mossling',b:'A tiny terrarium, yours to tend. Water it, keep it tidy, and watch it grow.'},
  {t:'💧 Water',b:'Tap WATER, then tap or drag across your plants to keep them hydrated.'},
  {t:'✂️ Prune',b:'Mess builds up over time — tap PRUNE to tidy weeds and squish the odd bug.'},
  {t:'🌿 Mist for coins',b:'With no tool armed, tap any plant directly to mist it for a little bonus.'},
];
function runOnboarding(i){
  if(i>=ONBOARD.length){ S.onboarded=true; save(); checkDaily(); checkSeason(); return; }
  const step=ONBOARD[i];
  openModal(step.t,`<p style="opacity:.85;font-size:14px;line-height:1.6">${step.b}</p><button class="btn wide" id="obNext" style="margin-top:14px">${i===ONBOARD.length-1?"Let's grow":'Next'}</button>`);
  $('obNext').addEventListener('click',()=>{closeModal(); runOnboarding(i+1);});
}
function showWelcomeBack(){
  if(!awaySummary||awaySummary.total<=0){awaySummary=null;return;}
  const hrs=awaySummary.mins/60;
  const timeStr=hrs>=1?Math.round(hrs)+'h':Math.round(awaySummary.mins)+'m';
  openModal('Welcome back!',`
    <div class="reward">
      <div class="big">🌿</div>
      <h3>Your garden grew!</h3>
      <p>While you were away for ${timeStr}, your plants kept working.</p>
      <div class="amt">🪙 +${fmt(awaySummary.total)}</div>
      ${awaySummary.topName?`<p style="margin-top:6px">${esc(awaySummary.topName)} the ${esc(awaySummary.topSp)} earned the most.</p>`:''}
    </div>
    <button class="btn wide" id="wbDone">Nice</button>
  `);
  $('wbDone').addEventListener('click',closeModal);
  awaySummary=null;
}
function checkDaily(){
  const d=dayNum(now());
  const lastDay=S.lastLogin?dayNum(S.lastLogin):0;
  if(lastDay===d)return;
  const streakAlive=lastDay===(d-1);
  S.streak=streakAlive?S.streak+1:1;
  S.lastLogin=now();
  const reward=20+Math.min(300,S.streak*15);
  setTimeout(()=>{
    openModal('Daily bonus',`
      <div class="reward"><div class="big">📅</div><h3>Day ${S.streak}</h3>
      <div class="amt">🪙 +${fmt(reward)}</div>
      <div class="streak">${Array.from({length:7}).map((_,i)=>`<i class="${(S.streak-1)%7>=i?'on':''}">${i+1}</i>`).join('')}</div>
      </div><button class="btn wide" id="dailyDone">Thanks</button>
    `);
    addCoins(reward,false); sfx('coin'); checkAch(); save();
    $('dailyDone').addEventListener('click',closeModal);
  },awaySummary?900:200);
}
function checkSeason(){
  const s=seasonNow();
  S.seasonsSeen[s]=true;
  if(S.seasonSeen!==s){
    S.seasonSeen=s;
    toast(SEASONS[s].emo+' '+SEASONS[s].name+' has arrived');
    musicSync();
  }
  checkAch(); save();
}

/* ---------------- Boot ---------------- */
let S=null;
function proceedIntoGame(){
  $('splash').classList.add('gone');
  audioInit(); audioResume(); musicSync();
  refreshHUD(); refreshBoosts();
  if(!S.onboarded){
    runOnboarding(0);
  }else{
    if(awaySummary)showWelcomeBack();
    checkDaily(); checkSeason();
  }
}
function startNewSlot(diffId,name){
  const id='s'+Date.now();
  const fr=fresh(); fr.name=name||'Plant Parent'; fr.difficulty=diffId; fr.onboarded=false;
  try{localStorage.setItem(slotKey(id),JSON.stringify(fr));}catch(e){}
  setActiveSlot(id); updateSlotMeta(id);
  S=load(); layoutPlants();
}
function renderDifficultyPicker(){
  openModal('Choose your pace',`
    ${DIFFICULTIES.map(d=>`<div class="row" data-diff="${d.id}" style="cursor:pointer"><div><div class="l">${esc(d.n)}</div><div class="d">${esc(d.d)}</div></div><div class="mini">Pick</div></div>`).join('')}
    <input type="text" id="startName" placeholder="Your name (optional)" style="margin-top:10px">
  `);
  $('sh2Body').querySelectorAll('[data-diff]').forEach(r=>r.addEventListener('click',()=>{
    const name=$('startName').value.trim();
    startNewSlot(r.dataset.diff,name);
    closeModal();
    proceedIntoGame();
  }));
}
function boot(){
  const activeId=ensureSlots();
  S=activeId?load():fresh();
  resize();
  refreshHUD();
  $('splash').addEventListener('click',function go(){
    $('splash').removeEventListener('click',go);
    $('splash').classList.add('gone');
    if(!activeId){ renderDifficultyPicker(); }
    else{ proceedIntoGame(); }
  },{once:true});

  $('coinChip').addEventListener('click',openShop);
  $('plantChip').addEventListener('click',openGarden);
  $('muteBtn').addEventListener('click',()=>{
    S.sound=!S.sound; S.music=!S.sound?false:S.music;
    if(A.sfxGain)A.sfxGain.gain.value=S.sound?.5:0;
    if(A.musicGain)A.musicGain.gain.value=(S.sound&&S.music)?.25:0;
    $('muteBtn').textContent=S.sound?'🔊':'🔇';
    if(!S.sound)musicStop(); else musicSync();
    save();
  });
  $('menuBtn').addEventListener('click',openMenu);
  $('tWater').addEventListener('click',()=>{
    if(waterCount()<=1&&!currentWater()){ openWaterPicker(); return; }
    if(armed!=='water'){ if(waterCount()>1)openWaterPicker(); }
    setArmed('water');
  });
  $('tWater').addEventListener('dblclick',openWaterPicker);
  $('tPrune').addEventListener('click',()=>setArmed('prune'));
  $('tShop').addEventListener('click',()=>openShop());
  $('tGarden').addEventListener('click',()=>openGarden());

  initFx();
  let last=performance.now();
  function loop(t){
    const dt=Math.min(0.1,(t-last)/1000); last=t;
    tickWorld();
    maybeSpawnPest();
    stepDrops(); stepBlooms(dt);
    bg(t);
    layoutDeco().forEach(d=>decoDraw(d,t));
    ents.slice().sort((a,b)=>a.y-b.y).forEach(e=>drawPlant(e,t));
    drawPests(t);
    drawDrops();
    drawBlooms(t);
    if(Math.random()<0.02)refreshHUD();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
  setInterval(()=>{ if(!$('splash').classList.contains('gone'))return; refreshHUD(); refreshBoosts(); },1000);
}
boot();
</script>
