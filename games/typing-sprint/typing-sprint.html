*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg); color:var(--text); font-family:var(--sans);
  display:flex; align-items:center; justify-content:center;
  transition:background .35s ease,color .35s ease;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#particles{position:fixed;inset:0;pointer-events:none;z-index:0}
#app{position:relative;z-index:1;width:100%;height:100%;max-width:640px;margin:0 auto;display:flex;flex-direction:column}

/* ---------- shared bits ---------- */
.screen{display:none;flex-direction:column;height:100%;padding:14px;gap:12px;overflow:hidden}
.screen.on{display:flex}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding-right:2px}
.topbar{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.topbar h2{margin:0;font-size:19px;letter-spacing:.02em;flex:1}
.iconbtn{
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  width:40px;height:40px;border-radius:12px;font-size:17px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:transform .1s,background .2s
}
.iconbtn:active{transform:scale(.93)}
.iconbtn.off{opacity:.4}
.btn{
  background:var(--panel);color:var(--text);border:1px solid var(--line);
  border-radius:14px;padding:14px 18px;font-size:15px;font-weight:600;font-family:var(--sans);
  cursor:pointer;transition:transform .1s,background .2s,border-color .2s;text-align:left;width:100%
}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--bg);border-color:transparent}
.btn.ghost{background:transparent}
.btn.row{display:flex;align-items:center;gap:12px}
.btn .ico{font-size:22px;line-height:1}
.btn .tt{font-size:16px;font-weight:700}
.btn .sub{font-size:12px;color:var(--dim);font-weight:500;margin-top:2px}
.btn.primary .sub{color:var(--bg);opacity:.75}
.grid{display:grid;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.muted{color:var(--dim);font-size:13px;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600}
h3{margin:0 0 8px;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

/* ---------- home ---------- */
.logo{text-align:center;padding:6px 0 2px;flex:0 0 auto}
.logo .word{
  font-family:var(--mono);font-size:clamp(30px,9vw,46px);font-weight:700;letter-spacing:.04em;
  display:inline-block
}
.logo .word i{font-style:normal;color:var(--accent)}
.logo .caret{display:inline-block;width:3px;height:1em;background:var(--accent2);vertical-align:-.13em;margin-left:3px;animation:blink 1.05s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.logo .tag{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);margin-top:4px}
.statstrip{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}

/* ---------- game ---------- */
#game{padding:0}
.hud{display:flex;align-items:center;gap:8px;padding:10px 12px 8px;flex:0 0 auto}
.hud .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 10px;min-width:60px;text-align:center}
.hud .box .k{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.hud .box .v{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.hud .spacer{flex:1}
#combobox.hot .v{color:var(--warn)}
#lives{letter-spacing:2px;font-size:15px}
.field{
  position:relative;flex:1;min-height:0;margin:0 10px;border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;background:
    linear-gradient(180deg,color-mix(in srgb,var(--panel) 60%,transparent),transparent 45%),var(--bg2)
}
.field .deadline{position:absolute;left:0;right:0;top:97.5%;border-top:2px dashed color-mix(in srgb,var(--bad) 60%,transparent);opacity:.75}
.field .lanes{position:absolute;inset:0;opacity:.35;pointer-events:none}
.field .lanes i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
.wordbox{
  position:absolute;transform:translate(-50%,0);white-space:nowrap;
  font-family:var(--mono);font-size:clamp(15px,4.4vw,22px);font-weight:600;letter-spacing:.02em;
  padding:5px 10px;border-radius:10px;color:var(--fall);
  background:color-mix(in srgb,var(--panel) 80%,transparent);
  border:1px solid var(--line);will-change:transform,top
}
.wordbox.active{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.wordbox.danger{border-color:var(--bad);animation:shiver .35s ease-in-out infinite alternate}
@keyframes shiver{from{transform:translate(-50%,0) rotate(-.7deg)}to{transform:translate(-50%,0) rotate(.7deg)}}
.wordbox b{color:var(--hit);font-weight:700}
.wordbox.bonus{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 22%,var(--panel))}
.pop{
  position:absolute;transform:translate(-50%,-50%);font-weight:800;font-size:15px;pointer-events:none;
  animation:pop .75s ease-out forwards;font-variant-numeric:tabular-nums
}
@keyframes pop{0%{opacity:1;scale:.7}30%{scale:1.1}100%{opacity:0;translate:0 -34px}}
.typedbar{
  flex:0 0 auto;margin:8px 10px 10px;padding:11px 14px;border-radius:14px;background:var(--panel);
  border:1px solid var(--line);font-family:var(--mono);font-size:16px;min-height:44px;
  display:flex;align-items:center;gap:2px;overflow:hidden
}
.typedbar .ph{color:var(--dim);font-family:var(--sans);font-size:13px}
.typedbar.err{border-color:var(--bad);animation:shake .18s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
#hiddenInput{position:absolute;opacity:0;pointer-events:none;height:1px;width:1px;left:-100px}
.flash{position:absolute;inset:0;background:var(--bad);opacity:0;pointer-events:none}
.flash.go{animation:fl .4s ease-out}
@keyframes fl{0%{opacity:.32}100%{opacity:0}}
.countdown{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:64px;font-weight:700;color:var(--accent);
  background:color-mix(in srgb,var(--bg) 72%,transparent);z-index:5
}

/* ---------- results / lists ---------- */
.big{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.kv{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.ach{display:flex;gap:11px;align-items:center;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);margin-bottom:8px;opacity:.5}
.ach.got{opacity:1;border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.ach .ico{font-size:22px;width:30px;text-align:center}
.ach .t{font-weight:700;font-size:14px}
.ach .d{font-size:12px;color:var(--dim)}
.themegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.swatch{border:2px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;text-align:left;font-size:11px;font-weight:700;color:#fff;position:relative;overflow:hidden}
.swatch::after{content:'';position:absolute;right:-14px;top:-14px;width:34px;height:34px;border-radius:50%;background:currentColor;opacity:.14}
.swatch.sel{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.swatch .dots{display:flex;gap:4px;margin-top:7px}
.swatch .dots i{width:11px;height:11px;border-radius:50%;display:block}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;background:transparent;border:0;color:var(--dim);padding:9px 4px;border-radius:9px;font-weight:700;font-size:13px;cursor:pointer;font-family:var(--sans)}
.seg button.sel{background:var(--accent);color:var(--bg)}
input.txt{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:12px;font-size:15px;font-family:var(--sans)
}
.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:var(--panel);border:1px solid var(--accent);border-radius:14px;padding:11px 16px;
  display:flex;gap:10px;align-items:center;box-shadow:0 10px 30px rgba(0,0,0,.35);
  animation:toast 3.4s ease forwards;max-width:88vw
}
@keyframes toast{0%{opacity:0;transform:translate(-50%,18px)}10%,88%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-8px)}}
.toast .t{font-size:13px;font-weight:700}
.toast .d{font-size:11px;color:var(--dim)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px}
.sheet .inner{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:380px;width:100%}
.hint{font-size:12px;color:var(--dim);text-align:center;padding:2px 0 0}
.bar{height:7px;border-radius:6px;background:var(--panel2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.chips{display:flex;gap:6px;flex-wrap:wrap}
@media(max-width:420px){.hud .box{min-width:52px;padding:5px 7px}.hud .box .v{font-size:15px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>

  const seen = new Set(), buckets = {};
  for (const w of WORDBANK) {
    if (seen.has(w)) continue;
    seen.add(w);
    (buckets[w.length] || (buckets[w.length] = [])).push(w);
  }
  return buckets;
})();

function wordsInRange(min, max) {
  let out = [];
  for (let n = min; n <= max; n++) if (WORDS_BY_LEN[n]) out = out.concat(WORDS_BY_LEN[n]);
  return out;
}

};

const LANES = 5;
const LOSE_Y = 93;          // % of field height — a word's box sits just above the line here
const BONUS_CHANCE = 0.07;  // after warm-up
const MAX_COMBO_MULT = 50;

/* ---------------- seeded rng ---------------- */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function dateKey(d) {
  const x = d || new Date();
  return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0');
}
function seedFromString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
function dailyDiffFor(key) {
  // rotates through the three middle tiers so the daily is always playable
  const pick = ['medium', 'hard', 'medium', 'expert', 'hard'];
  return pick[seedFromString(key + '#d') % pick.length];
}

/* ---------------- the game ---------------- */
class Game {
  constructor(opts) {
    this.mode = MODES[opts.mode];
    this.diff = DIFFS[opts.diff];
    this.rng = opts.rng || Math.random;
    this.pool = wordsInRange(this.diff.min, this.diff.max);
    this.recent = [];
    this.words = [];
    this.nextId = 1;
    this.activeId = null;
    this.spawnTimer = 0.6;
    this.elapsed = 0;
    this.timeLeft = this.mode.duration;
    this.penalty = 0;               // marathon seconds added
    this.bank = 0;                  // timed modes: seconds lost to misses (never positive)
    this.lives = this.mode.lives;
    this.score = 0;
    this.combo = 0;
    this.bestCombo = 0;
    this.cleared = 0;
    this.missed = 0;
    this.wave = 1;
    this.keys = 0;
    this.correct = 0;
    this.errors = 0;
    this.over = false;
    this.reason = '';
    this.laneY = new Array(LANES).fill(200);
  }

  /* --- derived --- */
  get speedMult() {
    if (this.mode.id === 'survival') return 1 + (this.wave - 1) * 0.11;
    return Math.min(2.3, 1 + this.elapsed * this.diff.ramp * this.mode.rampScale);
  }
  get comboMult() { return 1 + Math.min(this.combo, MAX_COMBO_MULT) * 0.05; }
  get accuracy() { return this.keys ? this.correct / this.keys : 1; }
  get wpm() {
    const mins = this.elapsed / 60;
    return mins > 0.02 ? (this.correct / 5) / mins : 0;
  }
  get clock() {
    if (this.mode.tally === 'down') return Math.max(0, this.timeLeft);
    return this.elapsed + this.penalty;
  }
  get progress() {
    if (this.mode.target) return this.cleared / this.mode.target;
    if (this.mode.tally === 'down') return 1 - Math.max(0, this.timeLeft) / this.mode.duration;
    return 0;
  }

  /* --- word picking --- */
  pickWord() {
    // No two words on screen may share a first letter: the key you press always
    // has exactly one possible target, so nothing is ever stolen mid-word.
    const taken = new Set(this.words.map(x => x.text[0]));
    let w = null;
    for (let guard = 0; guard < 60; guard++) {
      const c = this.pool[Math.floor(this.rng() * this.pool.length)];
      if (taken.has(c[0]) || this.recent.includes(c)) continue;
      w = c; break;
    }
    if (!w) {   // exhaustive fallback, still deterministic under a seeded rng
      const open = this.pool.filter(c => !taken.has(c[0]) && !this.recent.includes(c));
      const fallback = open.length ? open : this.pool.filter(c => !taken.has(c[0]));
      if (!fallback.length) return null;
      w = fallback[Math.floor(this.rng() * fallback.length)];
    }
    this.recent.push(w);
    if (this.recent.length > 25) this.recent.shift();
    return w;
  }

  pickLane() {
    // lane whose lowest word is furthest down; keeps columns from stacking
    let best = 0, bestY = -1;
    const order = [];
    for (let i = 0; i < LANES; i++) order.push(i);
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(this.rng() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    for (const l of order) {
      let top = 999;
      for (const w of this.words) if (w.lane === l) top = Math.min(top, w.y);
      if (top > bestY) { bestY = top; best = l; }
    }
    return best;
  }

  spawn(ev) {
    if (this.words.length >= this.diff.maxOn) return;
    const text = this.pickWord();
    if (!text) return;
    const lane = this.pickLane();
    const bonus = this.cleared >= 6 && this.rng() < BONUS_CHANCE;
    const jitter = (this.rng() - 0.5) * 5;
    const w = {
      id: this.nextId++, text, typed: 0, lane, bonus,
      x: Math.max(10, Math.min(90, ((lane + 0.5) / LANES) * 100 + jitter)),
      y: -5,
      speed: this.diff.speed * this.mode.speedScale * (0.88 + this.rng() * 0.26) * (bonus ? 1.15 : 1)
    };
    this.words.push(w);
    if (ev) ev.push({ type: 'spawn', word: w });
  }

  update(dt) {
    const ev = [];
    if (this.over) return ev;
    this.elapsed += dt;
    if (this.mode.tally === 'down') {
      // the clock is derived, so banked seconds can repay a miss but never extend the run
      this.timeLeft = this.mode.duration - this.elapsed + this.bank;
      if (this.timeLeft <= 0) { this.finish('time', ev); return ev; }
    }

    const mult = this.speedMult;
    for (let i = this.words.length - 1; i >= 0; i--) {
      const w = this.words[i];
      w.y += w.speed * mult * dt;
      if (w.y >= LOSE_Y) {
        this.words.splice(i, 1);
        if (this.activeId === w.id) this.activeId = null;
        this.missed++;
        this.combo = 0;
        ev.push({ type: 'miss', word: w });
        if (this.mode.lives) {
          this.lives--;
          if (this.lives <= 0) { this.finish('dead', ev); return ev; }
        }
        if (this.mode.missTime < 0) { this.bank += this.mode.missTime; this.timeLeft = this.mode.duration - this.elapsed + this.bank; }
        if (this.mode.missTime > 0) this.penalty += this.mode.missTime;
        if (this.mode.tally === 'down' && this.timeLeft <= 0) { this.finish('time', ev); return ev; }
      }
    }

    this.spawnTimer -= dt;
    if (this.spawnTimer <= 0) {
      this.spawn(ev);
      // an empty field refills quickly so a fast typist is never left waiting
      const pressure = this.words.length <= 1 ? 0.45
                     : this.words.length * 2 <= this.diff.maxOn ? 0.7 : 1;
      const gap = Math.max(0.34, this.diff.spawn * pressure / Math.max(1, mult * 0.92));
      this.spawnTimer = gap * (0.85 + this.rng() * 0.3);
    }
    return ev;
  }

  press(ch) {
    const ev = [];
    if (this.over || !/^[a-z]$/.test(ch)) return ev;
    this.keys++;
    let w = this.activeId ? this.words.find(x => x.id === this.activeId) : null;

    if (!w) {
      // lock onto the most urgent untouched word starting with this letter
      let best = null;
      for (const c of this.words) if (c.typed === 0 && c.text[0] === ch && (!best || c.y > best.y)) best = c;
      if (!best) { this.miss(ev); return ev; }
      w = best; this.activeId = w.id;
    }
    if (w.text[w.typed] !== ch) { this.miss(ev); return ev; }

    w.typed++;
    this.correct++;
    ev.push({ type: 'hit', word: w, progress: w.typed / w.text.length });
    if (w.typed >= w.text.length) this.clearWord(w, ev);
    return ev;
  }

  miss(ev) {
    this.errors++;
    this.combo = 0;
    ev.push({ type: 'error' });
  }

  clearWord(w, ev) {
    this.words = this.words.filter(x => x.id !== w.id);
    this.activeId = null;
    this.combo++;
    this.bestCombo = Math.max(this.bestCombo, this.combo);
    this.cleared++;
    const height = Math.round(Math.max(0, LOSE_Y - w.y) / 5);   // reward early kills
    let pts = Math.round((5 * w.text.length + height) * this.comboMult);
    if (w.bonus) pts *= 3;
    this.score += pts;
    if (w.bonus) {
      if (this.mode.lives) this.lives++;
      // banked seconds can only refund what misses took away, never extend the run
      else if (this.mode.tally === 'down') {
        this.bank = Math.min(0, this.bank + 3);
        this.timeLeft = this.mode.duration - this.elapsed + this.bank;
      }
      else this.penalty = Math.max(0, this.penalty - 3);
    }
    const oldWave = this.wave;
    this.wave = 1 + Math.floor(this.cleared / 12);
    ev.push({ type: 'clear', word: w, points: pts, combo: this.combo, bonus: w.bonus });
    if (this.wave > oldWave && this.mode.id === 'survival') ev.push({ type: 'wave', wave: this.wave });
    if (this.mode.target && this.cleared >= this.mode.target) this.finish('done', ev);
  }

  backspace() {
    if (this.over || !this.activeId) return;
    const w = this.words.find(x => x.id === this.activeId);
    if (!w) { this.activeId = null; return; }
    w.typed = Math.max(0, w.typed - 1);
    if (w.typed === 0) this.activeId = null;
  }

  release() {   // escape: drop the current target
    if (!this.activeId) return;
    const w = this.words.find(x => x.id === this.activeId);
    if (w) w.typed = 0;
    this.activeId = null;
  }

  finish(reason, ev) {
    if (this.over) return;
    this.over = true;
    this.reason = reason;
    (ev || []).push({ type: 'end', reason });
  }

  summary() {
    return {
      mode: this.mode.id, diff: this.diff.id, reason: this.reason,
      score: this.score, cleared: this.cleared, missed: this.missed,
      bestCombo: this.bestCombo, wave: this.wave,
      wpm: Math.round(this.wpm), accuracy: Math.round(this.accuracy * 100),
      time: Math.round((this.mode.tally === 'down' ? this.elapsed : this.elapsed + this.penalty) * 10) / 10,
      keys: this.keys, correct: this.correct
    };
  }
}

function evalAchievements(save, run) {
  const got = [];
  const has = id => !!save.ach[id];
  const give = id => { if (!has(id)) { save.ach[id] = Date.now(); got.push(id); } };
  const T = save.totals;

  if (T.words >= 1) give('first');
  if (T.words >= 100) give('w100');
  if (T.words >= 500) give('w500');
  if (T.words >= 2000) give('w2000');
  if (T.bestCombo >= 10) give('combo10');
  if (T.bestCombo >= 25) give('combo25');
  if (T.bestCombo >= 50) give('combo50');

  if (run) {
    if (run.cleared >= 15) {
      if (run.wpm >= 40) give('wpm40');
      if (run.wpm >= 60) give('wpm60');
      if (run.wpm >= 80) give('wpm80');
      if (run.wpm >= 100) give('wpm100');
    }
    if (run.accuracy === 100 && run.cleared >= 25) give('flawless');
    if (run.mode === 'survival' && run.wave >= 10) give('wave10');
    if (run.mode === 'marathon' && run.reason === 'done') {
      give('marathon');
      if (run.time <= 80) give('marafast');
    }
    if (run.score >= 5000) give('score5k');
    if (run.diff === 'insane' && run.cleared >= 20) give('insane');
    if (run.mode === 'sprint' && run.missed === 0 && run.cleared >= 10) give('nomiss');
  }
  if (MODE_ORDER.every(m => save.modesPlayed[m])) give('allmodes');
  if (DIFF_ORDER.every(d => save.diffsPlayed[d])) give('alldiffs');
  if (save.daily.streak >= 3) give('daily3');
  if (save.daily.streak >= 7) give('daily7');
  return got;
}

/* ---------------- save state ---------------- */
function freshSave() {
  return {
    v: 1, name: '', theme: 'neon', sfx: true, music: true,
    lastMode: 'sprint', lastDiff: 'medium',
    totals: { words: 0, missed: 0, runs: 0, keys: 0, correct: 0, time: 0, bestCombo: 0, score: 0 },
    best: { sprint: 0, survivalWave: 0, survivalScore: 0, marathonTime: 0, zen: 0, daily: 0, wpm: 0 },
    ach: {}, modesPlayed: {}, diffsPlayed: {},
    daily: { last: '', streak: 0, bestStreak: 0, bestScore: 0 }
  };
}

function applyRun(save, run) {
  const T = save.totals, B = save.best;
  T.words += run.cleared; T.missed += run.missed; T.runs += 1;
  T.keys += run.keys; T.correct += run.correct; T.time += run.time;
  T.score += run.score;
  T.bestCombo = Math.max(T.bestCombo, run.bestCombo);
  save.modesPlayed[run.mode] = true;
  save.diffsPlayed[run.diff] = true;
  if (run.cleared >= 10) B.wpm = Math.max(B.wpm, run.wpm);
  if (run.mode === 'sprint') B.sprint = Math.max(B.sprint, run.score);
  if (run.mode === 'zen') B.zen = Math.max(B.zen, run.score);
  if (run.mode === 'survival') {
    B.survivalWave = Math.max(B.survivalWave, run.wave);
    B.survivalScore = Math.max(B.survivalScore, run.score);
  }
  if (run.mode === 'marathon' && run.reason === 'done') {
    B.marathonTime = B.marathonTime ? Math.min(B.marathonTime, run.time) : run.time;
  }
  return save;
}

function registerDaily(save, key, score) {
  const d = save.daily;
  if (d.last === key) { d.bestScore = Math.max(d.bestScore, score); return false; }
  const y = new Date(key + 'T12:00:00');
  y.setDate(y.getDate() - 1);
  const yKey = dateKey(y);
  d.streak = (d.last === yKey) ? d.streak + 1 : 1;
  d.last = key;
  d.bestStreak = Math.max(d.bestStreak, d.streak);
  d.bestScore = Math.max(d.bestScore, score);
  return true;
}

const Audio2 = (function () {
  let ctx = null, master = null, musicGain = null, sfxGain = null;
  let timer = null, step = 0, nextTime = 0, kit = 'default';
  const SCALES = {
    default: [0, 2, 4, 7, 9], warm: [0, 3, 5, 7, 10], bright: [0, 2, 4, 7, 11], deep: [0, 2, 3, 7, 8]
  };
  let scale = SCALES.default, root = 220, wave = 'triangle', tempo = 0.5;

  function init() {
    if (ctx) return true;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();
    master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
    sfxGain = ctx.createGain(); sfxGain.gain.value = 0.5; sfxGain.connect(master);
    musicGain = ctx.createGain(); musicGain.gain.value = 0.0; musicGain.connect(master);
    return true;
  }
  function resume() { if (ctx && ctx.state === 'suspended') ctx.resume(); }

  function tone(freq, dur, type, vol, when, slideTo) {
    if (!ctx) return;
    const t = when || ctx.currentTime;
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol || 0.2), t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(sfxGain);
    o.start(t); o.stop(t + dur + 0.02);
  }
  function noise(dur, vol, hp) {
    if (!ctx) return;
    const n = Math.floor(ctx.sampleRate * dur);
    const buf = ctx.createBuffer(1, n, ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = ctx.createBufferSource(); src.buffer = buf;
    const f = ctx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 1200;
    const g = ctx.createGain(); g.gain.value = vol || 0.1;
    src.connect(f); f.connect(g); g.connect(sfxGain); src.start();
  }

  const sfx = {
    key:   () => tone(520 + Math.random() * 60, 0.035, 'square', 0.045),
    hit:   p  => tone(360 + p * 420, 0.05, 'triangle', 0.09),
    clear: () => { const b = kit === 'deep' ? 300 : 440; [0, 4, 7, 12].forEach((s, i) => tone(b * Math.pow(2, s / 12), 0.16, wave, 0.13, ctx && ctx.currentTime + i * 0.035)); },
    bonus: () => [0, 5, 9, 12, 16].forEach((s, i) => tone(520 * Math.pow(2, s / 12), 0.22, 'sine', 0.15, ctx && ctx.currentTime + i * 0.05)),
    error: () => { tone(150, 0.11, 'sawtooth', 0.1, 0, 90); noise(0.05, 0.05, 800); },
    miss:  () => { tone(260, 0.34, 'sine', 0.16, 0, 70); noise(0.12, 0.05, 400); },
    wave:  () => [0, 7, 12, 19].forEach((s, i) => tone(330 * Math.pow(2, s / 12), 0.3, 'triangle', 0.13, ctx && ctx.currentTime + i * 0.08)),
    over:  () => [12, 7, 3, 0].forEach((s, i) => tone(330 * Math.pow(2, s / 12), 0.4, 'sine', 0.15, ctx && ctx.currentTime + i * 0.13)),
    ach:   () => [0, 4, 7, 12, 16].forEach((s, i) => tone(523 * Math.pow(2, s / 12), 0.26, 'sine', 0.14, ctx && ctx.currentTime + i * 0.06)),
    ui:    () => tone(600, 0.05, 'sine', 0.07),
    tick:  () => tone(880, 0.07, 'sine', 0.1),
    go:    () => { tone(660, 0.12, 'triangle', 0.14); tone(990, 0.2, 'triangle', 0.12, ctx && ctx.currentTime + 0.1); }
  };

  function play(name, arg) {
    if (!S.sfx) return;
    if (!init()) return;
    resume();
    (sfx[name] || sfx.ui)(arg);
  }

  /* ambient bed — a slow pad plus a sparse arpeggio, all synthesised */
  function schedule() {
    if (!ctx) return;
    while (nextTime < ctx.currentTime + 0.4) {
      const beat = step % 16;
      const deg = scale[(step * 3) % scale.length];
      const oct = beat % 8 === 0 ? 0 : (beat % 4 === 0 ? 12 : (step % 5 === 0 ? 12 : 0));
      if (beat % 2 === 0) {
        const f = root * Math.pow(2, (deg + oct) / 12);
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = wave; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, nextTime);
        g.gain.exponentialRampToValueAtTime(0.06, nextTime + 0.08);
        g.gain.exponentialRampToValueAtTime(0.0001, nextTime + tempo * 1.8);
        o.connect(g); g.connect(musicGain); o.start(nextTime); o.stop(nextTime + tempo * 2);
      }
      if (beat === 0) {
        [0, 7, 16].forEach(s => {
          const o = ctx.createOscillator(), g = ctx.createGain();
          o.type = 'sine'; o.frequency.value = (root / 2) * Math.pow(2, s / 12);
          g.gain.setValueAtTime(0.0001, nextTime);
          g.gain.exponentialRampToValueAtTime(0.05, nextTime + 0.6);
          g.gain.exponentialRampToValueAtTime(0.0001, nextTime + tempo * 15);
          o.connect(g); g.connect(musicGain); o.start(nextTime); o.stop(nextTime + tempo * 16);
        });
      }
      nextTime += tempo; step++;
    }
  }
  function setTheme(id) {
    const t = { ete:['bright',262,'triangle',.46,'default'], printemps:['bright',294,'sine',.5,'bright'],
      automne:['warm',196,'triangle',.58,'warm'], hiver:['deep',233,'sine',.62,'deep'],
      ocean:['deep',196,'sine',.6,'deep'], neon:['default',220,'sawtooth',.4,'default'],
      calme:['warm',175,'sine',.68,'warm'], romantique:['warm',233,'triangle',.56,'warm'],
      energie:['bright',262,'square',.36,'bright'], creativite:['default',247,'triangle',.44,'default'],
      minimaliste:['default',220,'sine',.66,'default'], nature:['warm',196,'triangle',.6,'warm'],
      fancy:['deep',207,'triangle',.58,'deep'] }[id] || ['default', 220, 'triangle', .5, 'default'];
    scale = SCALES[t[0]] || SCALES.default; root = t[1]; wave = t[2]; tempo = t[3]; kit = t[4];
  }
  function music(on) {
    if (!on) { if (musicGain) musicGain.gain.setTargetAtTime(0, ctx.currentTime, 0.3); if (timer) { clearInterval(timer); timer = null; } return; }
    if (!init()) return;
    resume();
    if (!timer) { nextTime = ctx.currentTime + 0.1; step = 0; timer = setInterval(schedule, 90); }
    musicGain.gain.setTargetAtTime(0.5, ctx.currentTime, 0.6);
  }
  function unlock() { if (init()) resume(); }
  return { play, music, setTheme, unlock, get ready() { return !!ctx; } };
})();

/* ---------------- particles ---------------- */
const Particles = (function () {
  const cv = document.getElementById('particles');
  const cx = cv.getContext('2d');
  let items = [], cfg = null, raf = null, last = 0, w = 0, h = 0;
  function size() { w = cv.width = innerWidth; h = cv.height = innerHeight; }
  addEventListener('resize', size); size();
  function set(kind) {
    cfg = PARTICLES[kind] || null; items = [];
    if (!cfg) { cx.clearRect(0, 0, w, h); if (raf) cancelAnimationFrame(raf); raf = null; return; }
    for (let i = 0; i < cfg.n; i++) items.push(mk(true));
    if (!raf) { last = performance.now(); raf = requestAnimationFrame(loop); }
  }
  function mk(spread) {
    const s = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
    return {
      g: cfg.glyphs[Math.floor(Math.random() * cfg.glyphs.length)],
      x: Math.random() * w,
      y: cfg.drift === 'rise' ? (spread ? Math.random() * h : h + 30) : (spread ? Math.random() * h : -30),
      s, v: cfg.speed[0] + Math.random() * (cfg.speed[1] - cfg.speed[0]),
      p: Math.random() * Math.PI * 2, a: 0.5 + Math.random() * 0.5, r: (Math.random() - .5) * 0.6
    };
  }
  function loop(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    cx.clearRect(0, 0, w, h);
    if (!cfg) { raf = null; return; }
    cx.globalAlpha = cfg.alpha;
    for (let i = 0; i < items.length; i++) {
      const p = items[i];
      p.p += dt * 0.9;
      if (cfg.drift === 'rise') { p.y -= p.v * dt; p.x += Math.sin(p.p) * 12 * dt; if (p.y < -40) items[i] = mk(false); }
      else { p.y += p.v * dt; p.x += (cfg.drift === 'sway' ? Math.sin(p.p) * 26 : Math.sin(p.p) * 10) * dt; if (p.y > h + 40) items[i] = mk(false); }
      cx.save();
      cx.translate(p.x, p.y);
      if (cfg.drift === 'sway') cx.rotate(Math.sin(p.p) * p.r);
      cx.font = p.s + 'px serif';
      cx.globalAlpha = cfg.alpha * p.a;
      cx.fillText(p.g, 0, 0);
      cx.restore();
    }
    raf = requestAnimationFrame(loop);
  }
  return { set };
})();

/* ---------------- helpers ---------------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]));
const fmtTime = s => {
  s = Math.max(0, s);
  const m = Math.floor(s / 60), r = s - m * 60;
  return m + ':' + (r < 10 ? '0' : '') + r.toFixed(r < 10 && m === 0 ? 1 : 0).replace(/\.0$/, '');
};
const clock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

function applyTheme(id) {
  const t = THEMES.find(x => x.id === id) || THEMES[11];
  document.documentElement.setAttribute('data-theme', t.id);
  document.querySelector('meta[name=theme-color]').setAttribute('content', t.sw[2]);
  Particles.set(t.part);
  Audio2.setTheme(t.id);
}

let toastQ = [];
function toast(ico, title, desc) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = '<div style="font-size:22px">' + ico + '</div><div><div class="t">' + esc(title) + '</div><div class="d">' + esc(desc) + '</div></div>';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}
function grantAchievements(run) {
  const got = evalAchievements(S, run);
  save();
  got.forEach((id, i) => {
    const a = ACHIEVEMENTS.find(x => x.id === id);
    setTimeout(() => { toast(a.ico, a.t, 'Achievement unlocked'); Audio2.play('ach'); }, 500 + i * 900);
  });
  return got;
}

      (recent.length ? recent.map(a => '<div class="ach got"><div class="ico">' + a.ico + '</div><div><div class="t">' + a.t + '</div><div class="d">' + a.d + '</div></div></div>').join('')
        : '<div class="muted">Nothing yet. Clear a word to open the first one.</div>') +
      '<button class="btn ghost row" data-act="nav:ach" style="margin-top:6px"><span class="ico">🏆</span><span><span class="tt">See all awards</span></span></button>' +
    '</div>' +
    '<button class="btn ghost row" data-act="reset" style="margin-top:10px"><span class="ico">🗑️</span><span><span class="tt">Erase all progress</span>' +
      '<span class="sub">Scores, awards and streaks</span></span></button>' +
    '</div></div>';
}

function settingsScreen() {
  let h = '<div class="screen on">' + header('Settings', 'home') + '<div class="scroll">' +
    '<div class="card"><h3>Sound</h3>' +
      '<div class="seg" style="margin-bottom:8px"><button data-act="set:music:1" class="' + (S.music ? 'sel' : '') + '">Music on</button>' +
      '<button data-act="set:music:0" class="' + (!S.music ? 'sel' : '') + '">Off</button></div>' +
      '<div class="seg"><button data-act="set:sfx:1" class="' + (S.sfx ? 'sel' : '') + '">Effects on</button>' +
      '<button data-act="set:sfx:0" class="' + (!S.sfx ? 'sel' : '') + '">Off</button></div>' +
      '<div class="muted" style="margin-top:8px">Seasonal themes carry their own ambience and effect kit.</div></div>';
  for (const grp of ['Season', 'Mood']) {
    h += '<div class="card" style="margin-top:10px"><h3>' + (grp === 'Season' ? 'Seasons' : 'Moods') + '</h3><div class="themegrid">';
    for (const t of THEMES.filter(x => x.group === grp)) {
      h += '<div class="swatch' + (S.theme === t.id ? ' sel' : '') + '" data-act="theme:' + t.id + '" ' +
        'style="background:linear-gradient(135deg,' + t.sw[2] + ',' + t.sw[2] + ');color:' + (isLight(t.sw[2]) ? '#222' : '#fff') + '">' +
        t.name + (t.part ? ' ✦' : '') + '<div class="dots"><i style="background:' + t.sw[0] + '"></i><i style="background:' + t.sw[1] + '"></i></div></div>';
    }
    h += '</div></div>';
  }
  h += '<div class="card" style="margin-top:10px"><h3>About</h3><div class="muted">Typing Sprint runs entirely on this device. ' +
    'No account, no network, no files — sounds are synthesised as they play and progress lives in this browser.</div></div>';
  return h + '</div></div>';
}
function isLight(hex) {
  const n = parseInt(hex.slice(1), 16);
  return (((n >> 16) & 255) * 299 + ((n >> 8) & 255) * 587 + (n & 255) * 114) / 1000 > 150;
}

function helpScreen() {
  return '<div class="screen on">' + header('How to play', 'home') + '<div class="scroll">' +
    '<div class="card"><h3>The loop</h3><div class="muted">Words drift down the field. Type a word\'s first letter to lock onto it, ' +
      'then type the rest. Finish it and it bursts before it lands.<br><br>' +
      'No two words on screen ever start with the same letter, so the key you press always has one target.</div></div>' +
    '<div class="card" style="margin-top:10px"><h3>Keys</h3>' +
      kv('Backspace', 'Undo a letter — empties back to a free target') +
      kv('Escape or ⏸', 'Pause') +
      '<div class="muted" style="margin-top:8px">On a phone, tap the field to raise the keyboard.</div></div>' +
    '<div class="card" style="margin-top:10px"><h3>Scoring</h3><div class="muted">Longer words pay more, and catching one high on the field pays more still. ' +
      'Each word in a row raises your multiplier up to 3.5×; a wrong key resets it.<br><br>' +
      'Gold words are worth triple and hand back a life in Survival, or three seconds in the timed modes.</div></div>' +
    '<div class="card" style="margin-top:10px"><h3>Modes</h3><div class="muted">' +
      MODE_ORDER.map(id => MODES[id].ico + ' <b>' + MODES[id].label + '</b> — ' + MODES[id].sub).join('<br>') +
      '</div></div>' +
    '</div></div>';
}

/* ---------------- navigation ---------------- */
function go(name) {
  screen = name;
  stopLoop();
  const html = { home: homeScreen, modes: modesScreen, diffs: diffScreen, ach: achScreen,
    profile: profileScreen, settings: settingsScreen, help: helpScreen }[name];
  if (html) app.innerHTML = html();
  if (name === 'profile') {
    const el = document.getElementById('nameInput');
    el.addEventListener('change', () => { S.name = el.value.trim().slice(0, 18); save(); });
    el.addEventListener('blur', () => { S.name = el.value.trim().slice(0, 18); save(); });
  }
  app.scrollTop = 0;
}

/* ---------------- game runtime ---------------- */
let raf = null, lastT = 0, nodes = new Map(), fieldEl = null, barEl = null, paused = false, countdown = 0;
let hudScore, hudCombo, hudWpm, hudClock, hudWords, hudWave, hudLives, cdEl, flashEl;
let pendingRun = null;

function startGame(mode, diff, seeded) {
  sel.mode = mode; sel.diff = diff;
  S.lastMode = mode; S.lastDiff = diff; save();
  const key = dateKey();
  G = new Game({ mode, diff, rng: seeded ? mulberry32(seedFromString(key)) : Math.random });
  screen = 'game';
  app.innerHTML = gameScreen();
  fieldEl = document.getElementById('field');
  barEl = document.getElementById('typedbar');
  hudScore = document.getElementById('hScore'); hudCombo = document.getElementById('hCombo');
  hudWpm = document.getElementById('hWpm'); hudClock = document.getElementById('hClock');
  hudWave = document.getElementById('hWave'); hudLives = document.getElementById('lives');
  hudWords = document.getElementById('hWords');
  cdEl = document.getElementById('cd'); flashEl = document.getElementById('flash');
  nodes.clear(); paused = false; countdown = 3.0;
  Audio2.unlock();
  Audio2.music(S.music);
  focusInput();
  lastT = performance.now();
  raf = requestAnimationFrame(loop);
}
function stopLoop() { if (raf) { cancelAnimationFrame(raf); raf = null; } }

function focusInput() {
  hidden.value = '\u200b'.repeat(12);
  try { hidden.focus({ preventScroll: true }); } catch (e) { hidden.focus(); }
}

function loop(t) {
  raf = requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - lastT) / 1000);
  lastT = t;
  if (paused) return;

  if (countdown > 0) {
    const before = Math.ceil(countdown);
    countdown -= dt;
    const now = Math.ceil(countdown);
    if (now !== before) { if (now > 0) { cdEl.textContent = now; Audio2.play('tick'); } }
    if (countdown <= 0) { cdEl.textContent = 'GO'; Audio2.play('go'); setTimeout(() => cdEl && (cdEl.style.display = 'none'), 320); }
    return;
  }

  const events = G.update(dt);
  for (const e of events) handleEvent(e);
  if (!G || G.over) return;
  draw();
}

function handleEvent(e) {
  if (e.type === 'miss') {
    Audio2.play('miss');
    if (flashEl && flashEl.isConnected) { flashEl.classList.remove('go'); void flashEl.offsetWidth; flashEl.classList.add('go'); }
  } else if (e.type === 'wave') {
    Audio2.play('wave');
    popText(50, 40, 'WAVE ' + e.wave, 'var(--warn)');
  } else if (e.type === 'end') {
    endRun();
  }
}

function draw() {
  // words
  for (const w of G.words) {
    let n = nodes.get(w.id);
    if (!n) {
      n = document.createElement('div');
      n.className = 'wordbox' + (w.bonus ? ' bonus' : '');
      n.style.left = w.x + '%';
      n.dataset.typed = '-1';
      fieldEl.appendChild(n);
      nodes.set(w.id, n);
    }
    if (n.dataset.typed !== String(w.typed)) {
      n.dataset.typed = String(w.typed);
      n.innerHTML = w.typed ? '<b>' + esc(w.text.slice(0, w.typed)) + '</b>' + esc(w.text.slice(w.typed)) : esc(w.text);
      n.classList.toggle('active', G.activeId === w.id);
    }
    n.style.top = w.y + '%';
    const danger = w.y > 70;
    if (danger !== n.classList.contains('danger')) n.classList.toggle('danger', danger);
  }
  for (const [id, n] of nodes) if (!G.words.some(w => w.id === id)) { n.remove(); nodes.delete(id); }

  // hud
  hudScore.textContent = G.score;
  hudCombo.textContent = G.combo ? G.combo + '×' : '0';
  document.getElementById('combobox').classList.toggle('hot', G.combo >= 10);
  hudWpm.textContent = Math.round(G.wpm);
  if (hudLives) {
    hudLives.textContent = '❤'.repeat(Math.max(0, Math.min(5, G.lives))) + (G.lives > 5 ? '+' : '');
    hudWave.textContent = G.wave;
  } else if (hudClock) {
    hudClock.textContent = clock(G.clock);
    if (hudWords) hudWords.textContent = G.cleared + '/' + G.mode.target;
  }

  // typed bar
  const w = G.activeId ? G.words.find(x => x.id === G.activeId) : null;
  if (w) {
    barEl.innerHTML = '<b style="color:var(--hit)">' + esc(w.text.slice(0, w.typed)) + '</b>' +
      '<span style="color:var(--dim)">' + esc(w.text.slice(w.typed)) + '</span>';
  } else if (barEl.dataset.state !== 'idle') {
    barEl.innerHTML = '<span class="ph">Type the first letter of any word</span>';
  }
  barEl.dataset.state = w ? 'typing' : 'idle';
}

function popText(x, y, text, color) {
  const el = document.createElement('div');
  el.className = 'pop';
  el.style.left = x + '%'; el.style.top = y + '%'; el.style.color = color || 'var(--good)';
  el.textContent = text;
  fieldEl.appendChild(el);
  setTimeout(() => el.remove(), 780);
}

function type(ch) {
  if (!G || G.over || paused || countdown > 0) return;
  const evs = G.press(ch);
  let cleared = null, err = false, finished = false;
  for (const e of evs) {
    if (e.type === 'hit') Audio2.play('hit', e.progress);
    if (e.type === 'error') { err = true; Audio2.play('error'); }
    if (e.type === 'clear') cleared = e;
    if (e.type === 'end') finished = true;
  }
  if (err && barEl.isConnected) { barEl.classList.remove('err'); void barEl.offsetWidth; barEl.classList.add('err'); }
  if (cleared) {
    Audio2.play(cleared.bonus ? 'bonus' : 'clear');
    const n = nodes.get(cleared.word.id);
    if (n) { n.remove(); nodes.delete(cleared.word.id); }
    if (!finished) popText(cleared.word.x, cleared.word.y,
      '+' + cleared.points + (cleared.combo > 2 ? ' ×' + cleared.combo : ''),
      cleared.bonus ? 'var(--warn)' : 'var(--good)');
  }
  if (finished) endRun(); else if (G && !G.over) draw();
}

function endRun() {
  if (!G) return;
  stopLoop();
  const run = G.summary();
  const wasBest = {
    sprint: run.score > S.best.sprint, zen: run.score > S.best.zen,
    survival: run.wave > S.best.survivalWave,
    marathon: run.reason === 'done' && (!S.best.marathonTime || run.time < S.best.marathonTime),
    daily: run.score > S.daily.bestScore
  }[run.mode];
  applyRun(S, run);
  let dailyNew = false;
  if (run.mode === 'daily') dailyNew = registerDaily(S, dateKey(), run.score);
  save();
  Audio2.play('over');
  const g = G; G = null;
  screen = 'results';
  app.innerHTML = resultsScreen(run, !!wasBest, dailyNew);
  grantAchievements(run);
  hidden.blur();
}

function togglePause(force) {
  if (!G || G.over) return;
  paused = force === undefined ? !paused : force;
  if (paused) {
    hidden.blur();
    const s = document.createElement('div');
    s.className = 'sheet'; s.id = 'pauseSheet';
    s.innerHTML = '<div class="inner"><h2 style="margin:0 0 4px">Paused</h2>' +
      '<div class="muted" style="margin-bottom:14px">' + MODES[sel.mode].label + ' · ' + DIFFS[sel.diff].label +
      ' · ' + plural(G.cleared, 'word') + ' cleared</div>' +
      '<div class="grid">' +
      '<button class="btn primary row" data-act="resume"><span class="ico">▶</span><span><span class="tt">Resume</span></span></button>' +
      '<button class="btn row" data-act="retry"><span class="ico">↻</span><span><span class="tt">Restart</span></span></button>' +
      '<button class="btn ghost row" data-act="quit"><span class="ico">🏠</span><span><span class="tt">Quit to home</span></span></button>' +
      '</div></div>';
    document.body.appendChild(s);
  } else {
    const s = document.getElementById('pauseSheet');
    if (s) s.remove();
    focusInput();
    lastT = performance.now();
  }
}

/* ---------------- input ---------------- */
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (screen === 'game') { e.preventDefault(); togglePause(); }
    return;
  }
  if (screen !== 'game' || paused) {
    if (e.key === 'Enter' && screen === 'home') { e.preventDefault(); startGame(sel.mode, sel.diff, false); }
    return;
  }
  if (document.activeElement === hidden) return;    // the input event path handles it
  if (e.key === 'Backspace') { e.preventDefault(); G && G.backspace(); return; }
  if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) { e.preventDefault(); Audio2.play('key'); type(e.key.toLowerCase()); }
});

hidden.addEventListener('input', () => {
  if (screen !== 'game' || paused) { hidden.value = '\u200b'.repeat(12); return; }
  const v = hidden.value;
  const pad = 12;
  const typedPart = v.replace(/\u200b/g, '');
  const zeros = v.length - typedPart.length;
  if (typedPart) {
    for (const ch of typedPart) {
      if (/[a-zA-Z]/.test(ch)) { Audio2.play('key'); type(ch.toLowerCase()); }
    }
  } else if (zeros < pad) {
    G && G.backspace();
  }
  hidden.value = '\u200b'.repeat(pad);
});
hidden.addEventListener('blur', () => { if (screen === 'game' && !paused) setTimeout(() => { if (screen === 'game' && !paused) focusInput(); }, 120); });
document.addEventListener('click', e => {
  if (screen === 'game' && !paused && !e.target.closest('[data-act]')) focusInput();
});
document.addEventListener('visibilitychange', () => { if (document.hidden && screen === 'game') togglePause(true); });

/* ---------------- actions ---------------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const [verb, a, b] = el.dataset.act.split(':');
  Audio2.unlock();
  if (verb !== 'pause') Audio2.play('ui');

  switch (verb) {
    case 'nav':
      if (a === 'diffs') { go('diffs'); } else go(a);
      break;
    case 'mode':
      sel.mode = a; go('diffs'); break;
    case 'diff':
      startGame(sel.mode, a, sel.mode === 'daily'); break;
    case 'daily': {
      const key = dateKey();
      sel.mode = 'daily';
      startGame('daily', dailyDiffFor(key), true);
      break;
    }
    case 'start':
      startGame(sel.mode, sel.diff, sel.mode === 'daily'); break;
    case 'retry': {
      const s = document.getElementById('pauseSheet'); if (s) s.remove();
      startGame(sel.mode, sel.diff, sel.mode === 'daily'); break;
    }
    case 'resume': togglePause(false); break;
    case 'quit': {
      const s = document.getElementById('pauseSheet'); if (s) s.remove();
      G = null; go('home'); break;
    }
    case 'pause': togglePause(); break;
    case 'toggle':
      if (a === 'music') { S.music = !S.music; Audio2.music(S.music); }
      else { S.sfx = !S.sfx; }
      save(); refresh(); break;
    case 'set':
      if (a === 'music') { S.music = b === '1'; Audio2.music(S.music); }
      else { S.sfx = b === '1'; }
      save(); refresh(); break;
    case 'theme':
      S.theme = a; save(); applyTheme(a); refresh(); break;
    case 'reset':
      if (confirm('Erase every score, award and streak on this device? This cannot be undone.')) {
        const theme = S.theme, name = S.name;
        S = freshSave(); S.theme = theme; S.name = name;
        save(); go('home');
      }
      break;
  }
});
function refresh() {
  if (screen === 'game' || screen === 'results') { syncSoundBtns(); return; }
  go(screen);
}

/* ---------------- boot ---------------- */
applyTheme(S.theme);
go('home');
// browsers only allow audio after a gesture: start the bed on the first one
const firstGesture = () => {
  Audio2.unlock();
  Audio2.music(S.music);
  removeEventListener('pointerdown', firstGesture);
  removeEventListener('keydown', firstGesture);
};
addEventListener('pointerdown', firstGesture);
addEventListener('keydown', firstGesture);
addEventListener('touchmove', e => { if (screen === 'game') e.preventDefault(); }, { passive: false });
window.addEventListener('beforeunload', save);
})();

</script>
</body>
</html>
